; Shire Journey visual-economy scalability ladder.
// Recommended preset intentionally keeps native resolution and strong texture/AA/post quality,
// recovering cost first from shadows, effects and foliage. Final values remain device-profile candidates.

[TextureQuality@0]
r.Streaming.MipBias=2
r.MaxAnisotropy=2
r.Streaming.PoolSize=300

[TextureQuality@1]
r.Streaming.MipBias=1
r.MaxAnisotropy=4
r.Streaming.PoolSize=500

[TextureQuality@2]
r.Streaming.MipBias=0
r.MaxAnisotropy=4
r.Streaming.PoolSize=700

[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.Streaming.PoolSize=1000

[ShadowQuality@0]
r.Shadow.MaxResolution=512
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=0.40

[ShadowQuality@1]
r.Shadow.MaxResolution=768
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=0.60

[ShadowQuality@2]
r.Shadow.MaxResolution=1024
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.80

[ShadowQuality@3]
r.Shadow.MaxResolution=1024
r.Shadow.CSM.MaxCascades=3
r.Shadow.DistanceScale=1.00

[FoliageQuality@0]
foliage.DensityScale=0.25
grass.DensityScale=0.25

[FoliageQuality@1]
foliage.DensityScale=0.45
grass.DensityScale=0.45

[FoliageQuality@2]
foliage.DensityScale=0.70
grass.DensityScale=0.70

[FoliageQuality@3]
foliage.DensityScale=1.00
grass.DensityScale=1.00

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.45

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.65

[ViewDistanceQuality@2]
r.ViewDistanceScale=0.85

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.00
