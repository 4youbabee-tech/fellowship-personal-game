name: P1C01 Frodo UE4 Animation Import

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Source/ShireJourneyEditorTools/Public/ShireFrodoAnimationImportCommandlet.h'
      - 'Source/ShireJourneyEditorTools/Private/ShireFrodoAnimationImportCommandlet.cpp'
      - 'Scripts/test_p1c01_frodo_ue4_animation_import_contract.py'
      - 'Scripts/ci_build_unreal.cmd'
      - 'Scripts/verify_runner_session.ps1'
      - 'Scripts/resolve_runtime_python.ps1'
      - 'ShireJourney.uproject'
      - 'Config/**'
      - 'SourceAssets/ValidatedRuntime/FRODO/**'
      - '.github/workflows/p1c01-frodo-ue4-animation-import.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p1c01-frodo-ue4-animation-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUMAN_RUN_ID: 37243788900
  RETARGET_RUN_ID: 37273783111
  TARGET_FBX_SHA: 75d715f6ce4673a650a4382bc4f86b7ae0baf0fe548cc63f9b6ded1800f669be
  IDLE_FBX_SHA: ee81650714587d2a1a638f3ff0c1a8239ea555bf84959e96ce5d037af3f33cd3
  WALK_FBX_SHA: c4091b7881a4e9e810e70bb7f3abed58683dff5bacf54e26ccb2e926e4c9e688
  RUN_FBX_SHA: 4a4d10d91343dbd701c535d30ea9d9384ca74596cd7720cf6bfdd1c6328e1fc1

jobs:
  hosted_artifact_preflight:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'production/p1c01-definitive-chapter-closeout-2026-10-04') && github.ref_name != 'production/p1c01-definitive-chapter-closeout-2026-10-04' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify checkout and contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m unittest Scripts/test_p1c01_frodo_ue4_animation_import_contract.py
      - name: Download exact Human artifact
        uses: actions/download-artifact@v4
        with:
          name: p1c01-human-wave2-hosted-157e4e857406a2ce28c18c96cdacfedfd0b07ab5
          path: ${{ runner.temp }}/frodo-preflight/human
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HUMAN_RUN_ID }}
      - name: Download exact retarget artifact
        uses: actions/download-artifact@v4
        with:
          name: p1c01-frodo-hosted-retarget-be2815e278da30e3474158bc197686f521fb81c1
          path: ${{ runner.temp }}/frodo-preflight/retarget
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RETARGET_RUN_ID }}
      - name: Verify exact artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frodo-preflight"
          test -f "$root/human/normalized/candidate_02.fbx"
          test -f "$root/retarget/output/Frodo_Idle_Retarget.fbx"
          test -f "$root/retarget/output/Frodo_Walk_Retarget.fbx"
          test -f "$root/retarget/output/Frodo_Run_Retarget.fbx"
          echo "$TARGET_FBX_SHA  $root/human/normalized/candidate_02.fbx" | sha256sum -c -
          echo "$IDLE_FBX_SHA  $root/retarget/output/Frodo_Idle_Retarget.fbx" | sha256sum -c -
          echo "$WALK_FBX_SHA  $root/retarget/output/Frodo_Walk_Retarget.fbx" | sha256sum -c -
          echo "$RUN_FBX_SHA  $root/retarget/output/Frodo_Run_Retarget.fbx" | sha256sum -c -

  ue4_animation_import:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'production/p1c01-definitive-chapter-closeout-2026-10-04') && github.ref_name != 'production/p1c01-definitive-chapter-closeout-2026-10-04' }}
    needs: hosted_artifact_preflight
    runs-on: [self-hosted, Windows, X64, ue4-27]
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify runner and checkout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { throw "FRODO_UE4_EXACT_CHECKOUT_FAIL" }
          & ".\Scripts\verify_runner_session.ps1"
      - name: Download exact Human artifact
        uses: actions/download-artifact@v4
        with:
          name: p1c01-human-wave2-hosted-157e4e857406a2ce28c18c96cdacfedfd0b07ab5
          path: ${{ runner.temp }}\frodo-ue4-animation\human
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HUMAN_RUN_ID }}
      - name: Download exact retarget artifact
        uses: actions/download-artifact@v4
        with:
          name: p1c01-frodo-hosted-retarget-be2815e278da30e3474158bc197686f521fb81c1
          path: ${{ runner.temp }}\frodo-ue4-animation\retarget
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RETARGET_RUN_ID }}
      - name: Verify hashes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $checks = @(
            @("$env:RUNNER_TEMP\frodo-ue4-animation\human\normalized\candidate_02.fbx", "$env:TARGET_FBX_SHA"),
            @("$env:RUNNER_TEMP\frodo-ue4-animation\retarget\output\Frodo_Idle_Retarget.fbx", "$env:IDLE_FBX_SHA"),
            @("$env:RUNNER_TEMP\frodo-ue4-animation\retarget\output\Frodo_Walk_Retarget.fbx", "$env:WALK_FBX_SHA"),
            @("$env:RUNNER_TEMP\frodo-ue4-animation\retarget\output\Frodo_Run_Retarget.fbx", "$env:RUN_FBX_SHA")
          )
          foreach ($row in $checks) {
            if (-not (Test-Path -LiteralPath $row[0] -PathType Leaf)) { throw "FRODO_PAYLOAD_MISSING" }
            if ((Get-FileHash -LiteralPath $row[0] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $row[1]) { throw "FRODO_HASH_FAIL" }
          }
      - name: Build editor
        shell: cmd
        run: call Scripts\ci_build_unreal.cmd
      - name: Import exact animation bundle
        shell: cmd
        run: |
          @echo off
          set "EDITORCMD=C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe"
          set "LOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-FrodoAnimationImport.log"
          if not exist "%EDITORCMD%" exit /b 50
          "%EDITORCMD%" "%GITHUB_WORKSPACE%\ShireJourney.uproject" -run=ShireFrodoAnimationImport -TargetFbx="%RUNNER_TEMP%\frodo-ue4-animation\human\normalized\candidate_02.fbx" -AnimationDir="%RUNNER_TEMP%\frodo-ue4-animation\retarget\output" -unattended -nop4 -nosplash -NoSound -abslog="%LOG%"
          if errorlevel 1 exit /b %ERRORLEVEL%
          findstr /C:"UE4_ANIMATION_IMPORT_TECHNICAL_PASS clips=3 bones=48" "%LOG%" >nul
          if errorlevel 1 exit /b 51
          echo P1C01_FRODO_UE4_ANIMATION_IMPORT_GATE_PASS
