name: Unreal Build Validation

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-build-develop
  cancel-in-progress: false

jobs:
  unreal-build:
    name: UE4.27.2 C++ Build
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 45

    steps:
      - name: Bootstrap Windows runner tools
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          where git.exe >nul 2>nul
          if not errorlevel 1 (
            for /f "delims=" %%G in ('where git.exe') do (
              echo Found Git: %%G
              goto :git_ready
            )
          )

          for %%G in ("C:\Program Files\Git\cmd\git.exe" "C:\Program Files (x86)\Git\cmd\git.exe") do (
            if exist "%%~G" (
              set "GITDIR=%%~dpG"
              echo Found Git: %%~G
              echo !GITDIR!>>"%GITHUB_PATH%"
              set "PATH=!GITDIR!;%PATH%"
              goto :git_ready
            )
          )

          echo Git is not visible to the Windows service. Bootstrapping a private MinGit copy for CI...
          set "MINGIT_ROOT=%RUNNER_TEMP%\mingit-2.55.0.5"
          set "MINGIT_ZIP=%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
          set "MINGIT_URL=https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip"

          if not exist "!MINGIT_ROOT!\cmd\git.exe" (
            if exist "!MINGIT_ROOT!" rmdir /S /Q "!MINGIT_ROOT!"
            if exist "!MINGIT_ZIP!" del /Q "!MINGIT_ZIP!"

            curl.exe -L --retry 3 --retry-delay 3 -o "!MINGIT_ZIP!" "!MINGIT_URL!"
            if errorlevel 1 (
              echo ERROR: Failed to download MinGit.
              exit /b 20
            )

            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '!MINGIT_ZIP!' -DestinationPath '!MINGIT_ROOT!' -Force"
            if errorlevel 1 (
              echo ERROR: Failed to extract MinGit.
              exit /b 21
            )
          )

          set "GITDIR=!MINGIT_ROOT!\cmd"
          set "GITBIN=!MINGIT_ROOT!\mingw64\bin"
          echo !GITDIR!>>"%GITHUB_PATH%"
          echo !GITBIN!>>"%GITHUB_PATH%"
          set "PATH=!GITDIR!;!GITBIN!;%PATH%"

          :git_ready
          git --version
          if errorlevel 1 (
            echo ERROR: Git bootstrap did not produce a working git.exe.
            exit /b 22
          )

          echo Runner bootstrap succeeded.

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: true

      - name: Verify Unreal 4.27.2 and project
        shell: cmd
        run: |
          @echo off
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "UEROOT=C:\Program Files\Epic Games\UE_4.27"
          set "BUILDBAT=C:\Program Files\Epic Games\UE_4.27\Engine\Build\BatchFiles\Build.bat"
          set "BUILDVERSION=C:\Program Files\Epic Games\UE_4.27\Engine\Build\Build.version"

          if not exist "%PROJECT%" (
            echo ERROR: ShireJourney.uproject was not found at "%PROJECT%"
            exit /b 30
          )
          if not exist "%BUILDBAT%" (
            echo ERROR: UE4 Build.bat was not found at "%BUILDBAT%"
            exit /b 31
          )
          if not exist "%BUILDVERSION%" (
            echo ERROR: UE4 Build.version was not found at "%BUILDVERSION%"
            exit /b 32
          )

          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$v = Get-Content '%BUILDVERSION%' -Raw | ConvertFrom-Json; Write-Host ('Detected Unreal Engine {0}.{1}.{2}' -f $v.MajorVersion,$v.MinorVersion,$v.PatchVersion); if ($v.MajorVersion -ne 4 -or $v.MinorVersion -ne 27 -or $v.PatchVersion -ne 2) { exit 33 }"
          if errorlevel 1 (
            echo ERROR: Expected Unreal Engine 4.27.2.
            exit /b 33
          )

      - name: Refuse build while Unreal Editor is open
        shell: cmd
        run: |
          @echo off
          tasklist /FI "IMAGENAME eq UE4Editor.exe" | find /I "UE4Editor.exe" >nul
          if not errorlevel 1 (
            echo ERROR: UE4Editor.exe is open. Close Unreal Editor before automated validation.
            exit /b 40
          )
          echo Unreal Editor is closed.
          exit /b 0

      - name: Build ShireJourneyEditor
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "BUILDBAT=C:\Program Files\Epic Games\UE_4.27\Engine\Build\BatchFiles\Build.bat"
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          set "BUILDLOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-UnrealBuild.log"

          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          echo Building exact commit: %GITHUB_SHA%
          echo Project: %PROJECT%
          echo Build log: %BUILDLOG%

          call "%BUILDBAT%" ShireJourneyEditor Win64 Development "%PROJECT%" -WaitMutex -NoHotReloadFromIDE > "%BUILDLOG%" 2>&1
          set "BUILD_EXIT=%ERRORLEVEL%"

          type "%BUILDLOG%"

          if not "%BUILD_EXIT%"=="0" (
            echo ERROR: UE4.27.2 build failed with exit code %BUILD_EXIT%.
            exit /b %BUILD_EXIT%
          )

          echo UE4.27.2 build succeeded.

      - name: Import production assets in UE4.27.2
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "EDITORCMD=C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe"
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          set "IMPORTLOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-ProductionAssetImport.log"

          if not exist "%EDITORCMD%" (
            echo ERROR: UE4Editor-Cmd.exe was not found at "%EDITORCMD%"
            exit /b 50
          )
          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          echo Importing production source assets for exact commit: %GITHUB_SHA%
          "%EDITORCMD%" "%PROJECT%" -run=ShireProductionImport -unattended -nop4 -nosplash -NoSound -abslog="%IMPORTLOG%"
          set "IMPORT_EXIT=%ERRORLEVEL%"

          if exist "%IMPORTLOG%" (
            findstr /I /C:"ShireProductionImport:" /C:"ShireProductionImport FAILED" /C:"Error:" /C:"Warning:" "%IMPORTLOG%"
          )

          if not "%IMPORT_EXIT%"=="0" (
            echo ERROR: UE4.27.2 production asset import failed with exit code %IMPORT_EXIT%.
            exit /b %IMPORT_EXIT%
          )

          findstr /C:"ShireProductionImport:" "%IMPORTLOG%" | findstr /C:"0 failures" >nul
          if errorlevel 1 (
            echo ERROR: Production asset import did not report zero failures.
            exit /b 51
          )

          echo UE4.27.2 production asset import succeeded.

      - name: Collect Unreal build logs
        if: always()
        shell: cmd
        run: |
          @echo off
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          if exist "%LOCALAPPDATA%\UnrealBuildTool\Log.txt" (
            copy /Y "%LOCALAPPDATA%\UnrealBuildTool\Log.txt" "%LOGDIR%\CI-UnrealBuildTool.log" >nul
          )

          echo UE4.27.2 build job status: ${{ job.status }}>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %GITHUB_SHA%>>"%GITHUB_STEP_SUMMARY%"

      - name: Upload build logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ue4-build-logs-${{ github.run_number }}
          path: |
            Saved/Logs/CI-UnrealBuild.log
            Saved/Logs/CI-UnrealBuildTool.log
            Saved/Logs/CI-ProductionAssetImport.log
            Saved/Logs/*.log
            Saved/Logs/*.txt
          if-no-files-found: warn
          retention-days: 14
