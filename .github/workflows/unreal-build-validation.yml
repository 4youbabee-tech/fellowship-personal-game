name: Unreal Build Validation

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/workflows/**'
      - 'Docs/**'
      - '.gitignore'
      - 'Data/ProjectGovernor.json'
      - 'Data/ExternalAssetManifest.json'
      - 'Data/*Warehouse*.json'
      - 'Data/MasterExternalResourceBibleAdoptionV1.json'
      - 'Data/PrivateOffline*.json'
      - 'Data/BigProductionBuildLaunchV1.json'
      - 'Data/WholeGame*.json'
      - 'Data/P1C01C3FoliageMaterialIdentityPlanV1.json'
      - 'Data/P1C01WorldBuildIntakePacketV1.json'
      - 'Data/P1C01ECharacterPresentationPlanV1.json'
      - 'Data/P1C01FLivingShirePlanV1.json'
      - 'Data/P1C01GQuestCinematicAudioPolishPlanV1.json'
      - 'Data/P1C01HTargetDeviceProfilingPlanV1.json'
      - 'Data/P1C01Gate67AcceptanceChecklistV1.json'
      - 'Data/ProjectSourcePdfRegistryV1.json'
      - 'Data/WholeGameAssetFamilyCoverageV1.json'
      - 'Data/WholeGamePooledPopulationPlanV1.json'
      - 'Data/WholeGameProductionExecutionQueueV1.json'
      - 'Data/WholeGameStreamingResidencyPlanV1.json'
      - 'Scripts/prepare_p1c01_material_intake.ps1'
      - 'Scripts/promote_p1c01_material_intake.ps1'
      - 'Scripts/run_p1c01_material_pipeline.ps1'
      - 'Scripts/install_runner_watchdog.ps1'
      - 'Scripts/runner_watchdog.ps1'
      - 'Scripts/classify_unreal_validation.ps1'
      - 'Scripts/pre_unreal_validate.py'
      - 'Scripts/deep_project_audit.py'
      - 'Scripts/test_deep_project_audit.py'
      - 'Scripts/source_contracts.py'
      - 'Scripts/test_source_contracts.py'
      - 'SourceAssets/PrivateOffline/**'
      - 'Scripts/stage_*warehouse*.ps1'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '.github/workflows/**'
      - 'Docs/**'
      - '.gitignore'
      - 'Data/ProjectGovernor.json'
      - 'Data/ExternalAssetManifest.json'
      - 'Data/*Warehouse*.json'
      - 'Data/MasterExternalResourceBibleAdoptionV1.json'
      - 'Data/PrivateOffline*.json'
      - 'Data/BigProductionBuildLaunchV1.json'
      - 'Data/WholeGame*.json'
      - 'Data/P1C01C3FoliageMaterialIdentityPlanV1.json'
      - 'Data/P1C01WorldBuildIntakePacketV1.json'
      - 'Scripts/classify_unreal_validation.ps1'
      - 'Scripts/runner_watchdog.ps1'
      - 'Scripts/install_runner_watchdog.ps1'
      - 'Scripts/pre_unreal_validate.py'
      - 'Scripts/deep_project_audit.py'
      - 'Scripts/test_deep_project_audit.py'
      - 'Scripts/source_contracts.py'
      - 'Scripts/test_source_contracts.py'
      - 'SourceAssets/PrivateOffline/**'
      - 'Scripts/stage_*warehouse*.ps1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: unreal-build-${{ github.repository }}-ue4-device
  # Full engine validation remains serialized; superseded acceptance-only PR runs are cancelled.
  cancel-in-progress: ${{ startsWith(github.head_ref, 'acceptance/') || startsWith(github.head_ref, 'production/') }}

jobs:
  unreal-build:
    name: UE4.27.2 C++ Build
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Bootstrap Windows runner tools
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GITEXE="
          for /f "delims=" %%G in ('where git.exe 2^>nul') do if not defined GITEXE set "GITEXE=%%G"
          if not defined GITEXE if exist "C:\Program Files\Git\cmd\git.exe" set "GITEXE=C:\Program Files\Git\cmd\git.exe"
          if not defined GITEXE if exist "C:\Program Files (x86)\Git\cmd\git.exe" set "GITEXE=C:\Program Files (x86)\Git\cmd\git.exe"

          if not defined GITEXE (
            set "MGROOT=%RUNNER_TEMP%\mingit-2.55.0.5"
            set "MGZIP=%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
            if not exist "%RUNNER_TEMP%\mingit-2.55.0.5\cmd\git.exe" (
              if exist "%RUNNER_TEMP%\mingit-2.55.0.5" rmdir /S /Q "%RUNNER_TEMP%\mingit-2.55.0.5"
              if exist "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip" del /F /Q "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
              curl.exe -L --retry 3 --retry-delay 3 -o "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip" "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip"
              if errorlevel 1 exit /b 20
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'MinGit-2.55.0.5-64-bit.zip') -DestinationPath (Join-Path $env:RUNNER_TEMP 'mingit-2.55.0.5') -Force"
              if errorlevel 1 exit /b 21
            )
            set "GITEXE=%RUNNER_TEMP%\mingit-2.55.0.5\cmd\git.exe"
          )

          if not exist "!GITEXE!" exit /b 22
          echo Found Git: !GITEXE!
          "!GITEXE!" --version
          if errorlevel 1 exit /b 22

          set "STABLE_CHECKOUT=%GITHUB_WORKSPACE%\..\fellowship_exact_checkout.cmd"
          >"!STABLE_CHECKOUT!" echo @echo off
          >>"!STABLE_CHECKOUT!" echo setlocal EnableExtensions
          >>"!STABLE_CHECKOUT!" echo cd /d "%%GITHUB_WORKSPACE%%"
          >>"!STABLE_CHECKOUT!" echo if exist ".git" rmdir /S /Q ".git"
          >>"!STABLE_CHECKOUT!" echo if exist ".git" exit /b 76
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" init
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 70
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" remote add origin "https://x-access-token:%%GH_TOKEN%%@github.com/%%GITHUB_REPOSITORY%%.git"
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 71
          >>"!STABLE_CHECKOUT!" echo set ATTEMPT=0
          >>"!STABLE_CHECKOUT!" echo :fetch
          >>"!STABLE_CHECKOUT!" echo set /a ATTEMPT+=1
          >>"!STABLE_CHECKOUT!" echo echo Fetching exact PR head attempt %%ATTEMPT%% of 7...
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" fetch --no-tags --prune --depth=2 origin %%TARGET_SHA%%
          >>"!STABLE_CHECKOUT!" echo if not errorlevel 1 goto fetched
          >>"!STABLE_CHECKOUT!" echo if %%ATTEMPT%% GEQ 7 exit /b 72
          >>"!STABLE_CHECKOUT!" echo powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 5"
          >>"!STABLE_CHECKOUT!" echo goto fetch
          >>"!STABLE_CHECKOUT!" echo :fetched
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" checkout -f FETCH_HEAD
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 73
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" reset --hard %%TARGET_SHA%%
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 73
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" rev-parse HEAD ^> .ci-head-sha
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 74
          >>"!STABLE_CHECKOUT!" echo set /p CHECKED_SHA=^<.ci-head-sha
          >>"!STABLE_CHECKOUT!" echo if /I not "%%CHECKED_SHA%%"=="%%TARGET_SHA%%" echo ERROR: Checkout SHA mismatch. expected=%%TARGET_SHA%% actual=%%CHECKED_SHA%%
          >>"!STABLE_CHECKOUT!" echo if /I not "%%CHECKED_SHA%%"=="%%TARGET_SHA%%" exit /b 74
          >>"!STABLE_CHECKOUT!" echo ^>.ci-source-sha echo %%TARGET_SHA%%
          >>"!STABLE_CHECKOUT!" echo if not exist "ShireJourney.uproject" echo ERROR: ShireJourney.uproject missing after exact checkout.
          >>"!STABLE_CHECKOUT!" echo if not exist "ShireJourney.uproject" exit /b 75
          >>"!STABLE_CHECKOUT!" echo echo Exact-head checkout and verification complete: %%TARGET_SHA%%.
          >>"!STABLE_CHECKOUT!" echo exit /b 0
          if not exist "!STABLE_CHECKOUT!" exit /b 23
          echo Stable exact-head checkout script: !STABLE_CHECKOUT!
          echo Runner bootstrap succeeded.

      - name: Checkout exact PR head from stable script
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"%GITHUB_WORKSPACE%\..\fellowship_exact_checkout.cmd"'

      - name: Classify current delta for Unreal validation
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\classify_unreal_validation.ps1"'

      - name: Governance/docs-only Unreal fast path
        if: env.SHIRE_UNREAL_MODE == 'inherit'
        shell: cmd
        run: 'echo UNREAL_FAST_PATH_PASS head=%TARGET_SHA% parent=%SHIRE_UNREAL_PARENT_SHA% reason=%SHIRE_UNREAL_DECISION_REASON%'

      - name: Acceptance-only Unreal fast path
        if: env.SHIRE_UNREAL_MODE == 'acceptance'
        shell: cmd
        run: 'echo UNREAL_ACCEPTANCE_FAST_PATH head=%TARGET_SHA% parent=%SHIRE_UNREAL_PARENT_SHA% reason=%SHIRE_UNREAL_DECISION_REASON%'

      - name: Prepare migrated runtime source layout
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\prepare_runtime_source_layout.ps1"'

      - name: Attempt read-only UE4 Engine Content ACL remediation
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\repair_ue_engine_content_acl.ps1"'

      - name: Verify Unreal 4.27.2 and project
        if: env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || (env.SHIRE_ACCEPTANCE_ONLY == 'true' && env.SHIRE_ACCEPTANCE_RESUME_STAGE != 'startup')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_verify_unreal.cmd"'

      - name: Wait safely for Unreal Editor to close
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_ACCEPTANCE_ONLY == 'true' && env.SHIRE_ACCEPTANCE_RESUME_STAGE != 'startup' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_wait_for_unreal_editor.cmd"'

      - name: Prepare and probe local MSVC environment
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\prepare_msvc_environment.ps1"'

      - name: Reset project build intermediates
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\reset_project_build_intermediates.ps1"'

      - name: Verify runtime source workspace integrity
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\verify_runtime_source_workspace.ps1"'

      - name: Build ShireJourneyEditor
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_build_unreal.cmd"'

      - name: Import production assets in UE4.27.2
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_import_production_assets.cmd"'

      - name: Resolve local Python for runtime observation
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\resolve_runtime_python.ps1"'

      - name: Run ShireJourney Automation Framework QA
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_run_project_automation.cmd"'

      - name: Headless playable startup smoke
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_runtime_startup.cmd"'

      - name: Headless chapter-by-chapter runtime audit
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_runtime_chapters.cmd"'

      - name: Headless route/story state roundtrip audit
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_runtime_state.cmd"'

      - name: Summarize and guard runtime warning debt
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_warning_debt.cmd"'

      - name: Build cook stage and archive real Windows package
        if: env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || (env.SHIRE_ACCEPTANCE_ONLY == 'true' && env.SHIRE_ACCEPTANCE_RESUME_STAGE != 'startup')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_package_w00.cmd"'

      - name: Verify packaged Runtime Data JSON payload
        if: env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || (env.SHIRE_ACCEPTANCE_ONLY == 'true' && env.SHIRE_ACCEPTANCE_RESUME_STAGE != 'startup')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\verify_packaged_runtime_data.ps1"'

      - name: Validate inherited packaged artifact
        if: env.SHIRE_ACCEPTANCE_ONLY == 'true' && env.SHIRE_ACCEPTANCE_RESUME_STAGE == 'startup'
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command
          "$root=Join-Path $env:GITHUB_WORKSPACE 'Saved\W00Package\WindowsNoEditor';
          $exe=Join-Path $root 'ShireJourney.exe';
          $report=Join-Path $env:GITHUB_WORKSPACE 'Saved\Logs\CI-W00-PackagedData.json';
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){Write-Host 'W00_INHERITED_PACKAGE_MISSING'; exit 81};
          if(-not (Test-Path -LiteralPath $report -PathType Leaf)){Write-Host 'W00_INHERITED_DATA_REPORT_MISSING'; exit 82};
          $j=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json;
          if($j.expected_count -ne 37 -or $j.verified_count -ne 37 -or @($j.missing).Count -ne 0 -or @($j.invalid_json).Count -ne 0){Write-Host 'W00_INHERITED_DATA_PROOF_INVALID'; exit 83};
          Write-Host ('W00_INHERITED_PACKAGE_DATA_PASS exe=' + $exe + ' verified=' + $j.verified_count)"

      - name: Launch and observe packaged executable
        if: env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_ACCEPTANCE_ONLY == 'true'
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\verify_packaged_startup.ps1"'

      - name: Capture runner hardware acceptance boundary
        if: env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_ACCEPTANCE_ONLY == 'true'
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\capture_runner_hardware.ps1"'

      - name: Collect Unreal build logs
        if: always() && (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_ACCEPTANCE_ONLY == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_collect_unreal_logs.cmd" "${{ job.status }}"'

      - name: Report failure log location
        if: failure() && (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_ACCEPTANCE_ONLY == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_report_failure.cmd"'
