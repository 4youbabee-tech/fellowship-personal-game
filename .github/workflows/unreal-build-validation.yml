name: Unreal Build Validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  unreal-build:
    name: UE4.27.2 C++ Build
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 55

    steps:
      - name: Bootstrap Windows runner tools
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          where git.exe >nul 2>nul
          if not errorlevel 1 (
            for /f "delims=" %%G in ('where git.exe') do (
              echo Found Git: %%G
              goto :git_ready
            )
          )

          for %%G in ("C:\Program Files\Git\cmd\git.exe" "C:\Program Files (x86)\Git\cmd\git.exe") do (
            if exist "%%~G" (
              set "GITDIR=%%~dpG"
              echo Found Git: %%~G
              echo !GITDIR!>>"%GITHUB_PATH%"
              set "PATH=!GITDIR!;%PATH%"
              goto :git_ready
            )
          )

          echo Git is not visible to the Windows service. Bootstrapping a private MinGit copy for CI...
          set "MINGIT_ROOT=%RUNNER_TEMP%\mingit-2.55.0.5"
          set "MINGIT_ZIP=%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
          set "MINGIT_URL=https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip"

          if not exist "!MINGIT_ROOT!\cmd\git.exe" (
            if exist "!MINGIT_ROOT!" rmdir /S /Q "!MINGIT_ROOT!"
            if exist "!MINGIT_ZIP!" del /Q "!MINGIT_ZIP!"

            curl.exe -L --retry 3 --retry-delay 3 -o "!MINGIT_ZIP!" "!MINGIT_URL!"
            if errorlevel 1 (
              echo ERROR: Failed to download MinGit.
              exit /b 20
            )

            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '!MINGIT_ZIP!' -DestinationPath '!MINGIT_ROOT!' -Force"
            if errorlevel 1 (
              echo ERROR: Failed to extract MinGit.
              exit /b 21
            )
          )

          set "GITDIR=!MINGIT_ROOT!\cmd"
          set "GITBIN=!MINGIT_ROOT!\mingw64\bin"
          echo !GITDIR!>>"%GITHUB_PATH%"
          echo !GITBIN!>>"%GITHUB_PATH%"
          set "PATH=!GITDIR!;!GITBIN!;%PATH%"

          :git_ready
          git --version
          if errorlevel 1 (
            echo ERROR: Git bootstrap did not produce a working git.exe.
            exit /b 22
          )

          echo Runner bootstrap succeeded.

      - name: Install user-level runner autostart watchdog
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $RunnerRoot = "C:\actions-runner"
          $Watchdog = Join-Path $RunnerRoot "runner-watchdog.ps1"
          $Launcher = Join-Path $RunnerRoot "start-runner-watchdog.cmd"
          $DiagDir = Join-Path $RunnerRoot "_diag"
          $WatchdogLog = Join-Path $DiagDir "user-watchdog.log"

          if (-not (Test-Path (Join-Path $RunnerRoot "run.cmd"))) {
            throw "Expected runner launcher not found at C:\actions-runner\run.cmd"
          }
          if (-not (Test-Path $DiagDir)) {
            New-Item -ItemType Directory -Path $DiagDir -Force | Out-Null
          }

          @'
          $ErrorActionPreference = "SilentlyContinue"
          $RunnerRoot = "C:\actions-runner"
          $RunCmd = Join-Path $RunnerRoot "run.cmd"
          $DiagDir = Join-Path $RunnerRoot "_diag"
          $Log = Join-Path $DiagDir "user-watchdog.log"

          function Write-WatchdogLog([string]$Message) {
              try {
                  Add-Content -LiteralPath $Log -Value ("{0:u} {1}" -f (Get-Date), $Message)
              } catch {}
          }

          Write-WatchdogLog "watchdog started for interactive user $env:USERNAME"

          while ($true) {
              $listener = Get-Process -Name "Runner.Listener" -ErrorAction SilentlyContinue
              if (-not $listener) {
                  Write-WatchdogLog "Runner.Listener absent; starting C:\actions-runner\run.cmd"
                  Start-Process -FilePath $RunCmd -WorkingDirectory $RunnerRoot -WindowStyle Hidden
                  Start-Sleep -Seconds 8
              }
              Start-Sleep -Seconds 12
          }
          '@ | Set-Content -LiteralPath $Watchdog -Encoding UTF8

          @'
          @echo off
          powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "C:\actions-runner\runner-watchdog.ps1"
          '@ | Set-Content -LiteralPath $Launcher -Encoding ASCII

          $RunKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Test-Path $RunKey)) {
            New-Item -Path $RunKey -Force | Out-Null
          }
          New-ItemProperty -Path $RunKey -Name "FellowshipGitHubRunnerWatchdog" -PropertyType String -Value ('"' + $Launcher + '"') -Force | Out-Null

          Write-Host "Installed user-level runner watchdog:"
          Write-Host "  watchdog: $Watchdog"
          Write-Host "  launcher:  $Launcher"
          Write-Host "  registry:  HKCU\Software\Microsoft\Windows\CurrentVersion\Run\FellowshipGitHubRunnerWatchdog"
          Write-Host "This requires no Windows account password and starts after the interactive user logs in."

      - name: Checkout exact commit with resilient archive download
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $Archive = Join-Path $env:RUNNER_TEMP ("fellowship-" + $env:GITHUB_SHA + ".zip")
          $Extract = Join-Path $env:RUNNER_TEMP ("fellowship-" + $env:GITHUB_SHA)

          if (Test-Path $Archive) { Remove-Item -LiteralPath $Archive -Force }
          if (Test-Path $Extract) { Remove-Item -LiteralPath $Extract -Recurse -Force }
          New-Item -ItemType Directory -Path $Extract | Out-Null

          $Url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/zipball/$env:GITHUB_SHA"
          & curl.exe -L --fail --retry 6 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer $env:GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o $Archive $Url
          if ($LASTEXITCODE -ne 0) {
            throw "Exact-commit archive download failed after retries."
          }

          Expand-Archive -LiteralPath $Archive -DestinationPath $Extract -Force
          $Root = Get-ChildItem -LiteralPath $Extract -Directory | Select-Object -First 1
          if (-not $Root) {
            throw "Exact-commit archive did not contain a repository root directory."
          }

          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $Root.FullName -Force | Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force

          $Project = Join-Path $env:GITHUB_WORKSPACE "ShireJourney.uproject"
          if (-not (Test-Path $Project)) {
            throw "ShireJourney.uproject missing after exact-commit archive extraction."
          }

          Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".ci-source-sha") -Value $env:GITHUB_SHA
          Write-Host "Checked out exact commit $env:GITHUB_SHA without actions/checkout."

      - name: Verify Unreal 4.27.2 and project
        shell: cmd
        run: |
          @echo off
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "UEROOT=C:\Program Files\Epic Games\UE_4.27"
          set "BUILDBAT=C:\Program Files\Epic Games\UE_4.27\Engine\Build\BatchFiles\Build.bat"
          set "BUILDVERSION=C:\Program Files\Epic Games\UE_4.27\Engine\Build\Build.version"

          if not exist "%PROJECT%" (
            echo ERROR: ShireJourney.uproject was not found at "%PROJECT%"
            exit /b 30
          )
          if not exist "%BUILDBAT%" (
            echo ERROR: UE4 Build.bat was not found at "%BUILDBAT%"
            exit /b 31
          )
          if not exist "%BUILDVERSION%" (
            echo ERROR: UE4 Build.version was not found at "%BUILDVERSION%"
            exit /b 32
          )

          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$v = Get-Content '%BUILDVERSION%' -Raw | ConvertFrom-Json; Write-Host ('Detected Unreal Engine {0}.{1}.{2}' -f $v.MajorVersion,$v.MinorVersion,$v.PatchVersion); if ($v.MajorVersion -ne 4 -or $v.MinorVersion -ne 27 -or $v.PatchVersion -ne 2) { exit 33 }"
          if errorlevel 1 (
            echo ERROR: Expected Unreal Engine 4.27.2.
            exit /b 33
          )

      - name: Refuse build while Unreal Editor is open
        shell: cmd
        run: |
          @echo off
          tasklist /FI "IMAGENAME eq UE4Editor.exe" | find /I "UE4Editor.exe" >nul
          if not errorlevel 1 (
            echo ERROR: UE4Editor.exe is open. Close Unreal Editor before automated validation.
            exit /b 40
          )
          echo Unreal Editor is closed.
          exit /b 0

      - name: Build ShireJourneyEditor
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "BUILDBAT=C:\Program Files\Epic Games\UE_4.27\Engine\Build\BatchFiles\Build.bat"
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          set "BUILDLOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-UnrealBuild.log"

          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          echo Building exact commit: %GITHUB_SHA%
          echo Project: %PROJECT%
          echo Build log: %BUILDLOG%

          call "%BUILDBAT%" ShireJourneyEditor Win64 Development "%PROJECT%" -WaitMutex -NoHotReloadFromIDE > "%BUILDLOG%" 2>&1
          set "BUILD_EXIT=%ERRORLEVEL%"

          type "%BUILDLOG%"

          if not "%BUILD_EXIT%"=="0" (
            echo ERROR: UE4.27.2 build failed with exit code %BUILD_EXIT%.
            exit /b %BUILD_EXIT%
          )

          echo UE4.27.2 build succeeded.

      - name: Import production assets in UE4.27.2
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "EDITORCMD=C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe"
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          set "IMPORTLOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-ProductionAssetImport.log"

          if not exist "%EDITORCMD%" (
            echo ERROR: UE4Editor-Cmd.exe was not found at "%EDITORCMD%"
            exit /b 50
          )
          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          echo Importing production source assets for exact commit: %GITHUB_SHA%
          "%EDITORCMD%" "%PROJECT%" -run=ShireProductionImport -unattended -nop4 -nosplash -NoSound -abslog="%IMPORTLOG%"
          set "IMPORT_EXIT=%ERRORLEVEL%"

          if exist "%IMPORTLOG%" (
            findstr /I /C:"ShireProductionImport:" /C:"ShireProductionImport FAILED" /C:"Error:" /C:"Warning:" "%IMPORTLOG%"
          )

          if not "%IMPORT_EXIT%"=="0" (
            echo ERROR: UE4.27.2 production asset import failed with exit code %IMPORT_EXIT%.
            exit /b %IMPORT_EXIT%
          )

          findstr /C:"ShireProductionImport:" "%IMPORTLOG%" | findstr /C:"0 failures" >nul
          if errorlevel 1 (
            echo ERROR: Production asset import did not report zero failures.
            exit /b 51
          )

          echo UE4.27.2 production asset import succeeded.

      - name: Headless playable startup smoke
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $Project = Join-Path $env:GITHUB_WORKSPACE "ShireJourney.uproject"
          $EditorCmd = "C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe"
          $LogDir = Join-Path $env:GITHUB_WORKSPACE "Saved\Logs"
          $BootLog = Join-Path $LogDir "CI-PlayableStartup.log"

          if (-not (Test-Path $EditorCmd)) {
            throw "UE4Editor-Cmd.exe missing for playable startup smoke."
          }
          if (-not (Test-Path $LogDir)) {
            New-Item -ItemType Directory -Path $LogDir | Out-Null
          }
          if (Test-Path $BootLog) {
            Remove-Item -LiteralPath $BootLog -Force
          }

          $Args = @(
            $Project,
            "/Engine/Maps/Templates/Template_Default",
            "-game",
            "-nullrhi",
            "-unattended",
            "-nop4",
            "-nosplash",
            "-NoSound",
            "-abslog=$BootLog"
          )

          Write-Host "Launching headless playable startup smoke for commit $env:GITHUB_SHA"
          $Proc = Start-Process -FilePath $EditorCmd -ArgumentList $Args -PassThru
          $Deadline = (Get-Date).AddSeconds(45)
          $SeenGameMode = $false
          $SeenChapter = $false

          while ((Get-Date) -lt $Deadline) {
            if (Test-Path $BootLog) {
              $Text = Get-Content -LiteralPath $BootLog -Raw -ErrorAction SilentlyContinue
              if ($Text -match "ShirePlayableStartup: GameMode ready") {
                $SeenGameMode = $true
              }
              if ($Text -match "ShirePlayableStartup: chapter=P1C01 route=FrodoMain") {
                $SeenChapter = $true
              }
              if ($SeenGameMode -and $SeenChapter) {
                break
              }
            }

            if ($Proc.HasExited) {
              break
            }
            Start-Sleep -Seconds 1
          }

          if (-not $Proc.HasExited) {
            Stop-Process -Id $Proc.Id -Force -ErrorAction SilentlyContinue
            $Proc.WaitForExit()
          }

          if (Test-Path $BootLog) {
            Write-Host "----- Playable startup log tail -----"
            Get-Content -LiteralPath $BootLog -Tail 180
          }

          if (-not $SeenGameMode) {
            throw "Playable startup smoke did not observe the GameMode startup marker."
          }
          if (-not $SeenChapter) {
            throw "Playable startup smoke did not observe P1C01/FrodoMain world load."
          }

          Write-Host "Headless playable startup smoke succeeded."

      - name: Collect Unreal build logs
        if: always()
        shell: cmd
        run: |
          @echo off
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          if exist "%LOCALAPPDATA%\UnrealBuildTool\Log.txt" (
            copy /Y "%LOCALAPPDATA%\UnrealBuildTool\Log.txt" "%LOGDIR%\CI-UnrealBuildTool.log" >nul
          )

          echo UE4.27.2 build job status: ${{ job.status }}>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %GITHUB_SHA%>>"%GITHUB_STEP_SUMMARY%"

      - name: Report failure log location
        if: failure()
        shell: cmd
        run: |
          @echo off
          echo Build/import logs were already printed into the workflow log.
          echo Self-hosted local log directory: %GITHUB_WORKSPACE%\Saved\Logs
          echo Artifact upload is intentionally skipped to avoid storage-quota failures masking the primary error.
