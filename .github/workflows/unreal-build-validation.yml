  workflow_dispatch:
    inputs:
      pes_focused_unreal:
        description: 'Run required focused UE4 editor build, persisted Cloud138 restore and P1C01 startup without Cook/Package or broad chapter sweeps'
        required: false
        type: boolean
        default: false
      run_self_hosted:
        description: 'Owner authorization required: run UE4.27 on Windows self-hosted runner for this manual dispatch only'
        required: false
        type: boolean
        default: false
      part1_closeout_approved:
        description: 'Additional explicit owner approval: run expensive Part I/chapter closeout audits and packaging; NEVER enable during ordinary PES work'
        required: false
        type: boolean
        default: false
      package_windows:
        description: 'Explicit Windows cook/package for chapter closeout or release; normal development skips it'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Expensive closeout requires BOTH package_windows and part1_closeout_approved; ordinary PES CI keeps fast safety gates.
  # Cancel only superseded runs from the same PR branch. Different PRs/develop stay
  # distinct here and are still physically serialized by the single self-hosted runner.
  group: unreal-build-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.head_ref || 'develop' }}
  cancel-in-progress: false

jobs:
  classify:
    name: Direct engine production lane
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.direct.outputs.mode }}
      reason: ${{ steps.direct.outputs.reason }}
      parent_sha: ${{ steps.direct.outputs.parent_sha }}
      resume_stage: ${{ steps.direct.outputs.resume_stage }}
      reset_intermediates: ${{ steps.direct.outputs.reset_intermediates }}
      full: ${{ steps.direct.outputs.full }}
      core: ${{ steps.direct.outputs.core }}
      asset: ${{ steps.direct.outputs.asset }}
      acceptance: ${{ steps.direct.outputs.acceptance }}
      package: ${{ steps.direct.outputs.package }}
      curated: ${{ steps.direct.outputs.curated }}
    steps:
      - name: Select incremental engine execution without text gates
        id: direct
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.package_windows == true }}
        shell: bash
        run: |
          echo "mode=full" >> "$GITHUB_OUTPUT"
          echo "reason=owner-authorized-direct-engine-production" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "resume_stage=none" >> "$GITHUB_OUTPUT"
          echo "reset_intermediates=false" >> "$GITHUB_OUTPUT"
          echo "full=true" >> "$GITHUB_OUTPUT"
          echo "core=false" >> "$GITHUB_OUTPUT"
          echo "asset=false" >> "$GITHUB_OUTPUT"
          echo "acceptance=false" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "curated=false" >> "$GITHUB_OUTPUT"


  character-source:
    name: Prepare actual CC0 unified skin and authored locomotion
    needs: classify
    if: needs.classify.outputs.full == 'true' || needs.classify.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      # Prevent a repeat of Run 39040962447's UE4.27 C2039 without a new
      # Windows compilation. This narrow 2-class check is not a paperwork gate.
      - name: UE4.27 source-symbol micro-preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/test_pes002_visual_contract.py Scripts/ue4_p1c01_curated_postimport.py Scripts/prepare_wholegame_regional_import.py
          python3 -m unittest -v Scripts.test_pes002_visual_contract.PES002ShadowBudgetContract Scripts.test_pes002_visual_contract.PES002IntegratedShireContract
      # Reuse only a packet produced from identical pinned source, Blender
      # normalization and manifest inputs. A cache hit never skips hash/skin
      # validation or UE4 import; it only avoids re-downloading tools and raw FBX.
      - name: Restore verified CC0 normalized character packet
        id: rig-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kaykit-character-production/packet
          key: shire-ue427-kaykit-cc0-v1-${{ hashFiles('Data/P1C01KayKitRigTechnicalBridgeV1.json', 'Scripts/stage_p1c01_kaykit_rig_bridge.ps1', 'Tools/CloudAssetBuild/prepare_kaykit_character.py') }}
      - name: Install Blender only when the licensed character input changes
        if: steps.rig-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Prepare pinned licensed character and actual authored clips
        if: steps.rig-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./Scripts/stage_p1c01_kaykit_rig_bridge.ps1 -ProductionPacket -OutputRoot "$env:RUNNER_TEMP/kaykit-character-production" -BlenderExecutable blender
      - name: Physically verify cached or freshly generated character packet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packet = Join-Path $env:RUNNER_TEMP 'kaykit-character-production/packet'
          $receiptFile = Join-Path $packet 'source_receipt.json'
          if (!(Test-Path -LiteralPath $receiptFile -PathType Leaf)) { throw 'KAYKIT_CHARACTER_PACKET_RECEIPT_MISSING' }
          $receipt = Get-Content -LiteralPath $receiptFile -Raw | ConvertFrom-Json
          if ($receipt.status -ne 'NORMALIZED_KAYKIT_CHARACTER_SOURCE_PASS' -or
              $receipt.mesh.vertex_count -lt 2000 -or $receipt.mesh.bone_count -lt 20 -or
              $receipt.mesh.max_influences -gt 4 -or $receipt.mesh.zero_weight_vertices -ne 0) {
            throw 'KAYKIT_CHARACTER_PACKET_SKIN_ORIGIN_REJECT'
          }
          foreach ($f in $receipt.files.PSObject.Properties) {
            $path = Join-Path $packet $f.Name
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "KAYKIT_CHARACTER_PACKET_FILE_MISSING file=$($f.Name)" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$f.Value) {
              throw "KAYKIT_CHARACTER_PACKET_HASH_MISMATCH file=$($f.Name)"
            }
          }
          Write-Host "PES002_KAYKIT_PACKET_REUSED cacheHit=${{ steps.rig-cache.outputs.cache-hit }} files=$($receipt.files.PSObject.Properties.Count) license=CC0 skinQC=pass"
      - uses: actions/upload-artifact@v4
        with:
          name: kaykit-character-source-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/kaykit-character-production/packet
          if-no-files-found: error
          retention-days: 14

  unreal-build:
    needs: [classify, character-source]
    # Owner-authorized automatic exact-head Windows integration.
    # Classification keeps docs/source-only edits on hosted CI; the single
    # UE4-27 runner serializes only engine-impacting or curated importer work.
    if: >-
      ${{ always() && needs.classify.result == 'success' &&
          (needs.character-source.result == 'success' || needs.character-source.result == 'skipped') &&
          (github.event_name == 'pull_request' || github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.run_self_hosted == true)) &&
          (needs.classify.outputs.curated == 'true' ||
           needs.classify.outputs.full == 'true' || needs.classify.outputs.core == 'true' ||
           (needs.classify.outputs.acceptance == 'true' && needs.classify.outputs.resume_stage == 'startup') ||
           needs.classify.outputs.package == 'true') }}
    name: UE4.27.2 C++ Build
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Bootstrap Windows runner tools
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GITEXE="
          for /f "delims=" %%G in ('where git.exe 2^>nul') do if not defined GITEXE set "GITEXE=%%G"
          if not defined GITEXE if exist "C:\Program Files\Git\cmd\git.exe" set "GITEXE=C:\Program Files\Git\cmd\git.exe"
          if not defined GITEXE if exist "C:\Program Files (x86)\Git\cmd\git.exe" set "GITEXE=C:\Program Files (x86)\Git\cmd\git.exe"

          if not defined GITEXE (
            set "MGROOT=%RUNNER_TEMP%\mingit-2.55.0.5"
            set "MGZIP=%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
            if not exist "%RUNNER_TEMP%\mingit-2.55.0.5\cmd\git.exe" (
              if exist "%RUNNER_TEMP%\mingit-2.55.0.5" rmdir /S /Q "%RUNNER_TEMP%\mingit-2.55.0.5"
              if exist "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip" del /F /Q "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
              curl.exe -L --retry 3 --retry-delay 3 -o "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip" "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip"
              if errorlevel 1 exit /b 20
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'MinGit-2.55.0.5-64-bit.zip') -DestinationPath (Join-Path $env:RUNNER_TEMP 'mingit-2.55.0.5') -Force"
              if errorlevel 1 exit /b 21
            )
            set "GITEXE=%RUNNER_TEMP%\mingit-2.55.0.5\cmd\git.exe"
          )

          if not exist "!GITEXE!" exit /b 22
          echo Found Git: !GITEXE!
          "!GITEXE!" --version
          if errorlevel 1 exit /b 22

          set "STABLE_CHECKOUT=%GITHUB_WORKSPACE%\..\fellowship_exact_checkout.cmd"
          >"!STABLE_CHECKOUT!" echo @echo off
          >>"!STABLE_CHECKOUT!" echo setlocal EnableExtensions
          >>"!STABLE_CHECKOUT!" echo cd /d "%%GITHUB_WORKSPACE%%"
          rem Preserve Git metadata on the self-hosted runner so checkout only rewrites
          rem files that actually changed. This is required for UBT incremental timestamps.
          >>"!STABLE_CHECKOUT!" echo if exist ".git\index.lock" del /F /Q ".git\index.lock"
          >>"!STABLE_CHECKOUT!" echo if exist ".git\shallow.lock" del /F /Q ".git\shallow.lock"
          >>"!STABLE_CHECKOUT!" echo if not exist ".git" "!GITEXE!" init
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 70
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" rev-parse --is-inside-work-tree ^>nul 2^>nul
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 76
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" remote remove origin ^>nul 2^>nul
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" remote add origin "https://x-access-token:%%GH_TOKEN%%@github.com/%%GITHUB_REPOSITORY%%.git"
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 71
          >>"!STABLE_CHECKOUT!" echo set ATTEMPT=0
          >>"!STABLE_CHECKOUT!" echo :fetch
          >>"!STABLE_CHECKOUT!" echo set /a ATTEMPT+=1
          >>"!STABLE_CHECKOUT!" echo echo Fetching exact PR head attempt %%ATTEMPT%% of 3...
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch --no-tags --prune --depth=2 origin %%TARGET_SHA%%
          >>"!STABLE_CHECKOUT!" echo if not errorlevel 1 goto fetched
          >>"!STABLE_CHECKOUT!" echo if %%ATTEMPT%% GEQ 3 exit /b 72
          >>"!STABLE_CHECKOUT!" echo powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 5"
          >>"!STABLE_CHECKOUT!" echo goto fetch
          >>"!STABLE_CHECKOUT!" echo :fetched
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" checkout -f FETCH_HEAD
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 73
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" reset --hard %%TARGET_SHA%%
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 73
          >>"!STABLE_CHECKOUT!" echo "!GITEXE!" rev-parse HEAD ^> .ci-head-sha
          >>"!STABLE_CHECKOUT!" echo if errorlevel 1 exit /b 74
          >>"!STABLE_CHECKOUT!" echo set /p CHECKED_SHA=^<.ci-head-sha
          >>"!STABLE_CHECKOUT!" echo if /I not "%%CHECKED_SHA%%"=="%%TARGET_SHA%%" echo ERROR: Checkout SHA mismatch. expected=%%TARGET_SHA%% actual=%%CHECKED_SHA%%
          >>"!STABLE_CHECKOUT!" echo if /I not "%%CHECKED_SHA%%"=="%%TARGET_SHA%%" exit /b 74
          >>"!STABLE_CHECKOUT!" echo ^>.ci-source-sha echo %%TARGET_SHA%%
          >>"!STABLE_CHECKOUT!" echo if not exist "ShireJourney.uproject" echo ERROR: ShireJourney.uproject missing after exact checkout.
          >>"!STABLE_CHECKOUT!" echo if not exist "ShireJourney.uproject" exit /b 75
          >>"!STABLE_CHECKOUT!" echo echo Exact-head checkout and verification complete: %%TARGET_SHA%%.
          >>"!STABLE_CHECKOUT!" echo exit /b 0
          if not exist "!STABLE_CHECKOUT!" exit /b 23
          echo Stable exact-head checkout script: !STABLE_CHECKOUT!
          echo Runner bootstrap succeeded.

      - name: Checkout exact PR head from stable script
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"%GITHUB_WORKSPACE%\..\fellowship_exact_checkout.cmd"'

      - name: Verify runner session health
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\verify_runner_session.ps1"'

      - name: Import hosted Unreal classification
        shell: powershell
        run: |
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_UNREAL_MODE=${{ needs.classify.outputs.mode }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_UNREAL_DECISION_REASON=${{ needs.classify.outputs.reason }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_UNREAL_PARENT_SHA=${{ needs.classify.outputs.parent_sha }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_ACCEPTANCE_RESUME_STAGE=${{ needs.classify.outputs.resume_stage }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_RESET_INTERMEDIATES=${{ needs.classify.outputs.reset_intermediates }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_FULL_UNREAL_REQUIRED=${{ needs.classify.outputs.full }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_CORE_UNREAL_REQUIRED=${{ needs.classify.outputs.core }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_ASSET_IMPORT_ONLY=${{ needs.classify.outputs.asset }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_ACCEPTANCE_ONLY=${{ needs.classify.outputs.acceptance }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_PACKAGE_REQUIRED=${{ needs.classify.outputs.package }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SHIRE_CURATED_REQUIRED=${{ needs.classify.outputs.curated }}"
          if ("${{ needs.classify.outputs.mode }}" -notin @("full","core","asset","acceptance","curated")) {
            throw "Unexpected hosted Unreal mode: ${{ needs.classify.outputs.mode }}"
          }

      - name: Scrub checkout credential from persistent Git metadata
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GITEXE="
          for /f "delims=" %%G in ('where git.exe 2^>nul') do if not defined GITEXE set "GITEXE=%%G"
          if not defined GITEXE if exist "C:\Program Files\Git\cmd\git.exe" set "GITEXE=C:\Program Files\Git\cmd\git.exe"
          if not defined GITEXE if exist "%RUNNER_TEMP%\mingit-2.55.0.5\cmd\git.exe" set "GITEXE=%RUNNER_TEMP%\mingit-2.55.0.5\cmd\git.exe"
          if defined GITEXE "!GITEXE!" remote set-url origin "https://github.com/%GITHUB_REPOSITORY%.git" >nul 2>nul
          exit /b 0

      - name: Automatic P1C01 curated original LOD and packed-material import
        if: env.SHIRE_CURATED_REQUIRED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\Scripts\run_p1c01_curated_ue4.ps1" -ExpectedSha "$env:TARGET_SHA" -Workspace "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "P1C01_CURATED_EDITOR_IMPORT_FAILED exit=$LASTEXITCODE" }

      - name: Governance/docs-only Unreal fast path
        if: env.SHIRE_UNREAL_MODE == 'inherit'
        shell: cmd
        run: 'echo UNREAL_FAST_PATH_PASS head=%TARGET_SHA% parent=%SHIRE_UNREAL_PARENT_SHA% reason=%SHIRE_UNREAL_DECISION_REASON%'

      - name: Acceptance-only Unreal fast path
        if: env.SHIRE_UNREAL_MODE == 'acceptance'
        shell: cmd
        run: 'echo UNREAL_ACCEPTANCE_FAST_PATH head=%TARGET_SHA% parent=%SHIRE_UNREAL_PARENT_SHA% reason=%SHIRE_UNREAL_DECISION_REASON%'

      - name: Prepare migrated runtime source layout
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\prepare_runtime_source_layout.ps1"'

      - name: Attempt read-only UE4 Engine Content ACL remediation
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\repair_ue_engine_content_acl.ps1"'

      - name: Verify Unreal 4.27.2 and project
        if: env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_CURATED_REQUIRED == 'true' || (env.SHIRE_ACCEPTANCE_ONLY == 'true' && env.SHIRE_ACCEPTANCE_RESUME_STAGE != 'startup')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_verify_unreal.cmd"'

      - name: Wait safely for Unreal Editor to close
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_ACCEPTANCE_ONLY == 'true' && env.SHIRE_ACCEPTANCE_RESUME_STAGE != 'startup' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_CURATED_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_wait_for_unreal_editor.cmd"'

      - name: Prepare and probe local MSVC environment
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\prepare_msvc_environment.ps1"'

      - name: Reset project build intermediates
        if: env.SHIRE_RESET_INTERMEDIATES == 'true'
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\reset_project_build_intermediates.ps1"'

      - name: Verify runtime source workspace integrity
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\verify_runtime_source_workspace.ps1"'

      - name: Build ShireJourneyEditor
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_build_unreal.cmd"'

      - name: Download exact-head unified character and authored clips
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        uses: actions/download-artifact@v4
        with:
          name: kaykit-character-source-${{ env.TARGET_SHA }}
          path: ${{ github.workspace }}/SourceAssets/Production/Characters/Rigs/Frodo

      - name: Persist and verify the exact character packet in the existing warehouse
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'SourceAssets/Production/Characters/Rigs/Frodo'
          $receipt = Get-Content (Join-Path $source 'source_receipt.json') -Raw | ConvertFrom-Json
          if ($receipt.status -ne 'NORMALIZED_KAYKIT_CHARACTER_SOURCE_PASS') { throw 'CHARACTER_PACKET_RECEIPT_REJECT' }
          $destination = Join-Path 'D:/actions-runner/_warehouse/ShireJourney/KayKit/_normalized_unified' $env:TARGET_SHA
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          foreach ($file in $receipt.files.PSObject.Properties) {
            $inputFile = Join-Path $source $file.Name
            if ((Get-FileHash $inputFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$file.Value) { throw "CHARACTER_PACKET_SOURCE_HASH_REJECT $($file.Name)" }
            Copy-Item -LiteralPath $inputFile -Destination (Join-Path $destination $file.Name) -Force
            if ((Get-FileHash (Join-Path $destination $file.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$file.Value) { throw "CHARACTER_PACKET_WAREHOUSE_HASH_REJECT $($file.Name)" }
          }
          Copy-Item -LiteralPath (Join-Path $source 'source_receipt.json') -Destination $destination -Force
          Write-Host "PES002_CHARACTER_WAREHOUSE_PERSISTED path=$destination files=$($receipt.files.PSObject.Properties.Count) head=$env:TARGET_SHA license=CC0"

      # Same single Unreal writer; later regions remain source/import-only.
      - name: Fetch SHA-pinned 28-region physical source archive
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        uses: actions/download-artifact@v4
        with:
          name: whole-game-original-support-source-eb685cbeab7fa7572150172abd9314a7047db8f8
          run-id: 39059107842
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/regional-import-candidate

      - name: Stage 56 FBX and 36 PBR PNG from verified source
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: powershell
        run: |
          python Scripts/prepare_wholegame_regional_import.py --mode stage --project "$env:GITHUB_WORKSPACE" --artifact "$env:RUNNER_TEMP/regional-import-candidate" --pin Data/CloudWholeGameSourceArtifactPinV1.json
          if ($LASTEXITCODE -ne 0) { throw "REGIONAL_STAGE_FAILED" }

      - name: Import production assets in UE4.27.2
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_import_production_assets.cmd" -EnableCharacterRigImport -CharacterPacket=Frodo'

      - name: Validate imported 92 UE4 objects and persist one canonical warehouse receipt
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')
        shell: powershell
        run: |
          python Scripts/prepare_wholegame_regional_import.py --mode persist --project "$env:GITHUB_WORKSPACE" --warehouse 'D:/actions-runner/_warehouse/ShireJourney'
          if ($LASTEXITCODE -ne 0) { throw "REGIONAL_UE_PERSIST_FAILED" }

      - name: Rehydrate exact SHA256 Cloud138 Unreal packages
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_CURATED_REQUIRED == 'true')
        shell: powershell
        run: |
          python Scripts/restore_cloud138_unreal.py --warehouse 'D:\\actions-runner\\_warehouse\\ShireJourney' --checkout "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw 'CLOUD138_RESTORE_BLOCKED' }

      - name: Resolve local Python for runtime observation
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_CURATED_REQUIRED == 'true')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\resolve_runtime_python.ps1"'

      - name: Run ShireJourney Automation Framework QA
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_CURATED_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_run_project_automation.cmd"'

      - name: Headless playable startup smoke
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_CURATED_REQUIRED == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_runtime_startup.cmd"'

      # PES-002 screenshot proof is mandatory for this active exterior stage; fail closed.
      - name: Capture Bag End targeted P1C01 visual proof
        if: (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_CURATED_REQUIRED == 'true')
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\capture_pes002_bag_end_visual.ps1" -PIE

      - name: Upload PES-002 screenshot evidence
        if: (always() && (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true')) || (success() && env.SHIRE_CURATED_REQUIRED == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: pes002-bag-end-visual-${{ env.TARGET_SHA }}
          path: Saved/PES002VisualProof/
          if-no-files-found: warn
          retention-days: 14


      # Curated artifacts are not source-folder claims: persist the editor report,
      # asset path and material readback evidence only on the exact import SHA.
      - name: Upload curated P1C01 UE4 import receipt
        if: always() && env.SHIRE_CURATED_REQUIRED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pes002-curated-ue-import-${{ env.TARGET_SHA }}
          path: |
            Saved/P1C01CuratedEditorPostImport/receipt.json
            Saved/Logs/P1C01-Curated-EditorPython.log
          if-no-files-found: warn
