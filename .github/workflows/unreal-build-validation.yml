        if: (github.event_name == 'workflow_dispatch' && inputs.package_windows == true && inputs.part1_closeout_approved == true && env.SHIRE_PACKAGE_REQUIRED == 'true') || (env.SHIRE_ACCEPTANCE_ONLY == 'true' && env.SHIRE_ACCEPTANCE_RESUME_STAGE == 'startup')
        shell: cmd
        run: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\\Scripts\\capture_runner_hardware.ps1"'

      - name: Upload P1C01 Windows playable candidate
        if: success() && github.event_name == 'workflow_dispatch' && inputs.package_windows == true && inputs.part1_closeout_approved == true && env.SHIRE_PACKAGE_REQUIRED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ShireJourney-P1C01-Windows-${{ env.TARGET_SHA }}
          path: Saved/W00Package/WindowsNoEditor/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Collect Unreal build logs
        if: always() && (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_ACCEPTANCE_ONLY == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_collect_unreal_logs.cmd" "${{ job.status }}"'

      - name: Report failure log location
        if: failure() && (env.SHIRE_FULL_UNREAL_REQUIRED == 'true' || env.SHIRE_CORE_UNREAL_REQUIRED == 'true' || env.SHIRE_ACCEPTANCE_ONLY == 'true')
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\\Scripts\\ci_report_failure.cmd"'
