name: Unreal Build Validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-build-${{ github.repository }}-ue4-device
  cancel-in-progress: false

jobs:
  unreal-build:
    name: UE4.27.2 C++ Build
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 55

    steps:
      - name: Bootstrap Windows runner tools
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          rem Runner lifecycle, watchdog files and registry configuration are
          rem managed outside this workflow. Validation never modifies them.

          where git.exe >nul 2>nul
          if not errorlevel 1 (
            for /f "delims=" %%G in ('where git.exe') do (
              echo Found Git: %%G
              goto :git_ready
            )
          )

          for %%G in ("C:\Program Files\Git\cmd\git.exe" "C:\Program Files (x86)\Git\cmd\git.exe") do (
            if exist "%%~G" (
              set "GITDIR=%%~dpG"
              echo Found Git: %%~G
              echo !GITDIR!>>"%GITHUB_PATH%"
              set "PATH=!GITDIR!;%PATH%"
              goto :git_ready
            )
          )

          echo Git is not visible to the Windows service. Bootstrapping a private MinGit copy for CI...
          set "MINGIT_ROOT=%RUNNER_TEMP%\mingit-2.55.0.5"
          set "MINGIT_ZIP=%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
          set "MINGIT_URL=https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip"

          if not exist "!MINGIT_ROOT!\cmd\git.exe" (
            if exist "!MINGIT_ROOT!" rmdir /S /Q "!MINGIT_ROOT!"
            if exist "!MINGIT_ZIP!" del /Q "!MINGIT_ZIP!"

            curl.exe -L --retry 3 --retry-delay 3 -o "!MINGIT_ZIP!" "!MINGIT_URL!"
            if errorlevel 1 (
              echo ERROR: Failed to download MinGit.
              exit /b 20
            )

            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '!MINGIT_ZIP!' -DestinationPath '!MINGIT_ROOT!' -Force"
            if errorlevel 1 (
              echo ERROR: Failed to extract MinGit.
              exit /b 21
            )
          )

          set "GITDIR=!MINGIT_ROOT!\cmd"
          set "GITBIN=!MINGIT_ROOT!\mingw64\bin"
          echo !GITDIR!>>"%GITHUB_PATH%"
          echo !GITBIN!>>"%GITHUB_PATH%"
          set "PATH=!GITDIR!;!GITBIN!;%PATH%"

          :git_ready
          git --version
          if errorlevel 1 (
            echo ERROR: Git bootstrap did not produce a working git.exe.
            exit /b 22
          )

          echo Runner bootstrap succeeded.

      - name: Checkout exact commit with resilient git fetch
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          cd /d "%GITHUB_WORKSPACE%"

          if exist ".git" rmdir /S /Q ".git"

          git init .
          if errorlevel 1 exit /b 70

          rem The self-hosted runner service and the interactive maintenance user can
          rem own the workspace under different Windows SIDs. Mark only this exact
          rem Actions workspace as safe before any repository command.
          git config --global --add safe.directory "%GITHUB_WORKSPACE%"
          if errorlevel 1 exit /b 76

          git remote add origin "https://x-access-token:%GH_TOKEN%@github.com/%GITHUB_REPOSITORY%.git"
          if errorlevel 1 exit /b 71

          set "FETCH_OK=0"
          for /L %%A in (1,1,7) do (
            echo Exact-commit fetch attempt %%A for %GITHUB_SHA%
            git fetch --no-tags --prune --depth=1 origin %GITHUB_SHA%
            if not errorlevel 1 (
              set "FETCH_OK=1"
              goto :fetch_done
            )
            if not "%%A"=="7" powershell.exe -NoProfile -Command "Start-Sleep -Seconds 5"
          )

          :fetch_done
          if not "!FETCH_OK!"=="1" (
            echo ERROR: exact GITHUB_SHA fetch failed after 7 attempts.
            exit /b 72
          )

          rem This dedicated CI workspace retains source files after .git recreation.
          rem Force only the fetched tracked source into place; do not git clean saves/assets.
          git checkout --force --detach FETCH_HEAD
          if errorlevel 1 exit /b 73

          for /f %%S in ('git rev-parse HEAD') do set "CHECKED_SHA=%%S"
          if /I not "!CHECKED_SHA!"=="%GITHUB_SHA%" (
            echo ERROR: checkout SHA mismatch. expected=%GITHUB_SHA% actual=!CHECKED_SHA!
            exit /b 74
          )

          > ".ci-source-sha" echo %GITHUB_SHA%
          if not exist "ShireJourney.uproject" (
            echo ERROR: ShireJourney.uproject missing after exact checkout.
            exit /b 75
          )

          echo Checked out exact commit %GITHUB_SHA% with resilient git fetch.

      - name: Verify Unreal 4.27.2 and project
        shell: cmd
        run: |
          @echo off
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "UEROOT=C:\Program Files\Epic Games\UE_4.27"
          set "BUILDBAT=C:\Program Files\Epic Games\UE_4.27\Engine\Build\BatchFiles\Build.bat"
          set "BUILDVERSION=C:\Program Files\Epic Games\UE_4.27\Engine\Build\Build.version"

          if not exist "%PROJECT%" (
            echo ERROR: ShireJourney.uproject was not found at "%PROJECT%"
            exit /b 30
          )
          if not exist "%BUILDBAT%" (
            echo ERROR: UE4 Build.bat was not found at "%BUILDBAT%"
            exit /b 31
          )
          if not exist "%BUILDVERSION%" (
            echo ERROR: UE4 Build.version was not found at "%BUILDVERSION%"
            exit /b 32
          )

          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$v = Get-Content '%BUILDVERSION%' -Raw | ConvertFrom-Json; Write-Host ('Detected Unreal Engine {0}.{1}.{2}' -f $v.MajorVersion,$v.MinorVersion,$v.PatchVersion); if ($v.MajorVersion -ne 4 -or $v.MinorVersion -ne 27 -or $v.PatchVersion -ne 2) { exit 33 }"
          if errorlevel 1 (
            echo ERROR: Expected Unreal Engine 4.27.2.
            exit /b 33
          )

      - name: Refuse build while Unreal Editor is open
        shell: cmd
        run: |
          @echo off
          tasklist /FI "IMAGENAME eq UE4Editor.exe" | find /I "UE4Editor.exe" >nul
          if not errorlevel 1 (
            echo ERROR: UE4Editor.exe is open. Close Unreal Editor before automated validation.
            exit /b 40
          )
          echo Unreal Editor is closed.
          exit /b 0

      - name: Build ShireJourneyEditor
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "BUILDBAT=C:\Program Files\Epic Games\UE_4.27\Engine\Build\BatchFiles\Build.bat"
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          set "BUILDLOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-UnrealBuild.log"

          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          echo Building exact commit: %GITHUB_SHA%
          echo Project: %PROJECT%
          echo Build log: %BUILDLOG%
          echo Build parallelism: 2 actions, with automatic single-action retry on MSVC PCH virtual-memory exhaustion.

          call "%BUILDBAT%" ShireJourneyEditor Win64 Development "%PROJECT%" -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=2 > "%BUILDLOG%" 2>&1
          set "BUILD_EXIT=!ERRORLEVEL!"

          if not "!BUILD_EXIT!"=="0" (
            findstr /I /C:"error C3859" /C:"fatal error C1076" "%BUILDLOG%" >nul
            if not errorlevel 1 (
              echo.>>"%BUILDLOG%"
              echo CI_BUILD_RETRY: MSVC PCH memory pressure detected; retrying with MaxParallelActions=1.>>"%BUILDLOG%"
              call "%BUILDBAT%" ShireJourneyEditor Win64 Development "%PROJECT%" -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=1 >> "%BUILDLOG%" 2>&1
              set "BUILD_EXIT=!ERRORLEVEL!"
            )
          )

          type "%BUILDLOG%"

          if not "!BUILD_EXIT!"=="0" (
            echo ERROR: UE4.27.2 build failed with exit code !BUILD_EXIT!.
            exit /b !BUILD_EXIT!
          )

          echo UE4.27.2 build succeeded.

      - name: Import production assets in UE4.27.2
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "EDITORCMD=C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe"
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          set "IMPORTLOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-ProductionAssetImport.log"

          if not exist "%EDITORCMD%" (
            echo ERROR: UE4Editor-Cmd.exe was not found at "%EDITORCMD%"
            exit /b 50
          )
          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          echo Importing production source assets for exact commit: %GITHUB_SHA%
          "%EDITORCMD%" "%PROJECT%" -run=ShireProductionImport -unattended -nop4 -nosplash -NoSound -abslog="%IMPORTLOG%"
          set "IMPORT_EXIT=%ERRORLEVEL%"

          if exist "%IMPORTLOG%" (
            findstr /I /C:"ShireProductionImport:" /C:"ShireProductionImport FAILED" /C:"Error:" /C:"Warning:" "%IMPORTLOG%"
          )

          if not "%IMPORT_EXIT%"=="0" (
            echo ERROR: UE4.27.2 production asset import failed with exit code %IMPORT_EXIT%.
            exit /b %IMPORT_EXIT%
          )

          findstr /C:"ShireProductionImport:" "%IMPORTLOG%" | findstr /C:"0 failures" >nul
          if errorlevel 1 (
            echo ERROR: Production asset import did not report zero failures.
            exit /b 51
          )

          echo UE4.27.2 production asset import succeeded.

      - name: Resolve local Python for runtime observation
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "PYEXE="

          for /f "delims=" %%P in ('where python.exe 2^>nul') do (
            if not defined PYEXE set "PYEXE=%%P"
          )

          if not defined PYEXE (
            for /f "delims=" %%P in ('py -3 -c "import sys; print(sys.executable)" 2^>nul') do (
              if not defined PYEXE set "PYEXE=%%P"
            )
          )

          if not defined PYEXE (
            for %%P in (
              "C:\Python311\python.exe"
              "C:\Python310\python.exe"
              "C:\Program Files\Python311\python.exe"
              "C:\Program Files\Python310\python.exe"
            ) do (
              if not defined PYEXE if exist "%%~P" set "PYEXE=%%~P"
            )
          )

          if not defined PYEXE (
            echo ERROR: Local Python 3 was not found on the self-hosted runner.
            exit /b 60
          )

          "!PYEXE!" --version
          if errorlevel 1 exit /b 61

          echo PYTHON_EXE=!PYEXE!>>"%GITHUB_ENV%"
          echo Using local Python: !PYEXE!

      - name: Headless playable startup smoke
        shell: cmd
        run: |
          @echo off
          "%PYTHON_EXE%" Scripts\runtime_smoke.py --editor "C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe" --project ShireJourney.uproject --mode startup
          if errorlevel 1 (
            echo ERROR: Playable startup observation failed.
            exit /b 62
          )

      - name: Headless chapter-by-chapter runtime audit
        shell: cmd
        run: |
          @echo off
          "%PYTHON_EXE%" Scripts\runtime_smoke.py --editor "C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe" --project ShireJourney.uproject --mode chapters
          if errorlevel 1 (
            echo ERROR: Chapter runtime observation failed.
            exit /b 63
          )

      - name: Headless route/story state roundtrip audit
        shell: cmd
        run: |
          @echo off
          "%PYTHON_EXE%" Scripts\runtime_smoke.py --editor "C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe" --project ShireJourney.uproject --mode state
          if errorlevel 1 (
            echo ERROR: Route/story state roundtrip observation failed.
            exit /b 64
          )

      - name: Summarize and guard runtime warning debt
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $LogDir = Join-Path $env:GITHUB_WORKSPACE "Saved\Logs"
          $Files = @(Get-ChildItem -LiteralPath $LogDir -Filter "CI-*.log" -File -ErrorAction SilentlyContinue)

          if ($Files.Count -eq 0) {
            throw "No CI Unreal logs found for warning-debt analysis."
          }

          $Text = ($Files | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
          }) -join "`n"

          $Checks = @(
            @{ Name = "Missing smoothing groups"; Pattern = "No smoothing group information"; Ceiling = 0; Unique = $false },
            @{ Name = "Degenerate tangent bases"; Pattern = "degenerate tangent bases"; Ceiling = 150; Unique = $false },
            @{ Name = "Nearly-zero binormals"; Pattern = "nearly zero bi-normals"; Ceiling = 150; Unique = $false },
            # Baseline debt from the full eight-chapter UE4.27 validation is 71 unique
            # world material package references. Guard regressions above that baseline;
            # do not fail unchanged legacy debt and waste the self-hosted runner cycle.
            @{ Name = "Missing world material packages"; Pattern = "Failed to load '(/Game/Production/World/[^']+)'"; Ceiling = 71; Unique = $true },
            @{ Name = "Missing optional audio"; Pattern = "Failed to load '(/Game/Audio/[^']+)'"; Ceiling = 0; Unique = $true },
            @{ Name = "Missing optional rigs"; Pattern = "Failed to load '(/Game/Production/Characters/Rigs/[^']+)'"; Ceiling = 0; Unique = $true },
            @{ Name = "defaultMat references"; Pattern = "(defaultMat)"; Ceiling = 0; Unique = $true },
            @{ Name = "DirectionalLight mobility warnings"; Pattern = "(DirectionalLight_0.*has to be 'Movable')"; Ceiling = 0; Unique = $true },
            @{ Name = "NPC spawn collision failures"; Pattern = "SpawnActor failed because of collision at the spawn location \[([^\]]+)\] for \[ShireNPC\]"; Ceiling = 0; Unique = $true }
          )

          "### UE4.27 warning-debt guard" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| Category | Count | Ceiling |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "|---|---:|---:|" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $Failures = @()
          foreach ($Check in $Checks) {
            $RegexMatches = [regex]::Matches(
              $Text,
              $Check.Pattern,
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if ($Check.Unique) {
              $Values = @($RegexMatches | ForEach-Object {
                if ($_.Groups.Count -gt 1) { $_.Groups[1].Value } else { $_.Value }
              } | Sort-Object -Unique)
              $Count = $Values.Count
            }
            else {
              $Count = $RegexMatches.Count
            }
            "| $($Check.Name) | $Count | $($Check.Ceiling) |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host ("Warning debt: {0} = {1} (ceiling {2})" -f $Check.Name, $Count, $Check.Ceiling)
            if ($Count -gt $Check.Ceiling) {
              $Failures += "$($Check.Name): $Count > $($Check.Ceiling)"
            }
          }

          if ($Failures.Count -gt 0) {
            throw ("Warning-debt regression detected: " + ($Failures -join "; "))
          }

          Write-Host "Warning-debt guard passed."

      - name: Collect Unreal build logs
        if: always()
        shell: cmd
        run: |
          @echo off
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          if exist "%LOCALAPPDATA%\UnrealBuildTool\Log.txt" (
            copy /Y "%LOCALAPPDATA%\UnrealBuildTool\Log.txt" "%LOGDIR%\CI-UnrealBuildTool.log" >nul
          )

          echo UE4.27.2 build job status: ${{ job.status }}>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %GITHUB_SHA%>>"%GITHUB_STEP_SUMMARY%"

      - name: Report failure log location
        if: failure()
        shell: cmd
        run: |
          @echo off
          echo Build/import logs were already printed into the workflow log.
          echo Self-hosted local log directory: %GITHUB_WORKSPACE%\Saved\Logs
          echo Artifact upload is intentionally skipped to avoid storage-quota failures masking the primary error.
