name: Unreal Build Validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-build-${{ github.repository }}-ue4-device
  # Shared UE4 device runs serialize; never interrupt an active engine validation.
  cancel-in-progress: false

jobs:
  unreal-build:
    name: UE4.27.2 C++ Build
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 55
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Bootstrap Windows runner tools
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          where git.exe >nul 2>&1
          if errorlevel 1 (
            if exist "C:\Program Files\Git\cmd\git.exe" (
              set "PATH=C:\Program Files\Git\cmd;C:\Program Files\Git\mingw64\bin;%PATH%"
              >>"%GITHUB_PATH%" echo C:\Program Files\Git\cmd
              >>"%GITHUB_PATH%" echo C:\Program Files\Git\mingw64\bin
            ) else if exist "C:\Program Files (x86)\Git\cmd\git.exe" (
              set "PATH=C:\Program Files (x86)\Git\cmd;C:\Program Files (x86)\Git\mingw64\bin;%PATH%"
              >>"%GITHUB_PATH%" echo C:\Program Files (x86)\Git\cmd
              >>"%GITHUB_PATH%" echo C:\Program Files (x86)\Git\mingw64\bin
            )
          )
          where git.exe >nul 2>&1
          if errorlevel 1 (
            set "MGROOT=%RUNNER_TEMP%\mingit-2.55.0.5"
            set "MGZIP=%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
            if not exist "%RUNNER_TEMP%\mingit-2.55.0.5\cmd\git.exe" (
              if exist "%RUNNER_TEMP%\mingit-2.55.0.5" rmdir /S /Q "%RUNNER_TEMP%\mingit-2.55.0.5"
              if exist "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip" del /F /Q "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip"
              curl.exe -L --retry 3 --retry-delay 3 -o "%RUNNER_TEMP%\MinGit-2.55.0.5-64-bit.zip" "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip"
              if errorlevel 1 exit /b 20
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath $env:RUNNER_TEMP+'\MinGit-2.55.0.5-64-bit.zip' -DestinationPath $env:RUNNER_TEMP+'\mingit-2.55.0.5' -Force"
              if errorlevel 1 exit /b 21
            )
            set "PATH=%RUNNER_TEMP%\mingit-2.55.0.5\cmd;%RUNNER_TEMP%\mingit-2.55.0.5\mingw64\bin;%PATH%"
            >>"%GITHUB_PATH%" echo %RUNNER_TEMP%\mingit-2.55.0.5\cmd
            >>"%GITHUB_PATH%" echo %RUNNER_TEMP%\mingit-2.55.0.5\mingw64\bin
          )
          where git.exe
          if errorlevel 1 exit /b 22
          git --version
          if errorlevel 1 exit /b 22
          echo Runner bootstrap succeeded.

      - name: Checkout exact PR head
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          cd /d "%GITHUB_WORKSPACE%"
          if not exist ".git" (
            git init
            if errorlevel 1 exit /b 70
          )
          del /F /Q ".git\index.lock" 2>nul
          del /F /Q ".git\shallow.lock" 2>nul
          set "REPO_URL=https://x-access-token:%GH_TOKEN%@github.com/%GITHUB_REPOSITORY%.git"
          git remote get-url origin >nul 2>&1
          if errorlevel 1 (
            git remote add origin "!REPO_URL!"
          ) else (
            git remote set-url origin "!REPO_URL!"
          )
          if errorlevel 1 exit /b 71

          set "FETCHED=0"
          for /L %%A in (1,1,7) do (
            if "!FETCHED!"=="0" (
              echo Fetching exact PR head attempt %%A of 7...
              git fetch --no-tags --prune --depth=1 origin %TARGET_SHA%
              if not errorlevel 1 (
                set "FETCHED=1"
              ) else if not "%%A"=="7" (
                echo Fetch failed; retrying in 5 seconds.
                powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 5"
              )
            )
          )
          if "!FETCHED!"=="0" exit /b 72

          git checkout -f FETCH_HEAD
          if errorlevel 1 exit /b 73
          git reset --hard %TARGET_SHA%
          if errorlevel 1 exit /b 73
          echo Exact-head checkout complete: %TARGET_SHA%.

      - name: Verify exact checkout
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          for /f "delims=" %%S in ('git rev-parse HEAD') do set "CHECKED_SHA=%%S"
          if /I not "%CHECKED_SHA%"=="%TARGET_SHA%" (
            echo ERROR: Checkout SHA mismatch. expected=%TARGET_SHA% actual=%CHECKED_SHA%
            exit /b 74
          )
          >.ci-source-sha echo %TARGET_SHA%
          if not exist "ShireJourney.uproject" (
            echo ERROR: ShireJourney.uproject missing after exact checkout.
            exit /b 75
          )
          echo Checked out exact commit %TARGET_SHA%.

      - name: Verify Unreal 4.27.2 and project
        shell: cmd
        run: |
          @echo off
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "UEROOT=C:\Program Files\Epic Games\UE_4.27"
          set "BUILDBAT=C:\Program Files\Epic Games\UE_4.27\Engine\Build\BatchFiles\Build.bat"
          set "BUILDVERSION=C:\Program Files\Epic Games\UE_4.27\Engine\Build\Build.version"

          if not exist "%PROJECT%" (
            echo ERROR: ShireJourney.uproject was not found at "%PROJECT%"
            exit /b 30
          )
          if not exist "%BUILDBAT%" (
            echo ERROR: UE4 Build.bat was not found at "%BUILDBAT%"
            exit /b 31
          )
          if not exist "%BUILDVERSION%" (
            echo ERROR: UE4 Build.version was not found at "%BUILDVERSION%"
            exit /b 32
          )

          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$v = Get-Content '%BUILDVERSION%' -Raw | ConvertFrom-Json; Write-Host ('Detected Unreal Engine {0}.{1}.{2}' -f $v.MajorVersion,$v.MinorVersion,$v.PatchVersion); if ($v.MajorVersion -ne 4 -or $v.MinorVersion -ne 27 -or $v.PatchVersion -ne 2) { exit 33 }"
          if errorlevel 1 (
            echo ERROR: Expected Unreal Engine 4.27.2.
            exit /b 33
          )

      - name: Wait safely for Unreal Editor to close
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$deadline=(Get-Date).AddMinutes(20); while (Get-Process -Name UE4Editor -ErrorAction SilentlyContinue) { if ((Get-Date) -ge $deadline) { Write-Error 'UE4Editor.exe stayed open for 20 minutes. Close the editor so automated validation can rebuild safely.'; exit 40 }; Write-Host 'UE4Editor.exe is open; waiting 10 seconds instead of terminating it.'; Start-Sleep -Seconds 10 }; Write-Host 'Unreal Editor is closed. Validation may continue.'"
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Prepare and probe local MSVC environment
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\prepare_msvc_environment.ps1"
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Reset project build intermediates
        shell: cmd
        run: |
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\reset_project_build_intermediates.ps1"
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Build ShireJourneyEditor
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "BUILDBAT=C:\Program Files\Epic Games\UE_4.27\Engine\Build\BatchFiles\Build.bat"
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          set "BUILDLOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-UnrealBuild.log"

          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          echo Building exact commit: %TARGET_SHA%
          echo Project: %PROJECT%
          echo Build log: %BUILDLOG%
          echo Build parallelism: 1 action for self-hosted VS2019 reliability.
          echo CI debug symbols: disabled only when SHIRE_CI_NO_DEBUGINFO=1.

          call "%BUILDBAT%" ShireJourneyEditor Win64 Development "%PROJECT%" -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=1 > "%BUILDLOG%" 2>&1
          set "BUILD_EXIT=!ERRORLEVEL!"

          if not "!BUILD_EXIT!"=="0" (
            findstr /I /C:"error C3859" /C:"fatal error C1076" /C:"error D8050" /C:"Command line error D8050" "%BUILDLOG%" >nul
            if not errorlevel 1 (
              echo.>>"%BUILDLOG%"
              echo CI_BUILD_RETRY: MSVC compiler resource/process pressure detected; clearing project intermediates and retrying once.>>"%BUILDLOG%"
              powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$paths=@((Join-Path $env:GITHUB_WORKSPACE 'Intermediate\Build\Win64'),(Join-Path $env:GITHUB_WORKSPACE 'Binaries\Win64')); foreach($p in $paths){ if(Test-Path -LiteralPath $p){ Remove-Item -LiteralPath $p -Recurse -Force } }; Start-Sleep -Seconds 5"
              call "%BUILDBAT%" ShireJourneyEditor Win64 Development "%PROJECT%" -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=1 >> "%BUILDLOG%" 2>&1
              set "BUILD_EXIT=!ERRORLEVEL!"
            )
          )

          type "%BUILDLOG%"

          if not "!BUILD_EXIT!"=="0" (
            echo ERROR: UE4.27.2 build failed with exit code !BUILD_EXIT!.
            exit /b !BUILD_EXIT!
          )

          echo UE4.27.2 build succeeded.

      - name: Import production assets in UE4.27.2
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          set "PROJECT=%GITHUB_WORKSPACE%\ShireJourney.uproject"
          set "EDITORCMD=C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe"
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          set "IMPORTLOG=%GITHUB_WORKSPACE%\Saved\Logs\CI-ProductionAssetImport.log"

          if not exist "%EDITORCMD%" (
            echo ERROR: UE4Editor-Cmd.exe was not found at "%EDITORCMD%"
            exit /b 50
          )
          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          echo Importing production source assets for exact commit: %TARGET_SHA%
          "%EDITORCMD%" "%PROJECT%" -run=ShireProductionImport -unattended -nop4 -nosplash -NoSound -abslog="%IMPORTLOG%"
          set "IMPORT_EXIT=%ERRORLEVEL%"

          if exist "%IMPORTLOG%" (
            findstr /I /C:"ShireProductionImport:" /C:"ShireProductionImport FAILED" /C:"Error:" /C:"Warning:" "%IMPORTLOG%"
          )

          if not "%IMPORT_EXIT%"=="0" (
            echo ERROR: UE4.27.2 production asset import failed with exit code %IMPORT_EXIT%.
            exit /b %IMPORT_EXIT%
          )

          findstr /C:"ShireProductionImport:" "%IMPORTLOG%" | findstr /C:"0 failures" >nul
          if errorlevel 1 (
            echo ERROR: Production asset import did not report zero failures.
            exit /b 51
          )

          echo UE4.27.2 production asset import succeeded.

      - name: Resolve local Python for runtime observation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\resolve_runtime_python.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Headless playable startup smoke
        shell: cmd
        run: |
          @echo off
          "%PYTHON_EXE%" Scripts\runtime_smoke.py --editor "C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe" --project ShireJourney.uproject --mode startup
          if errorlevel 1 (
            echo ERROR: Playable startup observation failed.
            exit /b 62
          )

      - name: Headless chapter-by-chapter runtime audit
        shell: cmd
        run: |
          @echo off
          "%PYTHON_EXE%" Scripts\runtime_smoke.py --editor "C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe" --project ShireJourney.uproject --mode chapters
          if errorlevel 1 (
            echo ERROR: Chapter runtime observation failed.
            exit /b 63
          )

      - name: Headless route/story state roundtrip audit
        shell: cmd
        run: |
          @echo off
          "%PYTHON_EXE%" Scripts\runtime_smoke.py --editor "C:\Program Files\Epic Games\UE_4.27\Engine\Binaries\Win64\UE4Editor-Cmd.exe" --project ShireJourney.uproject --mode state
          if errorlevel 1 (
            echo ERROR: Route/story state roundtrip observation failed.
            exit /b 64
          )

      - name: Summarize and guard runtime warning debt
        shell: cmd
        run: |
          @echo off
          "%PYTHON_EXE%" Scripts\warning_debt_guard.py --log-dir Saved\Logs --summary "%GITHUB_STEP_SUMMARY%"
          if errorlevel 1 (
            echo ERROR: Warning-debt regression detected.
            exit /b 65
          )

      - name: Collect Unreal build logs
        if: always()
        shell: cmd
        run: |
          @echo off
          set "LOGDIR=%GITHUB_WORKSPACE%\Saved\Logs"
          if not exist "%LOGDIR%" mkdir "%LOGDIR%"

          if exist "%LOCALAPPDATA%\UnrealBuildTool\Log.txt" (
            copy /Y "%LOCALAPPDATA%\UnrealBuildTool\Log.txt" "%LOGDIR%\CI-UnrealBuildTool.log" >nul
          )

          echo UE4.27.2 build job status: ${{ job.status }}>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %TARGET_SHA%>>"%GITHUB_STEP_SUMMARY%"

      - name: Report failure log location
        if: failure()
        shell: cmd
        run: |
          @echo off
          echo Build/import logs were already printed into the workflow log.
          echo Self-hosted local log directory: %GITHUB_WORKSPACE%\Saved\Logs
          echo Artifact upload is intentionally skipped to avoid storage-quota failures masking the primary error.

