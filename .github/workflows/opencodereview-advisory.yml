name: OpenCodeReview Advisory

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

# This reviewer is advisory only.
# It can read repository contents and publish PR review comments.
# It has no repository-content write permission, no push permission,
# no merge permission, and it never runs code from the PR head.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advisory-review:
    # Secrets are intentionally available only to same-repository PRs.
    # Fork PRs are skipped instead of widening trust.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Keep OCR completely off the persistent UE4.27 self-hosted workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run OpenCodeReview in advisory mode
        uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          language: English
          effort: medium

          # Evidence only. Never mutate project files or old review threads.
          upload_artifacts: 'true'
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'false'
          resolve_outdated: 'false'

          # Keep low-value style/docs notes out of inline code noise.
          route_categories: style,documentation
