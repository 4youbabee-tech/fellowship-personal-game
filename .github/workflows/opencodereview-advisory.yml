name: OpenCodeReview Advisory

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

# Advisory reviewer only:
# - repository contents are read-only
# - no code execution from PR head
# - no commit/push/merge permission
# - pull-request write is used only to publish review comments
permissions:
  contents: read
  pull-requests: write

jobs:
  advisory-review:
    # Keep OCR off the persistent UE4 self-hosted workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )

    steps:
      - name: Resolve PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview in advisory mode
        uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          language: English
          effort: medium
          upload_artifacts: 'true'
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'false'
          resolve_outdated: 'false'
          route_categories: style,documentation
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
