name: P1C01 Frodo Hosted Animation Retarget

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Data/P1C01FrodoAnimationRetargetV1.json'
      - 'Scripts/run_p1c01_frodo_animation_retarget.py'
      - 'Scripts/test_p1c01_frodo_animation_retarget_contract.py'
      - 'Scripts/stage_p1c01_human_wave2.ps1'
      - 'Data/P1C01HumanCharacterProductionWave2V1.json'
      - '.github/workflows/p1c01-frodo-animation-retarget.yml'

permissions:
  contents: read

concurrency:
  group: p1c01-frodo-animation-retarget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted_retarget:
    name: Hosted exact-winner Idle Walk Run retarget
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Static retarget contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest Scripts/test_p1c01_frodo_animation_retarget_contract.py
          echo P1C01_FRODO_HOSTED_RETARGET_CONTRACT_PASS

      - name: Install Blender and numpy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --background --factory-startup --python-exit-code 18 --python-expr "import numpy as np; print('P1C01_FRODO_RETARGET_BLENDER_PASS version='+np.__version__)"

      - name: Regenerate exact Rogue normalized target on hosted runner
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/Scripts/stage_p1c01_human_wave2.ps1" -ManifestPath "$env:GITHUB_WORKSPACE/Data/P1C01HumanCharacterProductionWave2V1.json" -OutputRoot "$env:RUNNER_TEMP/shire-frodo-retarget/human" -BlenderExecutable "blender"
          if($LASTEXITCODE -ne 0){ throw "P1C01_FRODO_RETARGET_TARGET_STAGE_FAIL exit=$LASTEXITCODE" }

      - name: Enforce exact prior technical winner identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'shire-frodo-retarget','human','p1c01_human_wave2_hosted.json')
          r=json.load(open(p,encoding='utf-8-sig'))
          expected='75d715f6ce4673a650a4382bc4f86b7ae0baf0fe548cc63f9b6ded1800f669be'
          rows=[x for x in r.get('normalized_candidates',[]) if x.get('normalized_sha256','').lower()==expected]
          if len(rows)!=1 or rows[0].get('source_entry')!='Rogue.fbx':
              raise SystemExit('P1C01_FRODO_RETARGET_TARGET_IDENTITY_FAIL')
          print('P1C01_FRODO_RETARGET_TARGET_IDENTITY_PASS sha256='+expected)
          PY

      - name: Download pinned public animation archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shire-frodo-retarget"
          curl --fail --location --retry 3 --retry-delay 3 \
            --user-agent 'ShireJourneyRetarget/1.0' \
            'https://opengameart.org/sites/default/files/universal_animation_librarystandard.zip' \
            --output "$RUNNER_TEMP/shire-frodo-retarget/universal_animation_librarystandard.zip"
          echo '18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2  '"$RUNNER_TEMP/shire-frodo-retarget/universal_animation_librarystandard.zip" | sha256sum -c -

      - name: Run hosted technical retarget and derivative re-import gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shire-frodo-retarget/output"
          blender --background --factory-startup --python-exit-code 17 \
            --python "$GITHUB_WORKSPACE/Scripts/run_p1c01_frodo_animation_retarget.py" -- \
            --manifest "$GITHUB_WORKSPACE/Data/P1C01FrodoAnimationRetargetV1.json" \
            --human-receipt "$RUNNER_TEMP/shire-frodo-retarget/human/p1c01_human_wave2_hosted.json" \
            --human-root "$RUNNER_TEMP/shire-frodo-retarget/human" \
            --animation-archive "$RUNNER_TEMP/shire-frodo-retarget/universal_animation_librarystandard.zip" \
            --output-root "$RUNNER_TEMP/shire-frodo-retarget/output" \
            --receipt "$RUNNER_TEMP/shire-frodo-retarget/p1c01_frodo_retarget.json"

      - name: Enforce hosted retarget receipt boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'shire-frodo-retarget','p1c01_frodo_retarget.json')
          r=json.load(open(p,encoding='utf-8'))
          if r.get('status')!='HOSTED_RETARGET_TECHNICAL_PASS' or not r.get('retarget_technical_pass'):
              raise SystemExit('P1C01_FRODO_HOSTED_RETARGET_RECEIPT_FAIL')
          if r.get('retarget_visual_accepted') or r.get('ue4_animation_imported') or r.get('runtime_integration_allowed'):
              raise SystemExit('P1C01_FRODO_HOSTED_RETARGET_BOUNDARY_FAIL')
          if sorted(r.get('retargeted_clips',{}))!=['idle','run','walk']:
              raise SystemExit('P1C01_FRODO_HOSTED_RETARGET_CLIP_SET_FAIL')
          print('P1C01_FRODO_HOSTED_RETARGET_RECEIPT_PASS')
          PY

      - name: Upload exact-head retarget evidence and animation derivatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-frodo-hosted-retarget-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/shire-frodo-retarget/p1c01_frodo_retarget.json
            ${{ runner.temp }}/shire-frodo-retarget/output/Frodo_Idle_Retarget.fbx
            ${{ runner.temp }}/shire-frodo-retarget/output/Frodo_Walk_Retarget.fbx
            ${{ runner.temp }}/shire-frodo-retarget/output/Frodo_Run_Retarget.fbx
          if-no-files-found: error
          retention-days: 14
