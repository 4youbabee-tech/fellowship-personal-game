name: P1C01 Existing Adaptive Source PBR Conversion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p1c01-adaptive-pbr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source_pbr_conversion:
    name: Convert existing 39-asset CC0 FBX + maps to source PNG candidates; NO UE4
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENCV_IO_ENABLE_OPENEXR: '1'
    steps:
      - name: Checkout exact SHA without Git LFS
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          lfs: false
          fetch-depth: 1

      - name: Source tests and lightweight image tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m pip install -q --disable-pip-version-check 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5' 'Pillow>=10,<13'
          python3 -m unittest discover -s Scripts -p test_p1c01_adaptive_pbr.py -v

      - name: Retrieve the existing certified source artifact, not the provider
        uses: actions/download-artifact@v4
        with:
          run-id: 37979256311
          name: p1c01-adaptive-polyhaven-source-17aa93bf4f3307a9e8b0c0b12a326c3548bcee79
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p1c01-adaptive-source

      - name: Repack unchanged input files for streaming hash-verified conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'p1c01-adaptive-source'
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'existing-source.zip'
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as out:
              for f in sorted(root.rglob('*')):
                  if f.is_file(): out.write(f,f.relative_to(root).as_posix())
          PY

      - name: Convert all hash-valid source FBX and 1K PNG materials
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/prepare_p1c01_adaptive_pbr.py --source-artifact "$RUNNER_TEMP/existing-source.zip" --output "$RUNNER_TEMP/p1c01-adaptive-pbr" --source-run-id 37979256311 --source-artifact-id 11640236408
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"p1c01-adaptive-pbr"/"p1c01_adaptive_pbr_receipt.json").read_text())
          assert r["input_assets"] == 39 and r["prepared_assets"] == 39 and r["prepared_png"] >= 146, r
          assert r["held_material_variants_total"] == 1 and not r["quarantined"], r
          print("P1C01_39_SOURCE_PBR_QC_PASS prepared=39 quarantine=0 held_alt_diffuse=1 NOT_UE4_IMPORTED")
          PY

      - name: Upload converted source candidates plus status/biome receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-adaptive-pbr-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/p1c01-adaptive-pbr
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
