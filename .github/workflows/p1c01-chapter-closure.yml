name: P1C01 Chapter Closure Pack

on:
  push:
    branches:
      - develop
      - production/p1c01-bulk-smart-ci-governor-2026-10-09
    paths:
      - 'Data/P1C01MaterialImportWaveV2.json'
      - 'Data/WarehouseP1C01ClosurePromotionTrainV2.json'
      - 'Data/P1C01ChapterClosureMegaPackV2.json'
      - 'Data/P1C01OneShotChapterFinishV1.json'
      - 'Data/P1C01CharacterRigAnimationPrepV1.json'
      - 'Scripts/preflight_p1c01_chapter_closure_pack_v2.ps1'
      - 'Scripts/run_p1c01_chapter_closure_pack_v2.ps1'
      - 'Scripts/run_warehouse_p1c01_mega_promotion.ps1'
      - '.github/workflows/p1c01-chapter-closure.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'Data/P1C01MaterialImportWaveV2.json'
      - 'Data/WarehouseP1C01ClosurePromotionTrainV2.json'
      - 'Data/P1C01ChapterClosureMegaPackV2.json'
      - 'Data/P1C01OneShotChapterFinishV1.json'
      - 'Data/P1C01CharacterRigAnimationPrepV1.json'
      - 'Scripts/preflight_p1c01_chapter_closure_pack_v2.ps1'
      - 'Scripts/run_p1c01_chapter_closure_pack_v2.ps1'
      - '.github/workflows/p1c01-chapter-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1c01-chapter-closure-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  closure:
    if: ${{ github.event_name != 'pull_request' }}
    name: Run P1C01 closure source train
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 180
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      DELTA_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}

    steps:
      - name: Prepare lightweight closure graph
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GIT_LFS_SKIP_SMUDGE=1"
          set "GITEXE="
          for /f "delims=" %%G in ('where git.exe 2^>nul') do if not defined GITEXE set "GITEXE=%%G"
          if not defined GITEXE if exist "C:\Program Files\Git\cmd\git.exe" set "GITEXE=C:\Program Files\Git\cmd\git.exe"
          if not defined GITEXE if exist "C:\Program Files (x86)\Git\cmd\git.exe" set "GITEXE=C:\Program Files (x86)\Git\cmd\git.exe"
          if not defined GITEXE exit /b 22
          set "CLOSURE_SRC=%RUNNER_TEMP%\shire-closure-src-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if exist "!CLOSURE_SRC!" rmdir /S /Q "!CLOSURE_SRC!"
          mkdir "!CLOSURE_SRC!"
          cd /d "!CLOSURE_SRC!"
          "!GITEXE!" init
          if errorlevel 1 exit /b 70
          "!GITEXE!" -c credential.helper= remote add origin "https://x-access-token:!GH_TOKEN!@github.com/%GITHUB_REPOSITORY%.git"
          if errorlevel 1 exit /b 71
          rem Network can be very slow: bounded retries preserve exact SHA.
          rem Do not start another complete UE train simply because curl stalled.
          set "FETCH_OK="
          for /L %%R in (1,1,3) do (
            if not defined FETCH_OK (
              echo P1C01_CLOSURE_SOURCE_FETCH_ATTEMPT attempt=%%R/3
              "!GITEXE!" -c credential.helper= -c http.version=HTTP/1.1 -c http.lowSpeedLimit=128 -c http.lowSpeedTime=45 fetch --no-tags --depth=2 origin !TARGET_SHA!
              if not errorlevel 1 (
                set "FETCH_OK=1"
                echo P1C01_CLOSURE_SOURCE_FETCH_PASS attempt=%%R
              ) else (
                echo P1C01_CLOSURE_SOURCE_FETCH_RETRY attempt=%%R
                if not "%%R"=="3" powershell.exe -NoProfile -Command "Start-Sleep -Seconds 4"
              )
            )
          )
          if not defined FETCH_OK (
            echo P1C01_CLOSURE_SOURCE_FETCH_FAIL attempts=3
            exit /b 72
          )
          echo SHIRE_CLOSURE_SOURCE=!CLOSURE_SRC!>>"%GITHUB_ENV%"
          echo P1C01_CLOSURE_GRAPH_READY sha=!TARGET_SHA! source=!CLOSURE_SRC!

      - name: Classify closure-relevant delta before checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runClosure = $true
          $reason = 'fail-safe'
          $base = $env:DELTA_BASE_SHA
          $target = $env:TARGET_SHA
          Set-Location -LiteralPath $env:SHIRE_CLOSURE_SOURCE

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $reason = 'manual-dispatch'
          }
          elseif ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $reason = 'missing-base-fail-safe'
          }
          else {
            # A depth-2 exact-head fetch already contains the direct parent
            # for our one-commit production waves. Do not pull it again.
            & git cat-file -e "$base^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "P1C01_CLOSURE_DELTA_BASE_REUSED sha=$base"
            } else {
              $baseFetched = $false
              for($try=1;$try -le 3;$try++){
                & git -c credential.helper= -c http.version=HTTP/1.1 -c http.lowSpeedLimit=128 -c http.lowSpeedTime=45 fetch --no-tags --depth=1 origin $base
                if ($LASTEXITCODE -eq 0) { $baseFetched = $true; break }
                if($try -lt 3){Start-Sleep -Seconds 4}
              }
              if (-not $baseFetched) { throw "Unable to fetch closure delta base $base after 3 attempts" }
            }

            $changed = @(& git diff --name-only $base $target)
            if ($LASTEXITCODE -ne 0) { throw 'Unable to classify closure delta.' }

            $closureInputs = @(
              'Data/P1C01MaterialImportWaveV2.json',
              'Data/WarehouseP1C01ClosurePromotionTrainV2.json',
              'Data/P1C01ChapterClosureMegaPackV2.json',
              'Data/P1C01OneShotChapterFinishV1.json',
              'Data/P1C01CharacterRigAnimationPrepV1.json',
              'Scripts/preflight_p1c01_chapter_closure_pack_v2.ps1',
              'Scripts/run_p1c01_chapter_closure_pack_v2.ps1',
              'Scripts/run_warehouse_p1c01_mega_promotion.ps1',
              '.github/workflows/p1c01-chapter-closure.yml'
            )
            $relevant = @($changed | Where-Object { $closureInputs -contains $_ })
            if ($relevant.Count -eq 0) {
              $runClosure = $false
              $reason = 'no-closure-input-delta'
            }
            else {
              $reason = 'closure-input-delta:' + ($relevant -join ',')
            }
          }

          "RUN_P1C01_CLOSURE=$($runClosure.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "P1C01_CLOSURE_DELTA_CLASSIFICATION run=$runClosure reason=$reason base=$base target=$target"

      - name: Checkout exact closure head without LFS hydration
        if: env.RUN_P1C01_CLOSURE == 'true'
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GIT_LFS_SKIP_SMUDGE=1"
          cd /d "%SHIRE_CLOSURE_SOURCE%"
          git checkout -f %TARGET_SHA%
          if errorlevel 1 exit /b 73
          for /f "delims=" %%H in ('git rev-parse HEAD') do set "CHECKED_SHA=%%H"
          if /I not "!CHECKED_SHA!"=="%TARGET_SHA%" exit /b 74
          echo P1C01_CLOSURE_EXACT_CHECKOUT_PASS sha=!CHECKED_SHA! lfsHydration=skipped

      - name: Verify runner session health
        if: env.RUN_P1C01_CLOSURE == 'true'
        shell: powershell
        run: |
          $params=@()
          if($env:GITHUB_REF_NAME -eq "production/p1c01-bulk-smart-ci-governor-2026-10-09"){
            $params += "-SourceOnlyGitHttpsProbe"
            Write-Host "P1C01_SOURCE_ONLY_NETWORK_PROOF mode=git-https"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SHIRE_CLOSURE_SOURCE\Scripts\verify_runner_session.ps1" @params
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Fast closure preflight
        if: env.RUN_P1C01_CLOSURE == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_CLOSURE_SOURCE%\Scripts\preflight_p1c01_chapter_closure_pack_v2.ps1" -ManifestPath "%SHIRE_CLOSURE_SOURCE%\Data\P1C01ChapterClosureMegaPackV2.json"

      - name: Execute new source assets first and defer admin-only audits
        if: env.RUN_P1C01_CLOSURE == 'true'
        shell: powershell
        run: |
          $params=@("-ManifestPath", "$env:SHIRE_CLOSURE_SOURCE\Data\P1C01ChapterClosureMegaPackV2.json")
          if($env:GITHUB_REF_NAME -eq "production/p1c01-bulk-smart-ci-governor-2026-10-09") {
            $params += "-AssetFirst"
            Write-Host "P1C01_ASSET_FIRST_WAVE_EXECUTE"
          } else {
            Write-Host "P1C01_FULL_SOURCE_CLOSEOUT_EXECUTE"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:SHIRE_CLOSURE_SOURCE\Scripts\run_p1c01_chapter_closure_pack_v2.ps1" @params
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Publish exact source wave count and partial failures
        if: env.RUN_P1C01_CLOSURE == 'true'
        shell: powershell
        run: |
          $root="D:\actions-runner\_warehouse\ShireJourney"
          $pack=Join-Path $root "_p1c01_chapter_closure_pack_v2\p1c01_chapter_closure_pack_v2_latest.json"
          if(-not (Test-Path -LiteralPath $pack -PathType Leaf)){throw "P1C01_SOURCE_WAVE_RECEIPT_MISSING"}
          $p=Get-Content -LiteralPath $pack -Raw | ConvertFrom-Json
          Write-Host "P1C01_SOURCE_WAVE_RECEIPT_STATE passed=$($p.passed_count) quarantined=$($p.quarantined_count) hard=$($p.hard_failure_count) mode=$($p.execution_mode)"
          $promo=Join-Path $root "_p1c01_chapter_closure_promotion_v2\p1c01_mega_promotion_latest.json"
          if(Test-Path -LiteralPath $promo -PathType Leaf){
            $q=Get-Content -LiteralPath $promo -Raw | ConvertFrom-Json
            Write-Host "P1C01_QUALIFIED_SOURCE_METRICS newly_prepared=$($q.newly_prepared_count) newly_prepared_bytes=$($q.newly_prepared_bytes) reused=$($q.reused_existing_count) qc_ready=$($q.intake_qc_prepared_count) pending=$($q.pending_count) manual=$($q.manual_queue_count) receipt_rebased=$($q.source_paths_rebased_from_legacy_runner)"
            @(
              "### P1C01 warehouse source wave (not playable integration)"
              "- Exact SHA: $env:TARGET_SHA"
              "- New prepared source rows: $($q.newly_prepared_count)"
              "- New prepared source bytes: $($q.newly_prepared_bytes)"
              "- Reused SHA256-proven source rows: $($q.reused_existing_count)"
              "- Intake QC candidate rows: $($q.intake_qc_prepared_count)"
              "- Pending / manual queue: $($q.pending_count) / $($q.manual_queue_count)"
              "- Administrative or blocked cars: $($p.quarantined_count)"
              "- **Not proof of UE import, live chapter visual, device or Gate 6/7.**"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            Write-Warning "P1C01_SOURCE_WAVE_PROMOTION_RECEIPT_MISSING"
          }

      - name: Upload durable P1C01 source intake receipts
        if: env.RUN_P1C01_CLOSURE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-warehouse-source-receipts-${{ github.run_id }}
          path: |
            D:/actions-runner/_warehouse/ShireJourney/_p1c01_chapter_closure_pack_v2/p1c01_chapter_closure_pack_v2_latest.json
            D:/actions-runner/_warehouse/ShireJourney/_p1c01_chapter_closure_promotion_v2/p1c01_mega_promotion_latest.json
            D:/actions-runner/_warehouse/ShireJourney/_p1c01_character_intake/p1c01_character_rig_intake_receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove isolated closure source checkout
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined SHIRE_CLOSURE_SOURCE if exist "%SHIRE_CLOSURE_SOURCE%" rmdir /S /Q "%SHIRE_CLOSURE_SOURCE%"
          exit /b 0
