name: P1C01 Bag End Trim Static FBX QC

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Data/P1C01BagEndHeroTrimSourceProbeV1.json'
      - 'Scripts/test_p1c01_bag_end_trim_static_fbx_qc.ps1'
      - '.github/workflows/p1c01-bag-end-trim-static-fbx-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static QC exact Bag End trim FBX files
        shell: powershell
        run: '& "$env:GITHUB_WORKSPACE\Scripts\test_p1c01_bag_end_trim_static_fbx_qc.ps1" -ManifestPath "$env:GITHUB_WORKSPACE\Data\P1C01BagEndHeroTrimSourceProbeV1.json" -OutputRoot "$env:RUNNER_TEMP\shire-bag-end-trim-static-qc"'
      - uses: actions/upload-artifact@v4
        with:
          name: p1c01-bag-end-trim-static-fbx-qc
          path: ${{ runner.temp }}\shire-bag-end-trim-static-qc\p1c01_bag_end_trim_static_fbx_qc.json
          if-no-files-found: error
          retention-days: 14
