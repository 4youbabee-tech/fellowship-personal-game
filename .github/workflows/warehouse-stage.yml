name: Warehouse Stage

on:
  push:
    branches:
      - integration/comprehensive-foundation-v1
    paths:
      - 'Data/WarehouseAcquisitionBatchV1.json'
      - 'Scripts/stage_polyhaven_warehouse.ps1'
      - 'Data/WarehouseAudioAcquisitionBatchV1.json'
      - 'Scripts/stage_opengameart_audio.ps1'
      - 'Data/WarehouseQuaterniusAcquisitionBatchV1.json'
      - 'Scripts/stage_quaternius_warehouse.ps1'
      - 'Data/WarehouseAmbientCGAcquisitionBatchV1.json'
      - 'Scripts/stage_ambientcg_warehouse.ps1'
      - 'Data/WarehouseKenneyAcquisitionBatchV1.json'
      - 'Scripts/stage_kenney_warehouse.ps1'
      - 'Data/WarehouseKayKitGitHubAcquisitionBatchV1.json'
      - 'Scripts/stage_kaykit_github_warehouse.ps1'
      - 'Data/WarehouseAmbientCGTrilogyBatchV2.json'
      - 'Scripts/audit_warehouse_inventory.ps1'
      - 'Scripts/warehouse_network.ps1'
      - 'Data/WarehouseProviderAccessPolicyV1.json'
      - '.github/workflows/warehouse-stage.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'Data/WarehouseAcquisitionBatchV1.json'
      - 'Scripts/stage_polyhaven_warehouse.ps1'
      - 'Data/WarehouseAudioAcquisitionBatchV1.json'
      - 'Scripts/stage_opengameart_audio.ps1'
      - 'Data/WarehouseQuaterniusAcquisitionBatchV1.json'
      - 'Scripts/stage_quaternius_warehouse.ps1'
      - 'Data/WarehouseAmbientCGAcquisitionBatchV1.json'
      - 'Scripts/stage_ambientcg_warehouse.ps1'
      - 'Data/WarehouseKenneyAcquisitionBatchV1.json'
      - 'Scripts/stage_kenney_warehouse.ps1'
      - 'Data/WarehouseKayKitGitHubAcquisitionBatchV1.json'
      - 'Scripts/stage_kaykit_github_warehouse.ps1'
      - 'Data/WarehouseAmbientCGTrilogyBatchV2.json'
      - 'Scripts/audit_warehouse_inventory.ps1'
      - 'Scripts/warehouse_network.ps1'
      - 'Data/WarehouseProviderAccessPolicyV1.json'
      - '.github/workflows/warehouse-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delta:
    name: Detect warehouse delta on GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_stage: ${{ steps.detect.outputs.run_stage }}
      changed_count: ${{ steps.detect.outputs.changed_count }}
      relevant_count: ${{ steps.detect.outputs.relevant_count }}
      control_changed: ${{ steps.detect.outputs.control_changed }}
    steps:
      - name: Checkout exact event head for delta detection
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Detect warehouse delta before touching the self-hosted runner
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_stage=false
          mode=""
          base=""
          head=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_stage=true
            mode="manual-dispatch"
          elif [[ "$EVENT_NAME" == "pull_request" && "$EVENT_ACTION" == "synchronize" && -n "$EVENT_BEFORE" && -n "$EVENT_AFTER" ]]; then
            base="$EVENT_BEFORE"
            head="$EVENT_AFTER"
            mode="pr-synchronize-delta"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            mode="pr-full-delta"
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && -n "$EVENT_AFTER" ]]; then
            base="$EVENT_BEFORE"
            head="$EVENT_AFTER"
            mode="push-delta"
          else
            run_stage=true
            mode="unknown-event-fail-safe"
          fi

          changed=()
          relevant=()
          control_changed=false

          if [[ "$run_stage" != "true" ]]; then
            if [[ -z "$base" || -z "$head" || "$base" =~ ^0+$ ]]; then
              run_stage=true
              mode="$mode-invalid-range-fail-safe"
            else
              ensure_commit() {
                local sha="$1"
                if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
                  git fetch --no-tags --depth=1 origin "$sha"
                fi
                git cat-file -e "$sha^{commit}"
              }

              ensure_commit "$base"
              ensure_commit "$head"
              mapfile -t changed < <(git diff --name-only "$base" "$head")

              for path in "${changed[@]}"; do
                case "$path" in
                  Data/Warehouse*.json|Scripts/stage_*_warehouse.ps1|Scripts/stage_opengameart_audio.ps1|Scripts/audit_warehouse_inventory.ps1|Scripts/warehouse_network.ps1)
                    relevant+=("$path")
                    ;;
                  .github/workflows/warehouse-stage.yml)
                    control_changed=true
                    ;;
                esac
              done

              if (( ${#relevant[@]} > 0 )); then
                run_stage=true
              fi
            fi
          fi

          echo "WAREHOUSE_DELTA mode=$mode base=$base head=$head changed=${#changed[@]} relevant=${#relevant[@]} control=$control_changed runStage=$run_stage"
          for path in "${changed[@]}"; do echo "WAREHOUSE_DELTA_FILE $path"; done
          for path in "${relevant[@]}"; do echo "WAREHOUSE_STAGE_INPUT $path"; done

          echo "run_stage=$run_stage" >> "$GITHUB_OUTPUT"
          echo "changed_count=${#changed[@]}" >> "$GITHUB_OUTPUT"
          echo "relevant_count=${#relevant[@]}" >> "$GITHUB_OUTPUT"
          echo "control_changed=$control_changed" >> "$GITHUB_OUTPUT"

  no-stage:
    name: Warehouse no-delta fast path
    needs: delta
    if: needs.delta.outputs.run_stage != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Warehouse staging not required for this update
        shell: bash
        run: echo "WAREHOUSE_HOSTED_DELTA_SKIP changed=${{ needs.delta.outputs.changed_count }} relevant=${{ needs.delta.outputs.relevant_count }} control=${{ needs.delta.outputs.control_changed }}"

  stage:
    name: Stage CC0 warehouse batch
    needs: delta
    if: needs.delta.outputs.run_stage == 'true'
    concurrency:
      group: unreal-build-${{ github.repository }}-ue4-device
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 60
    steps:
      - name: Checkout exact warehouse head with bounded retries
        shell: cmd
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GITEXE="
          for /f "delims=" %%G in ('where git.exe 2^>nul') do if not defined GITEXE set "GITEXE=%%G"
          if not defined GITEXE if exist "C:\Program Files\Git\cmd\git.exe" set "GITEXE=C:\Program Files\Git\cmd\git.exe"
          if not defined GITEXE if exist "C:\Program Files (x86)\Git\cmd\git.exe" set "GITEXE=C:\Program Files (x86)\Git\cmd\git.exe"
          if not defined GITEXE exit /b 22

          echo Warehouse exact-head checkout target=!TARGET_SHA!
          if exist ".git" rmdir /S /Q ".git"
          if exist ".git" exit /b 76
          "!GITEXE!" init
          if errorlevel 1 exit /b 70
          "!GITEXE!" remote add origin "https://x-access-token:!GH_TOKEN!@github.com/%GITHUB_REPOSITORY%.git"
          if errorlevel 1 exit /b 71

          set ATTEMPT=0
          :fetch
          set /a ATTEMPT+=1
          echo Fetching exact warehouse head attempt !ATTEMPT! of 7...
          "!GITEXE!" fetch --no-tags --prune --depth=20 origin !TARGET_SHA!
          if not errorlevel 1 goto fetched
          if !ATTEMPT! GEQ 7 exit /b 72
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 5"
          goto fetch

          :fetched
          "!GITEXE!" checkout -f FETCH_HEAD
          if errorlevel 1 exit /b 73
          "!GITEXE!" reset --hard !TARGET_SHA!
          if errorlevel 1 exit /b 73
          for /f "delims=" %%H in ('"!GITEXE!" rev-parse HEAD') do set "CHECKED_SHA=%%H"
          if /I not "!CHECKED_SHA!"=="!TARGET_SHA!" (
            echo ERROR: Warehouse checkout SHA mismatch expected=!TARGET_SHA! actual=!CHECKED_SHA!
            exit /b 74
          )
          if not exist "ShireJourney.uproject" exit /b 75
          echo WAREHOUSE_CHECKOUT_PASS sha=!CHECKED_SHA!

      - name: Stage first Poly Haven CC0 batch
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_polyhaven_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseAcquisitionBatchV1.json"

      - name: Stage first OpenGameArt CC0 audio batch
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_opengameart_audio.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseAudioAcquisitionBatchV1.json"

      - name: Stage Quaternius CC0 character/world batch
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_quaternius_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseQuaterniusAcquisitionBatchV1.json"

      - name: Stage ambientCG CC0 material batch
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_ambientcg_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseAmbientCGAcquisitionBatchV1.json"

      - name: Stage ambientCG trilogy-region material batch
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_ambientcg_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseAmbientCGTrilogyBatchV2.json"

      - name: Stage Kenney CC0 support packs
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_kenney_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseKenneyAcquisitionBatchV1.json"

      - name: Stage KayKit public GitHub CC0 support packs
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_kaykit_github_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseKayKitGitHubAcquisitionBatchV1.json"

      - name: Audit persistent warehouse inventory
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\audit_warehouse_inventory.ps1"

      - name: Show persistent warehouse footprint
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$root='C:\actions-runner\_warehouse\ShireJourney'; if (!(Test-Path $root)) { throw ('Persistent warehouse root missing: ' + $root) }; $files=Get-ChildItem -Path $root -Recurse -File; $bytes=($files | Measure-Object -Property Length -Sum).Sum; Write-Host ('WAREHOUSE_FOOTPRINT files=' + $files.Count + ' bytes=' + $bytes + ' root=' + $root)"
