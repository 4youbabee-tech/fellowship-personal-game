name: Warehouse Stage

on:
  push:
    branches:
      - develop
    paths:
      - 'Data/WarehouseAcquisitionBatchV1.json'
      - 'Scripts/stage_polyhaven_warehouse.ps1'
      - 'Data/WarehouseAudioAcquisitionBatchV1.json'
      - 'Scripts/stage_opengameart_audio.ps1'
      - 'Data/WarehouseQuaterniusAcquisitionBatchV1.json'
      - 'Data/WarehouseQuaterniusHeroCandidateBatchV1.json'
      - 'Scripts/stage_quaternius_warehouse.ps1'
      - 'Data/P1C01OpenGameArtHeroCandidateBatchV1.json'
      - 'Data/P1C01OpenGameArtRpgHeroCandidateBatchV1.json'
      - 'Data/P1C01KayKitAdventurersHeroCandidateBatchV1.json'
      - 'Data/P1C01KayKitAdventurersRogueHoodedHeroCandidateBatchV1.json'
      - 'Scripts/stage_opengameart_character_candidate.ps1'
      - 'Scripts/inspect_p1c01_frodo_fbx_candidate.ps1'
      - 'Scripts/test_p1c01_frodo_candidate_semantic_qc.ps1'
      - 'Data/P1C01CharacterRigAnimationPrepV1.json'
      - 'Data/P1C01HeroSkeletalCandidateWaveV1.json'
      - 'Scripts/prepare_p1c01_character_rig_intake.ps1'
      - 'Data/WarehouseAmbientCGAcquisitionBatchV1.json'
      - 'Scripts/stage_ambientcg_warehouse.ps1'
      - 'Data/WarehouseKenneyAcquisitionBatchV1.json'
      - 'Scripts/stage_kenney_warehouse.ps1'
      - 'Data/WarehouseKayKitGitHubAcquisitionBatchV1.json'
      - 'Scripts/stage_kaykit_github_warehouse.ps1'
      - 'Data/WarehouseAmbientCGTrilogyBatchV2.json'
      - 'Scripts/audit_warehouse_inventory.ps1'
      - 'Scripts/warehouse_network.ps1'
      - 'Data/WarehouseProviderAccessPolicyV1.json'
      - 'Data/WarehouseSaturationTrainV1.json'
      - 'Scripts/run_warehouse_saturation_train.ps1'
      - 'Data/WarehouseCriticalGapPreparationTrainV2.json'
      - 'Scripts/run_warehouse_critical_gap_preparation.ps1'
      - 'Data/WarehouseProviderResolutionTrainV3.json'
      - 'Scripts/run_warehouse_provider_resolution.ps1'
      - 'Data/WarehouseP1C01MegaPromotionTrainV1.json'
      - 'Scripts/run_warehouse_p1c01_mega_promotion.ps1'
      - 'Data/P1C01MaterialImportWaveV1.json'
      - 'Scripts/prepare_p1c01_material_intake.ps1'
      - 'Scripts/export_p1c01_material_source_branch.ps1'
      - 'Data/P1C01MegaChapterPackV1.json'
      - 'Scripts/run_p1c01_mega_chapter_pack.ps1'
      - 'Scripts/classify_warehouse_validation.ps1'
      - '.github/workflows/warehouse-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warehouse-stage-${{ github.repository }}
  cancel-in-progress: true

jobs:
  stage:
    name: Stage production warehouse batch
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout exact warehouse head into isolated temp source
        timeout-minutes: 5
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GITEXE="
          for /f "delims=" %%G in ('where git.exe 2^>nul') do if not defined GITEXE set "GITEXE=%%G"
          if not defined GITEXE if exist "C:\Program Files\Git\cmd\git.exe" set "GITEXE=C:\Program Files\Git\cmd\git.exe"
          if not defined GITEXE if exist "C:\Program Files (x86)\Git\cmd\git.exe" set "GITEXE=C:\Program Files (x86)\Git\cmd\git.exe"
          if not defined GITEXE exit /b 22

          set "WAREHOUSE_SRC=%RUNNER_TEMP%\shire-warehouse-src-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%"
          if exist "!WAREHOUSE_SRC!" rmdir /S /Q "!WAREHOUSE_SRC!"
          mkdir "!WAREHOUSE_SRC!"
          cd /d "!WAREHOUSE_SRC!"

          "!GITEXE!" init
          if errorlevel 1 exit /b 70
          "!GITEXE!" remote add origin "https://x-access-token:!GH_TOKEN!@github.com/%GITHUB_REPOSITORY%.git"
          if errorlevel 1 exit /b 71

          set ATTEMPT=0
          :fetch
          set /a ATTEMPT+=1
          echo Fetching exact warehouse head attempt !ATTEMPT! of 3...
          "!GITEXE!" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch --no-tags --prune --depth=2 origin !TARGET_SHA!
          if not errorlevel 1 goto fetched
          if !ATTEMPT! GEQ 3 exit /b 72
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 3"
          goto fetch

          :fetched
          "!GITEXE!" checkout -f FETCH_HEAD
          if errorlevel 1 exit /b 73
          "!GITEXE!" reset --hard !TARGET_SHA!
          if errorlevel 1 exit /b 73
          for /f "delims=" %%H in ('"!GITEXE!" rev-parse HEAD') do set "CHECKED_SHA=%%H"
          if /I not "!CHECKED_SHA!"=="!TARGET_SHA!" exit /b 74
          if not exist "ShireJourney.uproject" exit /b 75
          echo SHIRE_WAREHOUSE_SOURCE=!WAREHOUSE_SRC!>>"%GITHUB_ENV%"
          echo P1C01_HERO_RIG_REPORT=%RUNNER_TEMP%\shire-p1c01-hero-rig-report-%GITHUB_RUN_ID%-%GITHUB_RUN_ATTEMPT%>>"%GITHUB_ENV%"
          echo WAREHOUSE_CHECKOUT_PASS sha=!CHECKED_SHA! isolated=true source=!WAREHOUSE_SRC!

      - name: Verify runner session health
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\verify_runner_session.ps1"

      - name: Classify warehouse delta
        shell: cmd
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\classify_warehouse_validation.ps1"

      - name: Stage Poly Haven CC0 batch
        if: env.WH_STAGE_POLYHAVEN == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_polyhaven_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseAcquisitionBatchV1.json"

      - name: Stage OpenGameArt CC0 audio batch
        if: env.WH_STAGE_OGA == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_opengameart_audio.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseAudioAcquisitionBatchV1.json"

      - name: Stage Quaternius support batch
        if: env.WH_STAGE_QUATERNIUS == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_quaternius_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseQuaterniusAcquisitionBatchV1.json" -RecordManualQueue

      - name: Stage ambientCG material batch
        if: env.WH_STAGE_AMBIENTCG == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_ambientcg_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseAmbientCGAcquisitionBatchV1.json"

      - name: Stage ambientCG trilogy-region batch
        if: env.WH_STAGE_AMBIENTCG_TRILOGY == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_ambientcg_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseAmbientCGTrilogyBatchV2.json"

      - name: Stage Kenney support packs
        if: env.WH_STAGE_KENNEY == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_kenney_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseKenneyAcquisitionBatchV1.json"

      - name: Stage KayKit public GitHub support packs
        if: env.WH_STAGE_KAYKIT == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_kaykit_github_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseKayKitGitHubAcquisitionBatchV1.json"

      - name: Prepare P1C01 character archive intake
        if: env.WH_RUN_CHARACTER_INTAKE == 'true' && env.WH_RUN_P1C01_CHAPTER_PACK != 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\prepare_p1c01_character_rig_intake.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01CharacterRigAnimationPrepV1.json" -OutputRoot "D:\actions-runner\_warehouse\ShireJourney\_p1c01_character_intake"

      - name: Repair candidate-gate material warehouse provenance
        if: github.event_name == 'push'
        timeout-minutes: 20
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_polyhaven_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseAcquisitionBatchV1.json"
          if errorlevel 1 exit /b 81
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_ambientcg_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseAmbientCGTrilogyBatchV2.json"
          if errorlevel 1 exit /b 82

      - name: Audit persistent warehouse inventory
        if: env.WH_RUN_AUDIT == 'true' && env.WH_RUN_P1C01_CHAPTER_PACK != 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\audit_warehouse_inventory.ps1"

      - name: Build 20-car warehouse saturation coverage report
        if: env.WH_RUN_SATURATION == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\run_warehouse_saturation_train.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseSaturationTrainV1.json"

      - name: Prepare critical warehouse gaps into intake QC
        if: env.WH_RUN_PREP == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\run_warehouse_critical_gap_preparation.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseCriticalGapPreparationTrainV2.json"

      - name: Resolve provider access and safe fallback lanes
        if: env.WH_RUN_PROVIDER_RESOLUTION == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\run_warehouse_provider_resolution.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseProviderResolutionTrainV3.json"

      - name: Prepare P1C01 mega promotion batch from staged warehouse
        if: env.WH_RUN_P1C01_PROMOTION == 'true' && env.WH_RUN_P1C01_CHAPTER_PACK != 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\run_warehouse_p1c01_mega_promotion.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseP1C01MegaPromotionTrainV1.json"

      - name: Promote large P1C01 material source batch to generated branch
        if: env.WH_RUN_P1C01_MATERIAL_EXPORT == 'true' && env.WH_RUN_P1C01_CHAPTER_PACK != 'true'
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\export_p1c01_material_source_branch.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01MaterialImportWaveV1.json" -GeneratedBranch "generated/p1c01-material-source-v1"
          if errorlevel 1 exit /b 83
          if not exist "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_quaternius_warehouse.ps1" exit /b 84
          echo WAREHOUSE_SOURCE_CHECKOUT_SURVIVAL_PASS root=%SHIRE_WAREHOUSE_SOURCE%

      - name: Run P1C01 Mega Chapter Pack
        if: env.WH_RUN_P1C01_CHAPTER_PACK == 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\run_p1c01_mega_chapter_pack.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01MegaChapterPackV1.json"

      - name: Stage P1C01 hero candidate provider batch
        if: github.event_name == 'push'
        timeout-minutes: 20
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_quaternius_warehouse.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\WarehouseQuaterniusHeroCandidateBatchV1.json" -RecordManualQueue

      - name: Stage OpenGameArt Quaternius character candidate
        if: github.event_name == 'push'
        timeout-minutes: 20
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_opengameart_character_candidate.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01OpenGameArtHeroCandidateBatchV1.json"
      - name: Stage alternate OpenGameArt RPG hero candidate
        if: github.event_name == 'push'
        timeout-minutes: 20
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_opengameart_character_candidate.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01OpenGameArtRpgHeroCandidateBatchV1.json"

      - name: Stage KayKit Adventurers alternate hero candidate
        if: github.event_name == 'push'
        timeout-minutes: 20
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_opengameart_character_candidate.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01KayKitAdventurersHeroCandidateBatchV1.json"

      - name: Stage KayKit RogueHooded alternate hero candidate
        if: github.event_name == 'push'
        timeout-minutes: 20
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\stage_opengameart_character_candidate.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01KayKitAdventurersRogueHoodedHeroCandidateBatchV1.json"

      - name: Build exact-head P1C01 Frodo Gandalf candidate report
        if: github.event_name == 'push'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\run_p1c01_hero_skeletal_candidate_wave.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01HeroSkeletalCandidateWaveV1.json" -OutputRoot "%P1C01_HERO_RIG_REPORT%"

      - name: Inspect Frodo FBX static structure
        if: github.event_name == 'push'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%SHIRE_WAREHOUSE_SOURCE%\Scripts\inspect_p1c01_frodo_fbx_candidate.ps1" -ManifestPath "%SHIRE_WAREHOUSE_SOURCE%\Data\P1C01HeroSkeletalCandidateWaveV1.json" -CandidateReport "%P1C01_HERO_RIG_REPORT%\p1c01_hero_skeletal_candidate_summary.json" -OutputRoot "%P1C01_HERO_RIG_REPORT%"

      - name: Upload exact-head P1C01 hero candidate evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-hero-skeletal-candidate-${{ env.TARGET_SHA }}
          path: |
            ${{ env.P1C01_HERO_RIG_REPORT }}\p1c01_hero_skeletal_candidate_summary.json
            ${{ env.P1C01_HERO_RIG_REPORT }}\p1c01_frodo_fbx_static_qc.json
            ${{ env.P1C01_HERO_RIG_REPORT }}\intake\p1c01_character_rig_intake_receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize selective warehouse execution
        shell: cmd
        run: 'echo WAREHOUSE_SELECTIVE_EXECUTION_PASS head=%TARGET_SHA% base=%BASE_SHA%'

      - name: Show persistent warehouse footprint
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command
          "$root='D:\actions-runner\_warehouse\ShireJourney';
          if (!(Test-Path -LiteralPath $root -PathType Container)) { throw 'Persistent warehouse root missing: ' + $root };
          $files=Get-ChildItem -LiteralPath $root -Recurse -File;
          $bytes=($files | Measure-Object -Property Length -Sum).Sum;
          Write-Host ('WAREHOUSE_FOOTPRINT files=' + $files.Count + ' bytes=' + $bytes + ' root=' + $root)"

      - name: Remove isolated warehouse source checkout
        if: always()
        shell: cmd
        run: |
          @echo off
          if defined SHIRE_WAREHOUSE_SOURCE if exist "%SHIRE_WAREHOUSE_SOURCE%" rmdir /S /Q "%SHIRE_WAREHOUSE_SOURCE%"
          exit /b 0

