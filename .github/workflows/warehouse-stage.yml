name: Warehouse Stage

on:
  push:
    branches:
      - develop
    paths:
      - 'Data/WarehouseAcquisitionBatchV1.json'
      - 'Scripts/stage_polyhaven_warehouse.ps1'
      - 'Data/WarehouseAudioAcquisitionBatchV1.json'
      - 'Scripts/stage_opengameart_audio.ps1'
      - 'Data/WarehouseQuaterniusAcquisitionBatchV1.json'
      - 'Scripts/stage_quaternius_warehouse.ps1'
      - 'Data/WarehouseAmbientCGAcquisitionBatchV1.json'
      - 'Scripts/stage_ambientcg_warehouse.ps1'
      - 'Data/WarehouseKenneyAcquisitionBatchV1.json'
      - 'Scripts/stage_kenney_warehouse.ps1'
      - 'Data/WarehouseKayKitGitHubAcquisitionBatchV1.json'
      - 'Scripts/stage_kaykit_github_warehouse.ps1'
      - 'Data/WarehouseAmbientCGTrilogyBatchV2.json'
      - 'Scripts/audit_warehouse_inventory.ps1'
      - 'Scripts/warehouse_network.ps1'
      - 'Data/WarehouseProviderAccessPolicyV1.json'
      - '.github/workflows/warehouse-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-stage-${{ github.repository }}
  cancel-in-progress: true

jobs:
  stage:
    name: Stage production warehouse batch
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact warehouse head
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GITEXE="
          for /f "delims=" %%G in ('where git.exe 2^>nul') do if not defined GITEXE set "GITEXE=%%G"
          if not defined GITEXE if exist "C:\Program Files\Git\cmd\git.exe" set "GITEXE=C:\Program Files\Git\cmd\git.exe"
          if not defined GITEXE if exist "C:\Program Files (x86)\Git\cmd\git.exe" set "GITEXE=C:\Program Files (x86)\Git\cmd\git.exe"
          if not defined GITEXE exit /b 22

          if exist ".git" rmdir /S /Q ".git"
          "!GITEXE!" init
          if errorlevel 1 exit /b 70
          "!GITEXE!" remote add origin "https://x-access-token:!GH_TOKEN!@github.com/%GITHUB_REPOSITORY%.git"
          if errorlevel 1 exit /b 71

          set ATTEMPT=0
          :fetch
          set /a ATTEMPT+=1
          echo Fetching exact warehouse head attempt !ATTEMPT! of 7...
          "!GITEXE!" fetch --no-tags --prune --depth=2 origin !TARGET_SHA!
          if not errorlevel 1 goto fetched
          if !ATTEMPT! GEQ 7 exit /b 72
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 5"
          goto fetch

          :fetched
          "!GITEXE!" checkout -f FETCH_HEAD
          if errorlevel 1 exit /b 73
          "!GITEXE!" reset --hard !TARGET_SHA!
          if errorlevel 1 exit /b 73
          for /f "delims=" %%H in ('"!GITEXE!" rev-parse HEAD') do set "CHECKED_SHA=%%H"
          if /I not "!CHECKED_SHA!"=="!TARGET_SHA!" exit /b 74
          if not exist "ShireJourney.uproject" exit /b 75
          echo WAREHOUSE_CHECKOUT_PASS sha=!CHECKED_SHA!

      - name: Verify runner session health
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\verify_runner_session.ps1"

      - name: Stage Poly Haven CC0 batch
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_polyhaven_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseAcquisitionBatchV1.json"

      - name: Stage OpenGameArt CC0 audio batch
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_opengameart_audio.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseAudioAcquisitionBatchV1.json"

      - name: Stage Quaternius support batch
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_quaternius_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseQuaterniusAcquisitionBatchV1.json"

      - name: Stage ambientCG material batch
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_ambientcg_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseAmbientCGAcquisitionBatchV1.json"

      - name: Stage ambientCG trilogy-region batch
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_ambientcg_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseAmbientCGTrilogyBatchV2.json"

      - name: Stage Kenney support packs
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_kenney_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseKenneyAcquisitionBatchV1.json"

      - name: Stage KayKit public GitHub support packs
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\stage_kaykit_github_warehouse.ps1" -ManifestPath "%GITHUB_WORKSPACE%\Data\WarehouseKayKitGitHubAcquisitionBatchV1.json"

      - name: Audit persistent warehouse inventory
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\audit_warehouse_inventory.ps1"

      - name: Show persistent warehouse footprint
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command
          "$root='C:\actions-runner\_warehouse\ShireJourney';
          if (!(Test-Path -LiteralPath $root -PathType Container)) { throw 'Persistent warehouse root missing: ' + $root };
          $files=Get-ChildItem -LiteralPath $root -Recurse -File;
          $bytes=($files | Measure-Object -Property Length -Sum).Sum;
          Write-Host ('WAREHOUSE_FOOTPRINT files=' + $files.Count + ' bytes=' + $bytes + ' root=' + $root)"
