name: Drive Warehouse Auto Intake
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - 'Scripts/drive_warehouse_sync.py'
      - 'Scripts/test_drive_warehouse_sync.py'
      - 'Scripts/validate_drive_source_bundles.py'
      - 'Scripts/verify_drive_warehouse_receipts.py'
      - 'Scripts/test_verify_drive_warehouse_receipts.py'
      - 'Scripts/curate_p1c01_drive_source.py'
      - 'Scripts/test_curate_p1c01_drive_source.py'
      - 'Scripts/stage_p1c01_curated_original.py'
      - 'Scripts/test_stage_p1c01_curated_original.py'
      - 'Scripts/test_validate_drive_source_bundles.py'
      - '.github/workflows/drive-warehouse-auto-intake.yml'
permissions:
  contents: read
concurrency:
  group: warehouse-stage-${{ github.repository }}
  cancel-in-progress: false
jobs:
  static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Scripts -p "test_drive_warehouse_sync.py" -v
      - run: python -m py_compile Scripts/drive_warehouse_sync.py Scripts/validate_drive_source_bundles.py
      - run: python -m unittest discover -s Scripts -p "test_validate_drive_source_bundles.py" -v
      - run: python -m unittest discover -s Scripts -p "test_verify_drive_warehouse_receipts.py" -v
      - run: python -m py_compile Scripts/verify_drive_warehouse_receipts.py
      - run: python -m unittest discover -s Scripts -p "test_curate_p1c01_drive_source.py" -v
      - run: python -m py_compile Scripts/curate_p1c01_drive_source.py
      - run: python -m unittest discover -s Scripts -p "test_stage_p1c01_curated_original.py" -v
      - run: python -m py_compile Scripts/stage_p1c01_curated_original.py
  transfer:
    if: github.event_name != 'pull_request'
    needs: static
    runs-on: [self-hosted, Windows, X64, ue4-27]
    timeout-minutes: 50
    steps:
      - name: Isolated control checkout and drive intake
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Join-Path $env:RUNNER_TEMP ('shire-drive-' + $env:GITHUB_RUN_ID)
          $config = Join-Path $env:APPDATA 'rclone\rclone.conf'
          if (!(Test-Path $config)) { throw 'DRIVE_AUTH_MISSING configure rclone once for watchdog user' }
          if (!(Test-Path 'D:\actions-runner\_warehouse\ShireJourney')) { throw 'WAREHOUSE_MISSING' }
          # Watchdog interactive session can retain PATH from before package setup.
          # Refresh trusted Windows machine/user PATH without modifying installed binaries.
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = @($machinePath, $userPath, $env:Path) -join ';'
          $rclone = Get-Command rclone.exe -ErrorAction SilentlyContinue
          if (!$rclone) { throw 'RCLONE_MISSING_AFTER_PATH_REFRESH' }
          $python = Get-Command python.exe -ErrorAction SilentlyContinue
          $pyLauncher = Get-Command py.exe -ErrorAction SilentlyContinue
          $pythonExe = if ($python -and $python.Source -notlike '*WindowsApps*') { $python.Source } elseif ($pyLauncher) { $null } else { throw 'PYTHON_MISSING_AFTER_PATH_REFRESH' }
          Write-Host "DRIVE_TOOLCHAIN_RESOLVED rclone=$($rclone.Source) python=$([bool]$pythonExe) pyLauncher=$([bool]$pyLauncher)"
          try {
            New-Item $p -ItemType Directory -Force | Out-Null
            git -C $p init -q
            git -C $p remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
            git -C $p fetch --depth=1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'CONTROL_FETCH_FAILED' }
            git -C $p remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY.git"
            git -C $p checkout -q --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0 -or (git -C $p rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'CONTROL_SHA_MISMATCH' }
            & (Join-Path $p 'Scripts\verify_runner_session.ps1')
            if ($LASTEXITCODE -ne 0) { throw 'DRIVE_RUNNER_SESSION_UNHEALTHY' }
            if ($pythonExe) {
            & $pythonExe (Join-Path $p 'Scripts\drive_warehouse_sync.py') --mode ingest --rclone-config $config --rclone-bin $rclone.Source
          } else {
            & $pyLauncher.Source -3.12 (Join-Path $p 'Scripts\drive_warehouse_sync.py') --mode ingest --rclone-config $config --rclone-bin $rclone.Source
          }
            if ($LASTEXITCODE -ne 0) { throw 'DRIVE_INGEST_FAILED' }
            # Read-only physical D: audit after ingest; never calls UE or approves licenses.
            $audit = Join-Path $p 'Scripts\verify_drive_warehouse_receipts.py'
            $auditReport = 'D:\actions-runner\_warehouse\ShireJourney\_drive_temp_staging\reports\source_qc_latest.json'
            if ($pythonExe) {
              & $pythonExe $audit --warehouse-root 'D:\actions-runner\_warehouse\ShireJourney' --out $auditReport
            } else {
              & $pyLauncher.Source -3.12 $audit --warehouse-root 'D:\actions-runner\_warehouse\ShireJourney' --out $auditReport
            }
            if ($LASTEXITCODE -ne 0) { throw 'DRIVE_PHYSICAL_QC_FAILED' }
            # Only after the ten physical SHA/MD5 source receipts pass, curate existing bytes.
            # No UE4 import, license approval, remote deletion, or chapter promotion.
            $curator = Join-Path $p 'Scripts\curate_p1c01_drive_source.py'
            if ($pythonExe) {
              & $pythonExe $curator --warehouse-root 'D:\actions-runner\_warehouse\ShireJourney'
            } else {
              & $pyLauncher.Source -3.12 $curator --warehouse-root 'D:\actions-runner\_warehouse\ShireJourney'
            }
            if ($LASTEXITCODE -ne 0) { throw 'DRIVE_CURATED_SOURCE_PRODUCTION_FAILED' }
            # Original-project asset stage only. Preserve the single persistent
            # source writer; no editor invocation or runtime acceptance here.
            $curatedSource = 'D:\actions-runner\_warehouse\ShireJourney\_drive_temp_staging\curated_p1c01\SHIRE_P1C01_CURATED_SOURCE_20261012.zip'
            $originalStage = 'D:\actions-runner\_warehouse\ShireJourney\_drive_temp_staging\curated_ue4_original'
            $stageTool = Join-Path $p 'Scripts\stage_p1c01_curated_original.py'
            if ($pythonExe) {
              & $pythonExe $stageTool --archive $curatedSource --workspace $originalStage
            } else {
              & $pyLauncher.Source -3.12 $stageTool --archive $curatedSource --workspace $originalStage
            }
            if ($LASTEXITCODE -ne 0) { throw 'P1C01_CURATED_ORIGINAL_STAGE_FAILED' }

            # Only verified staging is unattended. Remote deletion requires separately
            # established import acceptance and independent backup evidence.
            # No automatic cleanup is invoked by this scheduled writer.
          } finally {
            if (Test-Path $p) {
              git -C $p remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY.git" 2>$null
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
