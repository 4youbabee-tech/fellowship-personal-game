name: P1C01 Offline Source Saturation

# Runner-outage/offline lane: manual only while active P1C01 UE4 execution is available.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: p1c01-offline-saturation-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python Scripts/audit_p1c01_offline_saturation.py
