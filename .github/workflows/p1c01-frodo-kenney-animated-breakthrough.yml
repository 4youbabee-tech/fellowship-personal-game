name: P1C01 Frodo Kenney Animated Human Breakthrough

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Data/P1C01OpenGameArtKenneyAnimatedHeroCandidateBatchV1.json'
      - 'Data/P1C01FrodoTechnicalRejectionHistoryV1.json'
      - 'Data/P1C01CharacterRigAnimationPrepV1.json'
      - 'Data/P1C01HeroSkeletalCandidateWaveV1.json'
      - 'Scripts/stage_p1c01_frodo_kenney_animated_probe.ps1'
      - 'Scripts/stage_opengameart_character_candidate.ps1'
      - 'Scripts/ci_import_production_assets.cmd'
      - 'Source/ShireJourneyEditorTools/Private/ShireProductionImportCommandlet.cpp'
      - '.github/workflows/p1c01-frodo-kenney-animated-breakthrough.yml'

permissions:
  contents: read

concurrency:
  group: p1c01-frodo-kenney-animated-breakthrough
  cancel-in-progress: true

jobs:
  hosted_static_inventory:
    name: Hosted static FBX inventory
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact checkout
        shell: cmd
        run: |
          @echo off
          for /f "delims=" %%H in ('git rev-parse HEAD') do set "CHECKED_SHA=%%H"
          if /I not "%TARGET_SHA%"=="%CHECKED_SHA%" exit /b 71

      - name: Inventory and select exact Kenney animated FBX
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\stage_p1c01_frodo_kenney_animated_probe.ps1" -ManifestPath "$env:GITHUB_WORKSPACE\Data\P1C01OpenGameArtKenneyAnimatedHeroCandidateBatchV1.json" -RejectionHistoryPath "$env:GITHUB_WORKSPACE\Data\P1C01FrodoTechnicalRejectionHistoryV1.json" -OutputRoot "$env:RUNNER_TEMP\shire-frodo-kenney-static"

      - name: Upload static inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-frodo-kenney-static-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}\shire-frodo-kenney-static\p1c01_frodo_kenney_animated_inventory.json
          if-no-files-found: error
          retention-days: 14

  ue4_technical_probe:
    name: UE4.27.2 skeletal technical probe
    needs: hosted_static_inventory
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact checkout and runner
        shell: cmd
        run: |
          @echo off
          for /f "delims=" %%H in ('git rev-parse HEAD') do set "CHECKED_SHA=%%H"
          if /I not "%TARGET_SHA%"=="%CHECKED_SHA%" exit /b 71
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\verify_runner_session.ps1"

      - name: Stage selected exact FBX for UE4
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\stage_p1c01_frodo_kenney_animated_probe.ps1" -ManifestPath "$env:GITHUB_WORKSPACE\Data\P1C01OpenGameArtKenneyAnimatedHeroCandidateBatchV1.json" -RejectionHistoryPath "$env:GITHUB_WORKSPACE\Data\P1C01FrodoTechnicalRejectionHistoryV1.json" -OutputRoot "$env:RUNNER_TEMP\shire-frodo-kenney-ue4" -StageForUnreal

      - name: Build ShireJourneyEditor
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Scripts\ci_build_unreal.cmd"'

      - name: Import selected Frodo skeletal mesh
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Scripts\ci_import_production_assets.cmd" -EnableCharacterRigImport'

      - name: Verify strict Frodo skeletal technical gate
        shell: powershell
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "Saved\Logs\CI-ProductionAssetImport.log"
          $inventory = Join-Path $env:RUNNER_TEMP "shire-frodo-kenney-ue4\p1c01_frodo_kenney_animated_inventory.json"
          if(-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw "FRODO_KENNEY_UE4_LOG_MISSING" }
          if(-not (Test-Path -LiteralPath $inventory -PathType Leaf)) { throw "FRODO_KENNEY_UE4_INVENTORY_MISSING" }
          $selected = (Get-Content -LiteralPath $inventory -Raw | ConvertFrom-Json).selected
          $lines = @(Get-Content -LiteralPath $log)
          $begin = -1
          $result = -1
          for($i=0; $i -lt $lines.Count; $i++) {
            if($lines[$i].Contains("ShireProductionImport: skeletal FBX import") -and $lines[$i].Contains("/Characters/Rigs/FRODO/SK_FRODO.fbx")) { $begin = $i }
            if($begin -ge 0 -and $lines[$i].Contains("ShireProductionImport result:") -and $lines[$i].Contains("/Characters/Rigs/FRODO/SK_FRODO.fbx |")) { $result = $i; break }
          }
          if($begin -lt 0 -or $result -lt 0) { throw "FRODO_KENNEY_UE4_IMPORT_MARKERS_MISSING" }
          $resultLine = [string]$lines[$result]
          if(-not $resultLine.Contains("skeletal-registered=yes")) { throw "FRODO_KENNEY_UE4_SKELETAL_REGISTER_FAIL line=$resultLine" }
          $match = [regex]::Match($resultLine, 'skeletal-bones=(\d+)')
          if(-not $match.Success -or [int]$match.Groups[1].Value -le 0) { throw "FRODO_KENNEY_UE4_BONE_COUNT_FAIL line=$resultLine" }
          $bones = [int]$match.Groups[1].Value
          $segment = ($lines[$begin..$result] -join "`n")
          $reasons = @()
          if($segment -match "No smoothing group information was found") { $reasons += "MISSING_SMOOTHING_GROUPS" }
          if($segment -match "missing from the bind pose") { $reasons += "MISSING_BIND_POSE_BONES" }
          if($segment -match "has no UV set") { $reasons += "MISSING_UV_SET" }
          if($reasons.Count -gt 0) { throw ("FRODO_KENNEY_TECHNICAL_REJECT entry="+$selected.entry+" sha256="+$selected.sha256+" bones="+$bones+" reasons="+($reasons -join ",")) }
          $skeletalAsset = Join-Path $env:GITHUB_WORKSPACE "Content\Production\Characters\Rigs\FRODO\SK_FRODO.uasset"
          $skeletonAsset = Join-Path $env:GITHUB_WORKSPACE "Content\Production\Characters\Rigs\FRODO\SK_FRODO_Skeleton.uasset"
          if(-not (Test-Path -LiteralPath $skeletalAsset -PathType Leaf)) { throw "FRODO_KENNEY_UE4_ASSET_MISSING" }
          if(-not (Test-Path -LiteralPath $skeletonAsset -PathType Leaf)) { throw "FRODO_KENNEY_UE4_SKELETON_ASSET_MISSING" }
          Write-Host ("FRODO_KENNEY_TECHNICAL_PASS entry="+$selected.entry+" sha256="+$selected.sha256+" bones="+$bones+" runtimeIntegration=false deformationGate=next")

      - name: Upload technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-frodo-kenney-ue4-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}\shire-frodo-kenney-ue4\p1c01_frodo_kenney_animated_inventory.json
            ${{ github.workspace }}\Saved\Logs\CI-ProductionAssetImport.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup transient Frodo probe assets
        if: always()
        shell: powershell
        run: |
          foreach($relative in @(
            "SourceAssets/Production/Characters/Rigs/FRODO/SK_FRODO.fbx",
            "Content/Production/Characters/Rigs/FRODO/SK_FRODO.uasset",
            "Content/Production/Characters/Rigs/FRODO/SK_FRODO_Skeleton.uasset",
            "Content/Production/Characters/Rigs/FRODO/SK_FRODO_PhysicsAsset.uasset"
          )) {
            $tracked = @(& git.exe -C $env:GITHUB_WORKSPACE ls-files -- $relative 2>$null)
            if($LASTEXITCODE -ne 0) { throw "FRODO_KENNEY_CLEANUP_GIT_FAIL path=$relative" }
            if($tracked.Count -eq 0) { Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $relative) -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "FRODO_KENNEY_CLEANUP_PASS"
