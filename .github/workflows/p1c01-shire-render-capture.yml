name: P1C01 Shire Render Capture

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - "Scripts/ci_capture_p1c01_visuals.cmd"
      - "Scripts/ci_import_production_assets.cmd"
      - ".github/workflows/p1c01-shire-render-capture.yml"
      - "Source/**"
      - "Config/**"
      - "SourceAssets/Production/**"
      - "ShireJourney.uproject"
  push:
    branches:
      - production/p1c01-definitive-chapter-closeout-2026-10-04
    paths:
      - "Scripts/ci_capture_p1c01_visuals.cmd"
      - "Scripts/ci_import_production_assets.cmd"
      - ".github/workflows/p1c01-shire-render-capture.yml"
      - "Source/**"
      - "Config/**"
      - "SourceAssets/Production/**"
      - "ShireJourney.uproject"

concurrency:
  group: p1c01-shire-render-capture
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  classify:
    name: Hosted visual-delta classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
    outputs:
      capture: ${{ steps.classify.outputs.capture }}
      reason: ${{ steps.classify.outputs.reason }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - name: Checkout exact candidate for visual classification
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify current delta
        id: classify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          & "$env:GITHUB_WORKSPACE/Scripts/classify_p1c01_render_capture.ps1"

  inherit:
    name: Inherit unchanged visual-tree evidence
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' && needs.classify.outputs.capture != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record inherited evidence boundary
        run: echo "P1C01_RENDER_INHERITED base=${{ needs.classify.outputs.base_sha }} head=${{ github.event.pull_request.head.sha || github.sha }} reason=${{ needs.classify.outputs.reason }}; no fresh render and no visual acceptance claimed."

  capture:
    needs: classify
    if: ${{ always() && (needs.classify.result == 'failure' || needs.classify.outputs.capture == 'true') }}
    name: UE4.27.2 rendered evidence
    runs-on:
      - self-hosted
      - Windows
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
    steps:
      - name: Accept hosted render decision
        if: needs.classify.result == 'success'
        shell: powershell
        run: |
          "SHIRE_RENDER_CAPTURE=${{ needs.classify.outputs.capture }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHIRE_RENDER_REASON=${{ needs.classify.outputs.reason }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHIRE_RENDER_BASE=${{ needs.classify.outputs.base_sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "P1C01_RENDER_HOSTED_DECISION capture=${{ needs.classify.outputs.capture }} reason=${{ needs.classify.outputs.reason }}"

      - name: Reclassify visual delta on self-hosted fallback
        if: needs.classify.result == 'failure'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:GIT_LFS_SKIP_SMUDGE = "1"
          $root = Join-Path $env:RUNNER_TEMP ("shire-render-classifier-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Push-Location $root
          try {
            git init | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "P1C01_RENDER_FALLBACK_GIT_INIT_FAIL" }

            git remote add origin ("https://x-access-token:" + $env:GH_TOKEN + "@github.com/" + $env:GITHUB_REPOSITORY + ".git")
            if ($LASTEXITCODE -ne 0) { throw "P1C01_RENDER_FALLBACK_REMOTE_FAIL" }

            git -c credential.helper= -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch --no-tags --depth=32 origin $env:TARGET_SHA
            if ($LASTEXITCODE -ne 0) { throw "P1C01_RENDER_FALLBACK_HEAD_FETCH_FAIL" }

            if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
              git -c credential.helper= -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch --no-tags --depth=1 origin $env:BASE_SHA
              if ($LASTEXITCODE -ne 0) { throw "P1C01_RENDER_FALLBACK_BASE_FETCH_FAIL" }
            }

            $scriptPath = Join-Path $root "classify_p1c01_render_capture.ps1"
            $targetSpec = $env:TARGET_SHA + ":Scripts/classify_p1c01_render_capture.ps1"
            $scriptText = @(git show $targetSpec)
            if ($LASTEXITCODE -ne 0 -or $scriptText.Count -eq 0) { throw "P1C01_RENDER_FALLBACK_SCRIPT_EXTRACT_FAIL" }
            $scriptText | Set-Content -LiteralPath $scriptPath -Encoding UTF8

            & $scriptPath
            if ($LASTEXITCODE -ne 0) { throw "P1C01_RENDER_FALLBACK_CLASSIFIER_FAIL exit=$LASTEXITCODE" }

            $output = @(Get-Content -LiteralPath $env:GITHUB_OUTPUT)
            $capture = [string](($output | Where-Object { $_ -like "capture=*" } | Select-Object -Last 1) -replace "^capture=","")
            $reason = [string](($output | Where-Object { $_ -like "reason=*" } | Select-Object -Last 1) -replace "^reason=","")
            $baseSha = [string](($output | Where-Object { $_ -like "base_sha=*" } | Select-Object -Last 1) -replace "^base_sha=","")
            if ($capture -notin @("true","false")) { throw "P1C01_RENDER_FALLBACK_DECISION_INVALID capture=$capture" }

            "SHIRE_RENDER_CAPTURE=$capture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "SHIRE_RENDER_REASON=$reason" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "SHIRE_RENDER_BASE=$baseSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "P1C01_RENDER_FALLBACK_DECISION capture=$capture reason=$reason base=$baseSha"
          }
          finally {
            Pop-Location
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Record fallback inherited evidence boundary
        if: env.SHIRE_RENDER_CAPTURE == 'false'
        shell: powershell
        run: |
          Write-Host "P1C01_RENDER_FALLBACK_INHERITED base=$env:SHIRE_RENDER_BASE head=$env:TARGET_SHA reason=$env:SHIRE_RENDER_REASON; no fresh render and no visual acceptance claimed."

      - name: Checkout exact PR head
        if: env.SHIRE_RENDER_CAPTURE == 'true'
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Hydrate P1C01 material LFS sources
        if: env.SHIRE_RENDER_CAPTURE == 'true'
        shell: powershell
        run: '& "$env:GITHUB_WORKSPACE\Scripts\hydrate_p1c01_material_lfs.ps1"'

      - name: Verify exact checkout
        if: env.SHIRE_RENDER_CAPTURE == 'true'
        shell: powershell
        run: |
          $expected = "$env:TARGET_SHA"
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "P1C01_CAPTURE_EXACT_HEAD expected=$expected actual=$actual"
          if ($actual -ne $expected) { throw "Exact-head checkout mismatch" }
          git status --short

      - name: Build ShireJourneyEditor for capture
        if: env.SHIRE_RENDER_CAPTURE == 'true'
        shell: cmd
        run: |
          call Scripts\ci_build_unreal.cmd
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Capture P1C01 production Shire
        if: env.SHIRE_RENDER_CAPTURE == 'true'
        shell: cmd
        run: Scripts\ci_capture_p1c01_visuals.cmd

      - name: Upload rendered evidence
        if: always() && env.SHIRE_RENDER_CAPTURE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-shire-render-capture-${{ env.TARGET_SHA }}
          path: |
            Saved/Automation/P1C01VisualCapture/**
          if-no-files-found: error
          retention-days: 14
