name: Actions artifact size inventory
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Largest artifacts by size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.size_in_bytes, .name, .created_at, .id] | @tsv' | sort -nr | head -40
