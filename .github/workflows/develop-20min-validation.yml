name: Develop 20-Min Validation

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  validate-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate develop project structure
        run: python Scripts/pre_unreal_validate.py
