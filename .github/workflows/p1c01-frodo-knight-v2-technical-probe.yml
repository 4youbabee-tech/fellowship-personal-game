name: P1C01 Frodo Knight V2 Technical Probe

on:
  pull_request:
    paths:
      - 'Data/P1C01FrodoKnightV2TechnicalProbe.json'
      - 'Data/P1C01KayKitAdventurersHeroCandidateBatchV2.json'
      - 'Scripts/stage_opengameart_character_candidate.ps1'
      - 'Scripts/ci_import_production_assets.cmd'
      - 'Source/ShireJourneyEditorTools/Private/ShireProductionImportCommandlet.cpp'
      - '.github/workflows/p1c01-frodo-knight-v2-technical-probe.yml'

permissions:
  contents: read

concurrency:
  group: p1c01-frodo-knight-v2-technical-probe
  cancel-in-progress: true

jobs:
  probe:
    name: UE4.27.2 Frodo Knight V2 probe
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact checkout and runner
        shell: cmd
        run: |
          @echo off
          for /f "delims=" %%H in ('git rev-parse HEAD') do set "CHECKED_SHA=%%H"
          if /I not "%TARGET_SHA%"=="%CHECKED_SHA%" exit /b 71
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\verify_runner_session.ps1"

      - name: Stage exact KayKit Knight V2 FBX
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\Scripts\stage_opengameart_character_candidate.ps1" -ManifestPath "$env:GITHUB_WORKSPACE\Data\P1C01KayKitAdventurersHeroCandidateBatchV2.json"
          $manifest = Get-Content "$env:GITHUB_WORKSPACE\Data\P1C01KayKitAdventurersHeroCandidateBatchV2.json" -Raw | ConvertFrom-Json
          $source = Join-Path "D:\actions-runner\_warehouse\ShireJourney\OpenGameArt\Characters" ([string]$manifest.assets[0].filename)
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "FRODO_KNIGHT_V2_WAREHOUSE_FBX_MISSING path=$source" }
          $dest = Join-Path $env:GITHUB_WORKSPACE "SourceAssets\Production\Characters\Rigs\FRODO\SK_FRODO.fbx"
          New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $dest -Force
          $sourceSha=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $destSha=(Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sourceSha -ne $destSha){ throw "FRODO_KNIGHT_V2_COPY_HASH_MISMATCH" }
          Write-Host "FRODO_KNIGHT_V2_STAGE_PASS sha256=$destSha bytes=$((Get-Item $dest).Length)"

      - name: Build ShireJourneyEditor
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Scripts\ci_build_unreal.cmd"'

      - name: Import Knight V2 as bounded Frodo skeletal technical probe
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Scripts\ci_import_production_assets.cmd" -EnableCharacterRigImport'

      - name: Verify Knight V2 technical import evidence
        shell: powershell
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "Saved\Logs\CI-ProductionAssetImport.log"
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw "FRODO_KNIGHT_V2_IMPORT_LOG_MISSING" }
          $lines=@(Get-Content -LiteralPath $log)
          $begin=-1; $result=-1
          for($i=0;$i -lt $lines.Count;$i++){
            if($lines[$i].Contains("ShireProductionImport: skeletal FBX import") -and $lines[$i].Contains("/Characters/Rigs/FRODO/SK_FRODO.fbx")){ $begin=$i }
            if($begin -ge 0 -and $lines[$i].Contains("ShireProductionImport result:") -and $lines[$i].Contains("/Characters/Rigs/FRODO/SK_FRODO.fbx |")){ $result=$i; break }
          }
          if($begin -lt 0 -or $result -lt 0){ throw "FRODO_KNIGHT_V2_IMPORT_MARKERS_MISSING" }
          $line=[string]$lines[$result]
          if(-not $line.Contains("skeletal-registered=yes")){ throw "FRODO_KNIGHT_V2_SKELETAL_REGISTER_FAIL line=$line" }
          $m=[regex]::Match($line,'skeletal-bones=(\d+)')
          if(-not $m.Success -or [int]$m.Groups[1].Value -le 0){ throw "FRODO_KNIGHT_V2_BONE_COUNT_FAIL line=$line" }
          $segment=($lines[$begin..$result] -join "`n")
          $reasons=@()
          if($segment -match "No smoothing group information was found"){ $reasons+="MISSING_SMOOTHING_GROUPS" }
          if($segment -match "missing from the bind pose"){ $reasons+="MISSING_BIND_POSE_BONES" }
          if($segment -match "has no UV set"){ $reasons+="MISSING_UV_SET" }
          if($reasons.Count -gt 0){ throw ("FRODO_KNIGHT_V2_TECHNICAL_REJECT bones="+$m.Groups[1].Value+" reasons="+($reasons -join ",")) }
          Write-Host ("FRODO_KNIGHT_V2_TECHNICAL_PASS bones="+$m.Groups[1].Value+" runtimeIntegration=false")

      - name: Upload technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-frodo-knight-v2-${{ env.TARGET_SHA }}
          path: |
            ${{ github.workspace }}\Saved\Logs\CI-ProductionAssetImport.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup transient rig probe
        if: always()
        shell: powershell
        run: |
          foreach($relative in @(
            "SourceAssets/Production/Characters/Rigs/FRODO/SK_FRODO.fbx",
            "Content/Production/Characters/Rigs/FRODO/SK_FRODO.uasset",
            "Content/Production/Characters/Rigs/FRODO/SK_FRODO_Skeleton.uasset"
          )){
            $tracked=@(& git.exe -C $env:GITHUB_WORKSPACE ls-files -- $relative 2>$null)
            if($LASTEXITCODE -ne 0){ throw "FRODO_KNIGHT_V2_CLEANUP_GIT_FAIL path=$relative" }
            if($tracked.Count -eq 0){ Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $relative) -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "FRODO_KNIGHT_V2_CLEANUP_PASS"
