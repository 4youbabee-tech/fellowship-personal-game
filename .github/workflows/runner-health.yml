name: Runner Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-health-${{ github.repository }}
  cancel-in-progress: true

jobs:
  health:
    name: Verify UE4 runner health
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner session health
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\verify_runner_session.ps1"
