name: Daily Project Manager Report

on:
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-project-manager-report.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-project-manager-report
  cancel-in-progress: true

jobs:
  report:
    name: Post Shire Journey manager report
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 10

    steps:
      - name: Checkout canonical develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 200

      - name: Verify runner and generator
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "DAILY_MANAGER_RUNNER_READY machine=$env:COMPUTERNAME run=$env:GITHUB_RUN_ID"
          if (-not (Test-Path -LiteralPath 'Scripts\generate_daily_project_manager_report.ps1' -PathType Leaf)) {
              throw 'DAILY_MANAGER_GENERATOR_MISSING_ON_DEVELOP'
          }

      - name: Generate project-manager report
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\Scripts\generate_daily_project_manager_report.ps1' -ProjectRoot $env:GITHUB_WORKSPACE -OutputPath 'daily_manager_report.md'
          if (-not (Test-Path -LiteralPath 'daily_manager_report.md' -PathType Leaf)) {
              throw 'DAILY_MANAGER_REPORT_OUTPUT_MISSING'
          }

      - name: Publish report to Actions summary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content -LiteralPath 'daily_manager_report.md' -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-project-manager-report
          path: daily_manager_report.md
          if-no-files-found: error
          retention-days: 30

      - name: Post to Project Manager issue
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '96'
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = Get-Content -LiteralPath 'daily_manager_report.md' -Raw
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $payload = @{ body = $body } | ConvertTo-Json -Depth 3
          $uri = "https://api.github.com/repos/$env:REPOSITORY/issues/$env:ISSUE_NUMBER/comments"
          $response = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body $payload
          if ($null -eq $response -or [string]::IsNullOrWhiteSpace([string]$response.html_url)) {
              throw 'DAILY_MANAGER_REPORT_ISSUE_POST_NO_URL'
          }
          Write-Host "DAILY_MANAGER_REPORT_ISSUE_POST_PASS url=$($response.html_url)"
