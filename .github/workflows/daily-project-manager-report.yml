name: Daily Project Manager Report

on:
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-project-manager-report.yml'

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Post Shire Journey manager report
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 5
    steps:
      - name: Checkout canonical develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 200

      - name: Generate project-manager report
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gov = Get-Content 'Data/ProjectGovernor.json' -Raw | ConvertFrom-Json
          $waves = Get-Content 'Data/CompletionWaveMapV1.json' -Raw | ConvertFrom-Json

          $current = $null
          if ($gov.daily_progress_reporting -and
              $gov.daily_progress_reporting.PSObject.Properties['current_planning_percent']) {
              $current = [int]$gov.daily_progress_reporting.current_planning_percent
          }
          if ($null -eq $current) {
              $current = [int]$waves.baseline.planning_completion_percent
              if ([string]$gov.w00_final_closure.status -like 'CLOSED*') {
                  $current = 42
              }
          }

          $previous = $current
          if ($gov.daily_progress_reporting -and
              $gov.daily_progress_reporting.PSObject.Properties['previous_planning_percent']) {
              $previous = [int]$gov.daily_progress_reporting.previous_planning_percent
          }

          $now = [DateTime]::UtcNow
          $since = $now.AddHours(-24).ToString('o')
          $head = (git rev-parse HEAD).Trim()
          $merges = @(git log "--since=$since" --merges --pretty=format:"%h %s" | Select-Object -First 8)
          $changes = @(git log "--since=$since" --no-merges --pretty=format:"%h %s" | Select-Object -First 12)

          $wave = $null
          foreach ($item in $waves.waves) {
              if ($current -ge [int]$item.from_percent -and $current -lt [int]$item.to_percent) {
                  $wave = $item
                  break
              }
          }

          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('# Shire Journey — Daily Project Manager Report')
          $report.Add('')
          $report.Add("- Generated UTC: $($now.ToString('yyyy-MM-dd HH:mm'))")
          $report.Add("- Develop head observed: `$head`")
          $report.Add("- Planning / production completion: **$current%**")
          $report.Add("- 24h planning delta: **$([string]::Format('{0:+0;-0;0}', $current - $previous)) percentage points**")
          $report.Add("- Active lane: **$($gov.current_focus.production_lane)**")
          $report.Add("- Active gate: **$($gov.active_gate.id)** — $($gov.active_gate.status)")
          if ($null -ne $wave) {
              $report.Add("- Current wave: **$($wave.id) — $($wave.name)**")
              $report.Add("- Wave range: $($wave.from_percent)% -> $($wave.to_percent)%")
          }

          $report.Add('')
          $report.Add('## Meaningful movement in the last 24 hours')
          foreach ($line in $merges) { if ($line) { $report.Add("- Merge: $line") } }
          foreach ($line in $changes) { if ($line) { $report.Add("- Change: $line") } }
          if ($merges.Count -eq 0 -and $changes.Count -eq 0) {
              $report.Add('- No repository commits recorded in the last 24 hours.')
          }

          if ($null -ne $wave) {
              $report.Add('')
              $report.Add('## Next percentage unlock')
              $exitPreview = @($wave.exit | Select-Object -First 4) -join '; '
              $report.Add("- $($wave.to_percent)% after: $exitPreview")
          }

          $report.Add('')
          $report.Add('## Evidence boundary')
          $report.Add('- This is a planning/production estimate, not a test-acceptance label.')
          $report.Add('- Commit count alone never raises the percentage.')
          $report.Add('- STATIC/COMPILE evidence does not imply PIE, DEVICE, VISUAL, PACING, or PERFORMANCE acceptance.')

          if ($gov.session_handoff -and $gov.session_handoff.unverified_acceptance) {
              $report.Add('')
              $report.Add('## Still awaiting human/device evidence')
              foreach ($item in @($gov.session_handoff.unverified_acceptance | Select-Object -First 8)) {
                  $report.Add("- $item")
              }
          }

          $report | Set-Content 'daily_manager_report.md' -Encoding UTF8

      - name: Post to Project Manager issue
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '96'
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = Get-Content 'daily_manager_report.md' -Raw
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $payload = @{ body = $body } | ConvertTo-Json -Depth 3
          $uri = "https://api.github.com/repos/$env:REPOSITORY/issues/$env:ISSUE_NUMBER/comments"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
