name: Daily Project Manager Report

on:
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * *'

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Post Shire Journey manager report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 200

      - name: Generate manager report
        shell: bash
        run: |
          if [ -f Scripts/daily_project_manager_report.py ]; then
            python3 Scripts/daily_project_manager_report.py > daily_manager_report.md
          else
            python3 - <<'PY' > daily_manager_report.md
          import json
          import subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          root = Path(".")
          gov = json.loads((root/"Data/ProjectGovernor.json").read_text(encoding="utf-8"))
          waves = json.loads((root/"Data/CompletionWaveMapV1.json").read_text(encoding="utf-8"))
          daily = gov.get("daily_progress_reporting", {})
          current = daily.get("current_planning_percent")
          if current is None:
              baseline = int(waves.get("baseline", {}).get("planning_completion_percent", 40))
              closed = str(gov.get("w00_final_closure", {}).get("status", "")).startswith("CLOSED")
              current = 42 if closed else baseline
          current = int(current)
          previous = int(daily.get("previous_planning_percent", current))

          def gl(*args):
              p = subprocess.run(["git", *args], capture_output=True, text=True, check=False)
              return [x.strip() for x in p.stdout.splitlines() if x.strip()] if p.returncode == 0 else []

          now = datetime.now(timezone.utc)
          since = now - timedelta(hours=24)
          merges = gl("log", f"--since={since.isoformat()}", "--merges", "--pretty=%h %s")[:8]
          changes = gl("log", f"--since={since.isoformat()}", "--no-merges", "--pretty=%h %s")[:12]
          head = (gl("rev-parse", "HEAD") or ["UNKNOWN"])[0]
          focus = gov.get("current_focus", {})
          gate = gov.get("active_gate", {})
          handoff = gov.get("session_handoff", {})

          wave = None
          for item in waves.get("waves", []):
              if int(item.get("from_percent", -1)) <= current < int(item.get("to_percent", 101)):
                  wave = item
                  break

          print("# Shire Journey — Daily Project Manager Report")
          print()
          print(f"- Generated UTC: {now:%Y-%m-%d %H:%M}")
          print(f"- Develop head observed: \`{head}\`")
          print(f"- Planning / production completion: **{current}%**")
          print(f"- 24h planning delta: **{current-previous:+d} percentage points**")
          print(f"- Active lane: **{focus.get('production_lane','UNKNOWN')}**")
          print(f"- Active gate: **{gate.get('id','UNKNOWN')}** — {gate.get('status','UNKNOWN')}")
          if wave:
              print(f"- Current wave: **{wave.get('id')} — {wave.get('name')}**")
              print(f"- Wave range: {wave.get('from_percent')}% → {wave.get('to_percent')}%")
          print()
          print("## Meaningful movement in the last 24 hours")
          if merges:
              for x in merges:
                  print(f"- Merge: {x}")
          if changes:
              for x in changes:
                  print(f"- Change: {x}")
          if not merges and not changes:
              print("- No repository commits recorded in the last 24 hours.")
          if wave:
              exits = "; ".join(wave.get("exit", [])[:4])
              print()
              print("## Next percentage unlock")
              print(f"- {wave.get('to_percent')}% after: {exits}")
          print()
          print("## Evidence boundary")
          print("- This is a planning/production estimate, not a test-acceptance label.")
          print("- Commit count alone never raises the percentage.")
          print("- STATIC/COMPILE evidence does not imply PIE, DEVICE, VISUAL, PACING, or PERFORMANCE acceptance.")
          pending = handoff.get("unverified_acceptance", [])
          if pending:
              print()
              print("## Still awaiting human/device evidence")
              for x in pending[:8]:
                  print(f"- {x}")
          PY
          fi

      - name: Post to Project Manager issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '96'
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          repo = os.environ["REPOSITORY"]
          issue = os.environ["ISSUE_NUMBER"]
          token = os.environ["GH_TOKEN"]
          body = open("daily_manager_report.md", "r", encoding="utf-8").read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{issue}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"GitHub issue comment failed: HTTP {response.status}")
          PY
