name: Daily Project Manager Report

on:
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * *'

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Post Shire Journey manager report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 200

      - name: Generate project-manager report
        run: python3 Scripts/daily_project_manager_report.py > daily_manager_report.md

      - name: Post report to manager issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '96'
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          issue = os.environ["ISSUE_NUMBER"]
          token = os.environ["GH_TOKEN"]
          body = open("daily_manager_report.md", "r", encoding="utf-8").read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{issue}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f"GitHub issue comment failed: HTTP {response.status}")
          PY
