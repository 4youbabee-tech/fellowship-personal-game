name: P1C01 Five-Lane Maximum Safe Source Preflight

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Data/ProjectGovernor.json'
      - 'Data/MaximumSafeProductionModeV1.json'
      - 'Scripts/p1c01_five_lane_preflight.py'
      - 'Scripts/test_p1c01_five_lane_preflight.py'
      - '.github/workflows/p1c01-five-lane-maxsafe.yml'
      - 'Scripts/stage_p1c01_adaptive_pbr_warehouse.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p1c01-five-safe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  independent_preparation_tracks:
    name: ${{ matrix.lane }} - read-only candidate preflight
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lane:
          - RUNTIME_BUILD
          - WAREHOUSE_ASSET_INTAKE
          - SKELETAL_CHARACTER_PREP
          - VISUAL_WORLD_PREP
          - GAMEPLAY_PRESENTATION_PREP
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact SHA without LFS or credentials persistence
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false

      - name: Prove exact head and run five-lane regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m unittest discover -s Scripts -p test_p1c01_five_lane_preflight.py -v

      - name: Produce complete bounded read-only lane report
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/p1c01_five_lane_preflight.py \
            --lane "${{ matrix.lane }}" \
            --output "$RUNNER_TEMP/p1c01-${{ matrix.lane }}-candidate-report.json"

      - name: Upload per-lane source/report artifact (no binaries or Unreal)
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-five-lane-${{ matrix.lane }}-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/p1c01-${{ matrix.lane }}-candidate-report.json
          if-no-files-found: error
          retention-days: 30
  persistent_cc0_intake:
    concurrency:
      group: warehouse-stage-${{ github.repository }}
      cancel-in-progress: false
    name: Hash verify and stage 99 FBX sources and 98 prepared PBR candidates (no UE)
    runs-on: [self-hosted, Windows, X64, ue4-27]
    timeout-minutes: 75
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      STAGING_WAREHOUSE: 'D:\actions-runner\_warehouse\ShireJourney'
    steps:
      - name: Exact-source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Verify one-writer contract and Python syntax
        shell: powershell
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_HEAD) { throw "PERSISTENT_INTAKE_HEAD_DRIFT" }
          & python -m py_compile Scripts/stage_p1c01_adaptive_pbr_warehouse.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $env:STAGING_WAREHOUSE -PathType Container)) { throw "PERSISTENT_WAREHOUSE_ABSENT" }
      - name: Fetch original certified 39 sources (no provider redownload)
        uses: actions/download-artifact@v4
        with:
          run-id: 37985180302
          name: p1c01-adaptive-polyhaven-source-fac5bba5fac633ed9989d3b5f180b46b3ed43817
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-39
      - name: Fetch 39 validated converted FBX and 1K PNG
        uses: actions/download-artifact@v4
        with:
          run-id: 37988147700
          name: p1c01-adaptive-pbr-08787c078fa1f4e52f15927ca9777fd22602626d
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pbr-39
      - name: Fetch next 60 certified sources (no provider redownload)
        uses: actions/download-artifact@v4
        with:
          run-id: 37988147489
          name: p1c01-adaptive-polyhaven-source-08787c078fa1f4e52f15927ca9777fd22602626d
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-60
      - name: Fetch 59 converted FBX and 1K PNG with quarantine
        uses: actions/download-artifact@v4
        with:
          run-id: 37988147489
          name: p1c01-adaptive-pbr-next-08787c078fa1f4e52f15927ca9777fd22602626d
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pbr-60
      - name: Commit wave 39 with SHA256+MD5 and >=6 GiB disk reserve
        shell: powershell
        run: |
          & python Scripts/stage_p1c01_adaptive_pbr_warehouse.py --source-root "$env:RUNNER_TEMP/source-39" --pbr-root "$env:RUNNER_TEMP/pbr-39" --warehouse-root "$env:STAGING_WAREHOUSE" --wave p1c01_wave39 --expected-source 39 --expected-prepared 39 --run-id "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit wave 60 without restaging the original 39
        shell: powershell
        run: |
          $existing=Join-Path $env:STAGING_WAREHOUSE '_p1c01_adaptive_polyhaven\p1c01_wave39\receipt_adaptive_pbr.json'
          & python Scripts/stage_p1c01_adaptive_pbr_warehouse.py --source-root "$env:RUNNER_TEMP/source-60" --pbr-root "$env:RUNNER_TEMP/pbr-60" --warehouse-root "$env:STAGING_WAREHOUSE" --wave p1c01_wave60 --expected-source 60 --expected-prepared 59 --reject-prior-ids "$existing" --run-id "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit canonical persistent warehouse receipts
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Scripts/audit_warehouse_inventory.ps1 -Root "$env:STAGING_WAREHOUSE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
