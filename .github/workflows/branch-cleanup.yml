name: Branch Cleanup

on:
  push:
    branches:
      - develop
    paths:
      - Data/BranchCleanupPlan.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Delete approved stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path("Data/BranchCleanupPlan.json").read_text(encoding="utf-8"))
          for protected in ("develop","main"):
              assert protected not in plan["delete_after_merge"], f"refusing to delete {protected}"
          print("\n".join(plan["delete_after_merge"]))
          PY

          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if [ "$branch" = "develop" ] || [ "$branch" = "main" ]; then
              echo "REFUSE protected branch: $branch"
              exit 91
            fi
            echo "Deleting stale branch: $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || {
              rc=$?
              echo "Branch delete returned $rc for $branch; treating missing/already-deleted refs as non-blocking."
            }
          done < <(python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path("Data/BranchCleanupPlan.json").read_text(encoding="utf-8"))
          for branch in plan["delete_after_merge"]:
              print(branch)
          PY
          )

      - name: Verify canonical branches remain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/develop" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/branches/main" >/dev/null
          echo "BRANCH_CLEANUP_PASS canonical=develop stable=main"
