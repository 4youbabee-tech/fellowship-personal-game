name: Branch Cleanup

on:
  push:
    branches:
      - develop
    paths:
      - Data/BranchCleanupPlan.json
      - Scripts/run_branch_cleanup.ps1
      - .github/workflows/branch-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup-${{ github.repository }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: cmd
    steps:
      - name: Exact-head local checkout of develop
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "GITEXE="
          for /f "delims=" %%G in ('where git.exe 2^>nul') do if not defined GITEXE set "GITEXE=%%G"
          if not defined GITEXE if exist "C:\Program Files\Git\cmd\git.exe" set "GITEXE=C:\Program Files\Git\cmd\git.exe"
          if not defined GITEXE if exist "C:\Program Files (x86)\Git\cmd\git.exe" set "GITEXE=C:\Program Files (x86)\Git\cmd\git.exe"
          if not defined GITEXE exit /b 70

          cd /d "%GITHUB_WORKSPACE%\.."
          if exist "%GITHUB_WORKSPACE%" rmdir /S /Q "%GITHUB_WORKSPACE%"
          if exist "%GITHUB_WORKSPACE%" exit /b 71
          mkdir "%GITHUB_WORKSPACE%"
          cd /d "%GITHUB_WORKSPACE%"

          "!GITEXE!" init
          if errorlevel 1 exit /b 72
          "!GITEXE!" remote add origin "https://x-access-token:%GH_TOKEN%@github.com/%GITHUB_REPOSITORY%.git"
          if errorlevel 1 exit /b 73

          set ATTEMPT=0
          :fetch
          set /a ATTEMPT+=1
          echo BRANCH_CLEANUP_EXACT_FETCH attempt=!ATTEMPT!/3 ref=develop
          "!GITEXE!" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch --no-tags --prune --depth=2 origin develop
          if not errorlevel 1 goto fetched
          if !ATTEMPT! GEQ 3 exit /b 74
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 3"
          goto fetch

          :fetched
          "!GITEXE!" checkout -f FETCH_HEAD
          if errorlevel 1 exit /b 75
          for /f "delims=" %%S in ('"!GITEXE!" rev-parse HEAD') do set "CHECKED_SHA=%%S"
          for /f "tokens=1" %%S in ('"!GITEXE!" ls-remote origin refs/heads/develop') do set "REMOTE_SHA=%%S"
          if not defined REMOTE_SHA exit /b 76
          if /I not "!CHECKED_SHA!"=="!REMOTE_SHA!" (
            echo ERROR: develop checkout mismatch expected=!REMOTE_SHA! actual=!CHECKED_SHA!
            exit /b 77
          )
          if not exist "Data\BranchCleanupPlan.json" exit /b 78
          echo BRANCH_CLEANUP_EXACT_CHECKOUT_PASS sha=!CHECKED_SHA!

      - name: Verify runner session health
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\verify_runner_session.ps1"

      - name: Delete approved stale branches safely
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\run_branch_cleanup.ps1"
