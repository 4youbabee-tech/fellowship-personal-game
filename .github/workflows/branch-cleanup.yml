name: Branch Cleanup

on:
  push:
    branches:
      - develop
    paths:
      - Data/BranchCleanupPlan.json
      - Scripts/run_branch_cleanup.ps1
      - .github/workflows/branch-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup-${{ github.repository }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout develop administration head
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 2
          persist-credentials: false

      - name: Verify develop checkout
        run: |
          $local = (git rev-parse HEAD).Trim()
          $remoteLine = git ls-remote "https://github.com/${{ github.repository }}.git" "refs/heads/develop"
          $remote = ($remoteLine -split "\s+")[0].Trim()
          if (-not $remote -or $local -ne $remote) {
            throw "BRANCH_CLEANUP_HEAD_MISMATCH expected=$remote actual=$local"
          }
          if (-not (Test-Path -LiteralPath "Data/BranchCleanupPlan.json" -PathType Leaf)) {
            throw "BRANCH_CLEANUP_PLAN_MISSING"
          }
          Write-Host "BRANCH_CLEANUP_EXACT_CHECKOUT_PASS sha=$local"

      - name: Delete approved stale branches safely
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\Scripts\run_branch_cleanup.ps1"
