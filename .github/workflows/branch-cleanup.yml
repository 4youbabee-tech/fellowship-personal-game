name: Branch Cleanup

on:
  push:
    branches:
      - develop
    paths:
      - Data/BranchCleanupPlan.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-cleanup-${{ github.repository }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Delete approved stale branches
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $plan = Get-Content -LiteralPath "Data/BranchCleanupPlan.json" -Raw | ConvertFrom-Json
          foreach ($protected in @("develop","main")) {
            if (@($plan.delete_after_merge) -contains $protected) {
              throw "Refusing to delete protected branch: $protected"
            }
          }

          foreach ($branch in @($plan.delete_after_merge)) {
            if ([string]::IsNullOrWhiteSpace([string]$branch)) { continue }
            if ($branch -in @("develop","main")) { throw "Refusing protected branch: $branch" }
            Write-Host "Deleting stale branch: $branch"
            & git push origin --delete ([string]$branch)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Delete returned $LASTEXITCODE for $branch; treating missing/already-deleted refs as non-blocking."
            }
          }

      - name: Verify canonical branches remain
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $refs = & git ls-remote --heads origin refs/heads/develop refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw "Unable to query canonical refs." }
          if (($refs | Select-String "refs/heads/develop").Count -lt 1) { throw "develop missing after cleanup" }
          if (($refs | Select-String "refs/heads/main").Count -lt 1) { throw "main missing after cleanup" }
          Write-Host "BRANCH_CLEANUP_PASS canonical=develop stable=main"
