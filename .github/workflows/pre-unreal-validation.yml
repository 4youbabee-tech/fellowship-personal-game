name: Pre-Unreal Validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '*/20 * * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate project structure
        run: python Scripts/pre_unreal_validate.py

      - name: Validate project governor
        run: python Scripts/project_governor.py

      - name: Audit production asset source quality
        run: python Scripts/asset_quality_audit.py
