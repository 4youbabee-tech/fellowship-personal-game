name: Pre-Unreal Validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pre-unreal-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Static/policy validation must never consume or mutate the dedicated UE4 device.
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact validation head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) {
            throw "PRE_UNREAL_HEAD_MISMATCH expected=$($env:TARGET_SHA) actual=$actual"
          }
          if (-not (Test-Path -LiteralPath "ShireJourney.uproject" -PathType Leaf)) {
            throw "PRE_UNREAL_PROJECT_MISSING"
          }
          Write-Host "PRE_UNREAL_EXACT_CHECKOUT_PASS sha=$actual runner=$env:RUNNER_NAME"

      - name: Set up deterministic Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          check-latest: false

      - name: Bind Python executable
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PRE_UNREAL_PYTHON_PASS path=$python"

      - name: Test Unreal validation lane selection
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Scripts\test_unreal_classifier.ps1"

      - name: Validate project structure
        run: '"%PYTHON_EXE%" Scripts/pre_unreal_validate.py'

      - name: Validate project governor
        run: '"%PYTHON_EXE%" Scripts/project_governor.py'

      - name: Test asset audit memory and failure handling
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_asset_quality_audit.py" -v'

      - name: Audit production asset source quality
        run: '"%PYTHON_EXE%" Scripts/asset_quality_audit.py --strict'

      - name: Audit production readiness contracts
        run: '"%PYTHON_EXE%" Scripts/production_readiness_audit.py'

      - name: Run deep project audit
        run: '"%PYTHON_EXE%" Scripts/deep_project_audit.py'

      - name: Test runtime observation failure handling
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_runtime_smoke.py" -v'

      - name: Test runtime audit contract registry
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_runtime_audit_contracts.py" -v'

      - name: Test structural source contracts
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_source_contracts.py" -v'

      - name: Test Governor semantic contracts
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_governance_contracts.py" -v'

      - name: Test warning-debt guard semantics
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_warning_debt_guard.py" -v'

      - name: Test deep project audit semantics
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_deep_project_audit.py" -v'

      - name: Test governor evidence scope
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_governor_handoff.py" -v'

      - name: Guard streaming cancellation source contracts
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_streaming_cancellation_contract.py" -v'

      - name: Test live governor evidence selection
        run: '"%PYTHON_EXE%" -m unittest discover -s Scripts -p "test_live_governor_status.py" -v'
