name: Pre-Unreal Validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '*/20 * * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate project structure
        run: python Scripts/pre_unreal_validate.py

      - name: Validate project governor
        run: python Scripts/project_governor.py

      - name: Audit production asset source quality
        run: python Scripts/asset_quality_audit.py --strict

      - name: Audit production readiness contracts
        run: python Scripts/production_readiness_audit.py

      - name: Run deep project audit
        run: python Scripts/deep_project_audit.py

      - name: Test runtime observation failure handling
        run: python -m unittest discover -s Scripts -p 'test_runtime_smoke.py' -v

      - name: Test warning-debt guard semantics
        run: python -m unittest discover -s Scripts -p 'test_warning_debt_guard.py' -v

      - name: Test deep project audit semantics
        run: python -m unittest discover -s Scripts -p 'test_deep_project_audit.py' -v

      - name: Test governor evidence scope
        run: python -m unittest discover -s Scripts -p 'test_governor_handoff.py' -v

      - name: Guard streaming cancellation source contracts
        run: python -m unittest discover -s Scripts -p 'test_streaming_cancellation_contract.py' -v


      - name: Test live governor evidence selection
        run: python -m unittest discover -s Scripts -p 'test_live_governor_status.py' -v
