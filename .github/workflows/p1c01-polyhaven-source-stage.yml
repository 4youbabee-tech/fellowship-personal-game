name: P1C01 Poly Haven Photoreal Source Stage

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Data/P1C01PhotorealSourcePilotV1.json'
      - 'Scripts/stage_p1c01_polyhaven.py'
      - 'Scripts/test_p1c01_polyhaven_source_intake.py'
      - 'Scripts/build_p1c01_png_materials.py'
      - 'Scripts/test_p1c01_polyhaven_png_conversion.py'
      - '.github/workflows/p1c01-polyhaven-source-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1c01-polyhaven-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hosted_source_intake:
    name: Bounded 1K native-FBX CC0 source staging (NO UE4)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_ACTION: ${{ github.event.action || 'manual' }}
      PR_BEFORE: ${{ github.event.before || '' }}
    steps:
      - name: Checkout exact candidate head without LFS hydration
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 16
          persist-credentials: false
          lfs: false

      - name: Detect exact source-input changes (skip documentation-only push)
        id: source_delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          reason=initial_or_manual
          base=none
          needs_stage=true
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$PR_ACTION" == 'synchronize' ]]; then
            base="$PR_BEFORE"
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^)"
            fi
            changed="$(git diff --name-only "$base" HEAD)"
            if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/p1c01-polyhaven-source-stage\.yml|Data/P1C01PhotorealSourcePilotV1\.json|Scripts/(stage_p1c01_polyhaven|test_p1c01_polyhaven_source_intake|build_p1c01_png_materials|test_p1c01_polyhaven_png_conversion)\.py)$'; then
              reason=source_inputs_changed
            else
              needs_stage=false
              reason=docs_only_no_source_changes
            fi
          fi
          echo "needs_stage=$needs_stage" >> "$GITHUB_OUTPUT"
          echo "P1C01_SOURCE_CHANGE_GATE needs_stage=$needs_stage reason=$reason base=$base"

      - name: Verify exact SHA and run fast offline source-unit tests
        if: steps.source_delta.outputs.needs_stage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m unittest discover -s Scripts -p test_p1c01_polyhaven_source_intake.py -v

      - name: Stage bounded source-only Poly Haven 1K FBX and textures
        if: steps.source_delta.outputs.needs_stage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/stage_p1c01_polyhaven.py \
            --manifest Data/P1C01PhotorealSourcePilotV1.json \
            --output "$RUNNER_TEMP/shire-p1c01-polyhaven-photoreal" \
            --max-total-mb 80

      - name: Verify source-receipt truth boundary
        if: steps.source_delta.outputs.needs_stage == 'true'
        id: source_gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'shire-p1c01-polyhaven-photoreal'/'p1c01_polyhaven_source_receipt.json'
          j=json.loads(p.read_text(encoding='utf-8'))
          assert j['execution_scope']=='HOSTED_SOURCE_ONLY_NO_UNREAL'
          assert j['source_assets_staged']+j['source_assets_quarantined']==5
          assert j['total_staged_file_bytes']<=80*1024*1024
          assert all(r['stage'] in ('STAGED_SOURCE_ONLY','QUARANTINED_SOURCE_INTAKE') for r in j['asset_results'])
          print('P1C01_POLYHAVEN_RECEIPT_VALID count=5 staged='+str(j['source_assets_staged'])+' quarantined='+str(j['source_assets_quarantined']))
          PY
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'shire-p1c01-polyhaven-photoreal'/'p1c01_polyhaven_source_receipt.json'
          j=json.loads(p.read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:
            out.write('five_ready='+str(j['source_assets_staged']==5 and j['source_assets_quarantined']==0).lower()+'\n')
          PY

      - name: Set up Python for hosted source texture conversion
        if: steps.source_gate.outputs.five_ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert staged source maps to 1K game-ready PNG candidate
        if: steps.source_gate.outputs.five_ready == 'true'
        shell: bash
        env:
          OPENCV_IO_ENABLE_OPENEXR: '1'
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'numpy>=1.26,<3' 'Pillow>=10,<13' 'opencv-python-headless>=4.9,<5'
          python -m unittest discover -s Scripts -p test_p1c01_polyhaven_png_conversion.py -v
          python Scripts/build_p1c01_png_materials.py \
            --source "$RUNNER_TEMP/shire-p1c01-polyhaven-photoreal/assets" \
            --output "$RUNNER_TEMP/shire-p1c01-polyhaven-png"

      - name: Verify five preserved FBX meshes and nineteen 1K PNG candidates
        if: steps.source_gate.outputs.five_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ['RUNNER_TEMP'])
          src=root/'shire-p1c01-polyhaven-photoreal'/'assets'
          dst=root/'shire-p1c01-polyhaven-png'
          receipt=json.loads((dst/'p1c01_png_material_conversion_receipt.json').read_text())
          assert receipt['status']=='SOURCE_TEXTURES_CONVERTED_STATIC_ONLY'
          assert receipt['asset_count']==5
          p=list(dst.rglob('*.png'));f=list(dst.rglob('*.fbx'))
          assert len(p)==19 and len(f)==5,(len(p),len(f))
          for png in p:
            with Image.open(png) as im: assert im.size==(1024,1024)
          for item in receipt['assets']:
            target=dst/item['fbx_path']; original=src/item['asset_id']/(item['asset_id']+'.fbx')
            assert hashlib.sha256(target.read_bytes()).hexdigest()==hashlib.sha256(original.read_bytes()).hexdigest()==item['fbx_sha256']
          print('P1C01_POLYHAVEN_PNG_QC_PASS meshes=5 textures=19; NOT_UE4_IMPORTED')
          PY

      - name: Upload converted static FBX and PNG source candidates
        if: steps.source_gate.outputs.five_ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-polyhaven-fbx-png-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/shire-p1c01-polyhaven-png
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload CC0 source candidates and receipt
        if: always() && steps.source_delta.outputs.needs_stage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p1c01-polyhaven-source-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/shire-p1c01-polyhaven-photoreal
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
