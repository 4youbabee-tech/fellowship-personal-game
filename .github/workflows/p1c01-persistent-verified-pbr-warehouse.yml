name: P1C01 Persistent Verified Poly Haven PBR Source Intake
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/p1c01-persistent-verified-pbr-warehouse.yml'
      - 'Scripts/stage_p1c01_adaptive_pbr_warehouse.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: warehouse-stage-${{ github.repository }}
  cancel-in-progress: false
jobs:
  persistent_cc0_intake:
    name: Hash verify and stage 99 FBX sources and 98 prepared PBR candidates (no UE)
    runs-on: [self-hosted, Windows, X64, ue4-27]
    timeout-minutes: 75
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      STAGING_WAREHOUSE: 'D:\actions-runner\_warehouse\ShireJourney'
    steps:
      - name: Exact-source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Verify one-writer contract and Python syntax
        shell: powershell
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_HEAD) { throw "PERSISTENT_INTAKE_HEAD_DRIFT" }
          $candidates=@(
            'D:\actions-runner\_work\_tool\Python\3.11.9\x64\python.exe',
            (Join-Path $env:RUNNER_TOOL_CACHE 'Python\3.11.9\x64\python.exe')
          )
          $tool=Get-Command python.exe -ErrorAction SilentlyContinue
          if ($tool) { $candidates+= [string]$tool.Source }
          $py=$candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $py) { throw "PERSISTENT_INTAKE_PYTHON_TOOL_MISSING" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("SHIRE_PYTHON="+$py)
          & $py -m py_compile Scripts/stage_p1c01_adaptive_pbr_warehouse.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $env:STAGING_WAREHOUSE -PathType Container)) { throw "PERSISTENT_WAREHOUSE_ABSENT" }
      - name: Fetch original certified 39 sources (no provider redownload)
        uses: actions/download-artifact@v4
        with:
          run-id: 37985180302
          name: p1c01-adaptive-polyhaven-source-fac5bba5fac633ed9989d3b5f180b46b3ed43817
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-39
      - name: Fetch 39 validated converted FBX and 1K PNG
        uses: actions/download-artifact@v4
        with:
          run-id: 37988147700
          name: p1c01-adaptive-pbr-08787c078fa1f4e52f15927ca9777fd22602626d
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pbr-39
      - name: Fetch next 60 certified sources (no provider redownload)
        uses: actions/download-artifact@v4
        with:
          run-id: 37988147489
          name: p1c01-adaptive-polyhaven-source-08787c078fa1f4e52f15927ca9777fd22602626d
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-60
      - name: Fetch 59 converted FBX and 1K PNG with quarantine
        uses: actions/download-artifact@v4
        with:
          run-id: 37988147489
          name: p1c01-adaptive-pbr-next-08787c078fa1f4e52f15927ca9777fd22602626d
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pbr-60
      - name: Commit wave 39 with SHA256+MD5 and >=6 GiB disk reserve
        shell: powershell
        run: |
          & $env:SHIRE_PYTHON Scripts/stage_p1c01_adaptive_pbr_warehouse.py --source-root "$env:RUNNER_TEMP/source-39" --pbr-root "$env:RUNNER_TEMP/pbr-39" --warehouse-root "$env:STAGING_WAREHOUSE" --wave p1c01_wave39 --expected-source 39 --expected-prepared 39 --run-id "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit wave 60 without restaging the original 39
        shell: powershell
        run: |
          $existing=Join-Path $env:STAGING_WAREHOUSE '_p1c01_adaptive_polyhaven\p1c01_wave39\receipt_adaptive_pbr.json'
          & $env:SHIRE_PYTHON Scripts/stage_p1c01_adaptive_pbr_warehouse.py --source-root "$env:RUNNER_TEMP/source-60" --pbr-root "$env:RUNNER_TEMP/pbr-60" --warehouse-root "$env:STAGING_WAREHOUSE" --wave p1c01_wave60 --expected-source 60 --expected-prepared 59 --reject-prior-ids "$existing" --run-id "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit canonical persistent warehouse receipts
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Scripts/audit_warehouse_inventory.ps1 -Root "$env:STAGING_WAREHOUSE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
