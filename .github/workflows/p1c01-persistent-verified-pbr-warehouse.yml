name: P1C01 Persistent Verified Poly Haven PBR Source Intake
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: warehouse-stage-${{ github.repository }}
  cancel-in-progress: false
jobs:
  persistent_cc0_intake:
    name: Hash verify and stage 99 FBX sources and 98 prepared PBR candidates (no UE)
    runs-on: [self-hosted, Windows, X64, ue4-27]
    timeout-minutes: 30
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      STAGING_WAREHOUSE: 'D:\actions-runner\_warehouse\ShireJourney'
    steps:
      - name: Exact-source checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Verify one-writer contract and Python syntax
        shell: powershell
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_HEAD) { throw "PERSISTENT_INTAKE_HEAD_DRIFT" }
          $candidates=@(
            'D:\actions-runner\_work\_tool\Python\3.11.9\x64\python.exe',
            (Join-Path $env:RUNNER_TOOL_CACHE 'Python\3.11.9\x64\python.exe')
          )
          $tool=Get-Command python.exe -ErrorAction SilentlyContinue
          if ($tool) { $candidates+= [string]$tool.Source }
          $py=$candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $py) { throw "PERSISTENT_INTAKE_PYTHON_TOOL_MISSING" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ("SHIRE_PYTHON="+$py)
          & $py -m py_compile Scripts/stage_p1c01_adaptive_pbr_warehouse.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $env:STAGING_WAREHOUSE -PathType Container)) { throw "PERSISTENT_WAREHOUSE_ABSENT" }

      - name: Check saved wave 39 using full SHA256, avoid unnecessary download
        id: reuse
        shell: powershell
        run: |
          & $env:SHIRE_PYTHON Scripts/stage_p1c01_adaptive_pbr_warehouse.py --warehouse-root "$env:STAGING_WAREHOUSE" --wave p1c01_wave39 --expected-source 39 --expected-prepared 39 --check-existing
          $code=$LASTEXITCODE
          if ($code -eq 0) { "already=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; exit 0 }
          if ($code -eq 3) { "already=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; exit 0 }
          exit $code

      - name: Resume verified 39 original sources in 4 MiB durable checkpoints
        if: steps.reuse.outputs.already == 'false'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & $env:SHIRE_PYTHON Scripts/resume_p1c01_artifact_checkpoint.py --manifest Data/P1C01PinnedArtifactCheckpointsV1.json --key source39 --warehouse-root "$env:STAGING_WAREHOUSE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resume 39 converted FBX/PBR without refetching valid chunks
        if: steps.reuse.outputs.already == 'false'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & $env:SHIRE_PYTHON Scripts/resume_p1c01_artifact_checkpoint.py --manifest Data/P1C01PinnedArtifactCheckpointsV1.json --key pbr39 --warehouse-root "$env:STAGING_WAREHOUSE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save wave39 permanently and immediately audit receipts
        if: steps.reuse.outputs.already == 'false'
        shell: powershell
        run: |
          $root=Join-Path $env:STAGING_WAREHOUSE '_p1c01_transfer_checkpoints'
          $src=Join-Path $root 'artifact_11643315007\extracted'
          $pbr=Join-Path $root 'artifact_11643837934\extracted'
          & $env:SHIRE_PYTHON Scripts/stage_p1c01_adaptive_pbr_warehouse.py --source-root "$src" --pbr-root "$pbr" --warehouse-root "$env:STAGING_WAREHOUSE" --wave p1c01_wave39 --expected-source 39 --expected-prepared 39 --run-id "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit canonical warehouse after persistent save
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Scripts/audit_warehouse_inventory.ps1 -Root "$env:STAGING_WAREHOUSE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
