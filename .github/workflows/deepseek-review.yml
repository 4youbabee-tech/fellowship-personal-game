name: DeepSeek Code Review

on:
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  review:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ue4-27
    timeout-minutes: 10
    steps:
      - uses: hustcer/deepseek-review@v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_KEY }}
